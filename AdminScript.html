<script>
/**
 * ====================================================================
 * ADMIN CENTER CLIENT-SIDE MODULE
 * ====================================================================
 * จัดการหน้าจอศูนย์รวมการตั้งค่าและกำหนดสิทธิ์ (Admin Center):
 * - Screen 1: ผู้ใช้งานและกำหนดสิทธิ์ (Role, AllowedApps, WT Sites, RDP Sites, Password)
 * - Screen 2: ตั้งค่าส่วนกลาง & OTP (Telegram Bot, Fallback Password, Expiry)
 * - Screen 3: ตั้งค่าระบบติดตามงาน (Notification rules, Sites CRUD + Telegram Group IDs)
 * - Screen 4: ตั้งค่าระบบรีโมต & กลุ่มงาน (Connection Defaults, RDP Groups CRUD, Installer)
 * - Screen 5: ประวัติระบบ & โอนย้ายข้อมูล (Audit Logs, 1-Click Migration from legacy sheet)
 */

const adminState = {
  currentScreen: 'users',
  users: [],
  settings: {},
  wtSites: [],
  wtSiteChatIds: {},
  rdpGroups: [],
  auditLogs: [],
  spreadsheetUrl: "",
  editingUsername: null,
  editingGroupId: null,
  isLoading: false,
  bulkMode: false
};
window.adminState = adminState;

/**
 * เริ่มต้นทำงานเมื่อเปิดเข้าสู่หน้าจอ Admin Center
 */
function initAdminApp() {
  const isAdmin = (state && state.currentUser && state.currentUser.role === 'Admin');
  if (!isAdmin) {
    showToast("คุณไม่มีสิทธิ์เข้าถึงระบบผู้ดูแลระบบ (Admin Only)", "error");
    openAppLauncher();
    return;
  }

  // ผูกตัวกรองค้นหา Audit Logs
  const logSearch = document.getElementById("adminLogSearchInput");
  if (logSearch && !logSearch.dataset.bound) {
    logSearch.dataset.bound = "true";
    logSearch.addEventListener("input", () => {
      renderAdminAuditLogs();
    });
  }

  // โหลดข้อมูลภาพรวมระบบ Admin
  loadAdminData();
}

/**
 * สลับหน้าจอย่อยในแถบเมนูข้าง (Sidebar)
 */
function switchAdminScreen(screenId) {
  adminState.currentScreen = screenId;

  // ปรับสไตล์ปุ่มนำทาง Sidebar
  const navBtns = document.querySelectorAll(".admin-nav-btn");
  navBtns.forEach(btn => {
    btn.classList.remove("active");
  });

  const activeBtn = document.getElementById(`admin-nav-${screenId}`);
  if (activeBtn) activeBtn.classList.add("active");

  // สลับการแสดงผล Container
  const screens = [
    { id: 'users', el: document.getElementById('admin-screen-users') },
    { id: 'global', el: document.getElementById('admin-screen-global') },
    { id: 'worktracker', el: document.getElementById('admin-screen-worktracker') },
    { id: 'rdp', el: document.getElementById('admin-screen-rdp') },
    { id: 'calendar', el: document.getElementById('admin-screen-calendar') },
    { id: 'migration', el: document.getElementById('admin-screen-migration') }
  ];

  screens.forEach(s => {
    if (s.el) {
      if (s.id === screenId) {
        s.el.classList.remove("hidden");
      } else {
        s.el.classList.add("hidden");
      }
    }
  });

  // ถ้ายังไม่มีข้อมูล หรือต้องการ render หน้าที่เลือก
  if (screenId === 'users') renderAdminUsersTable();
  if (screenId === 'global') populateGlobalSettings();
  if (screenId === 'worktracker') {
    populateWtSettings();
    renderAdminSitesList();
  }
  if (screenId === 'rdp') {
    populateRdpSettings();
    renderAdminGroupsTable();
  }
  if (screenId === 'calendar') populateCalendarSettings();
  if (screenId === 'migration') renderAdminAuditLogs();
}

/**
 * โหลดข้อมูลภาพรวมระบบทั้งหมดสำหรับ Admin Center
 */
function loadAdminData(forceRefresh = false) {
  if (adminState.isLoading && !forceRefresh) return;
  adminState.isLoading = true;

  const currentUsername = (state && state.currentUser) ? state.currentUser.username : "";

  google.script.run
    .withSuccessHandler(res => {
      adminState.isLoading = false;

      if (res && res.success) {
        adminState.users = res.users || [];
        adminState.settings = res.settings || {};
        adminState.wtSites = res.wtSites || res.workTrackerSites || (res.settings && res.settings.SITES) || (window.state && state.sites) || [];
        adminState.rdpSites = res.rdpSites || (window.rdpState && rdpState.sites) || [];
        adminState.wtSiteChatIds = (res.settings && (res.settings.SITE_TELEGRAM_CHAT_IDS || res.settings.SITE_CHAT_IDS)) ? (res.settings.SITE_TELEGRAM_CHAT_IDS || res.settings.SITE_CHAT_IDS) : {};
        adminState.rdpGroups = res.rdpGroups || [];
        adminState.auditLogs = res.auditLogs || [];
        adminState.spreadsheetUrl = res.spreadsheetUrl || res.sheetUrl || "";

        // ซิงค์ข้อมูลกับ Global States เพื่อให้ทั้งระบบมองเห็นข้อมูลไซต์ร่วมกัน
        if (window.state) {
          state.allSites = adminState.wtSites;
          if (state.currentUser && state.currentUser.role === 'Admin') {
            state.sites = adminState.wtSites;
          }
          state.users = adminState.users;
          if (typeof syncWorkTrackerDropdowns === 'function') {
            syncWorkTrackerDropdowns();
          }
        }
        if (window.rdpState) {
          if (!rdpState.sites || rdpState.sites.length === 0) rdpState.sites = adminState.rdpSites;
          rdpState.groups = adminState.rdpGroups;
        }

        // ปรับปรุง Link ไปยัง Google Sheet
        const sheetLink = document.getElementById("adminSheetLinkBtn");
        if (sheetLink && adminState.spreadsheetUrl) {
          sheetLink.href = adminState.spreadsheetUrl;
        }
        const wtSheetLink = document.getElementById("adminWtSheetLinkBtn");
        if (wtSheetLink && adminState.spreadsheetUrl) {
          wtSheetLink.href = adminState.spreadsheetUrl;
        }

        // Render หน้าจอปัจจุบัน
        switchAdminScreen(adminState.currentScreen);
      } else {
        showToast((res && res.message) || "ไม่สามารถโหลดข้อมูล Admin ได้", "error");
      }
    })
    .withFailureHandler(err => {
      adminState.isLoading = false;
      showToast("โหลดข้อมูล Admin ไม่สำเร็จ: " + (err.message || err), "error");
    })
    .getAdminOverviewData(currentUsername);
}

// --------------------------------------------------------------------
// SCREEN 1: USERS & PERMISSIONS MATRIX
// --------------------------------------------------------------------

function renderAdminUsersTable() {
  const tbody = document.getElementById("adminUsersTableBody");
  if (!tbody) return;

  if (adminState.users.length === 0) {
    tbody.innerHTML = `
      <tr>
        <td colspan="8" class="px-4 py-8 text-center text-[#6E6862] text-xs">
          ยังไม่มีข้อมูลผู้ใช้งานในระบบ
        </td>
      </tr>
    `;
    return;
  }

  tbody.innerHTML = adminState.users.map(u => {
    const isCurrentUser = (state && state.currentUser && state.currentUser.username.toLowerCase() === u.username.toLowerCase());
    
    // Parse Allowed Apps
    let allowedApps = [];
    if (Array.isArray(u.allowedApps)) {
      allowedApps = u.allowedApps;
    } else if (typeof u.allowedApps === 'string') {
      try { allowedApps = JSON.parse(u.allowedApps); } catch (e) { allowedApps = ['work_tracker', 'rdp_manager']; }
    } else {
      allowedApps = ['work_tracker', 'rdp_manager'];
    }

    // App Badges
    const appBadges = [];
    if (allowedApps.includes('work_tracker')) appBadges.push('<span class="px-1.5 py-0.5 rounded text-[10px] font-bold bg-amber-50 text-amber-800 border border-amber-200">WT</span>');
    if (allowedApps.includes('rdp_manager')) appBadges.push('<span class="px-1.5 py-0.5 rounded text-[10px] font-bold bg-blue-50 text-blue-800 border border-blue-200">RDP</span>');
    if (allowedApps.includes('site_calendar')) appBadges.push('<span class="px-1.5 py-0.5 rounded text-[10px] font-bold bg-emerald-50 text-emerald-800 border border-emerald-200">Calendar</span>');
    if (allowedApps.includes('admin') || u.role === 'Admin') appBadges.push('<span class="px-1.5 py-0.5 rounded text-[10px] font-bold bg-purple-50 text-purple-800 border border-purple-200">Admin</span>');

    // Sites permissions summary
    let wtSitesDesc = "ทุกไซต์งาน";
    if (u.allowedSites && u.allowedSites !== 'ALL') {
      try {
        const arr = Array.isArray(u.allowedSites) ? u.allowedSites : JSON.parse(u.allowedSites);
        wtSitesDesc = `${arr.length} ไซต์`;
      } catch(e) {
        wtSitesDesc = String(u.allowedSites);
      }
    }

    let rdpSitesDesc = "ทุกไซต์งาน";
    if (u.allowedRdpSites && u.allowedRdpSites !== 'ALL') {
      try {
        const arr = Array.isArray(u.allowedRdpSites) ? u.allowedRdpSites : JSON.parse(u.allowedRdpSites);
        rdpSitesDesc = `${arr.length} ไซต์`;
      } catch(e) {
        rdpSitesDesc = String(u.allowedRdpSites);
      }
    }

    return `
      <tr class="hover:bg-[#FAF8F2] transition-colors">
        <td class="px-4 py-3 align-middle font-mono font-bold text-[#201E1C]">
          ${escapeHtml(u.username)}
          ${isCurrentUser ? '<span class="ml-1 text-[10px] text-[#2491FA] font-sans font-bold">(คุณ)</span>' : ''}
        </td>
        <td class="px-4 py-3 align-middle">
          <div class="font-bold text-[#201E1C]">${escapeHtml(u.fullName)}</div>
          <div class="text-[10px] font-bold uppercase ${u.role === 'Admin' ? 'text-purple-600' : (u.role === 'Supervisor' ? 'text-blue-600' : 'text-[#6E6862]')}">
            ${escapeHtml(u.role)}
          </div>
        </td>
        <td class="px-4 py-3 align-middle">
          <div class="flex items-center gap-1 flex-wrap">
            ${appBadges.join("")}
          </div>
        </td>
        <td class="px-4 py-3 align-middle font-mono text-xs text-[#6E6862]">
          ${escapeHtml(u.telegramChatId || '-')}
        </td>
        <td class="px-4 py-3 align-middle text-xs">
          <span class="inline-flex items-center px-2 py-0.5 rounded text-[11px] font-medium bg-[#EDE7DA] text-[#201E1C]">
            ${escapeHtml(wtSitesDesc)}
          </span>
        </td>
        <td class="px-4 py-3 align-middle text-xs">
          <span class="inline-flex items-center px-2 py-0.5 rounded text-[11px] font-medium bg-[#EDE7DA] text-[#201E1C]">
            ${escapeHtml(rdpSitesDesc)}
          </span>
        </td>
        <td class="px-4 py-3 align-middle">
          <span class="inline-flex items-center px-2 py-0.5 rounded-full text-[10px] font-bold ${u.status === 'Active' ? 'bg-emerald-50 text-emerald-800 border border-emerald-200' : 'bg-rose-50 text-rose-800 border border-rose-200'}">
            ${u.status === 'Active' ? 'Active' : 'Inactive'}
          </span>
        </td>
        <td class="px-4 py-3 align-middle text-right">
          <div class="flex items-center justify-end gap-1">
            <button type="button" onclick="editAdminUser('${escapeHtml(u.username)}')"
                    class="p-1.5 text-[#6E6862] hover:text-[#2491FA] hover:bg-white rounded-lg transition-colors cursor-pointer" title="แก้ไขสิทธิ์">
              <i class="fa-solid fa-pen-to-square"></i>
            </button>
            ${!isCurrentUser ? `
            <button type="button" onclick="deleteAdminUserConfirm('${escapeHtml(u.username)}')"
                    class="p-1.5 text-[#6E6862] hover:text-rose-600 hover:bg-white rounded-lg transition-colors cursor-pointer" title="ลบผู้ใช้">
              <i class="fa-solid fa-trash-can"></i>
            </button>
            ` : ''}
          </div>
        </td>
      </tr>
    `;
  }).join("");
}

function openAdminUserForm(user = null) {
  const container = document.getElementById("adminUserFormContainer");
  const formTitle = document.getElementById("adminUserFormTitle");
  const passHint = document.getElementById("admin-user-pass-hint");

  adminState.editingUsername = user ? user.username : null;

  if (user) {
    if (formTitle) formTitle.textContent = `✏️ แก้ไขข้อมูลผู้ใช้: ${user.username}`;
    document.getElementById("admin-user-username").value = user.username || "";
    document.getElementById("admin-user-username").readOnly = true;
    document.getElementById("admin-user-fullname").value = user.fullName || "";
    document.getElementById("admin-user-role").value = user.role || "Member";
    document.getElementById("admin-user-chatid").value = user.telegramChatId || "";
    document.getElementById("admin-user-password").value = "";
    document.getElementById("admin-user-status").value = user.status || "Active";
    if (passHint) passHint.textContent = "เว้นว่างไว้หากต้องการใช้รหัสผ่านเดิม";

    // Set Allowed Apps
    let allowedApps = [];
    if (Array.isArray(user.allowedApps)) allowedApps = user.allowedApps;
    else if (typeof user.allowedApps === 'string') {
      try { allowedApps = JSON.parse(user.allowedApps); } catch(e) { allowedApps = ['work_tracker', 'rdp_manager', 'site_calendar']; }
    } else allowedApps = ['work_tracker', 'rdp_manager', 'site_calendar'];

    document.getElementById("perm-app-worktracker").checked = allowedApps.includes('work_tracker');
    document.getElementById("perm-app-rdp").checked = allowedApps.includes('rdp_manager');
    document.getElementById("perm-app-calendar").checked = allowedApps.includes('site_calendar');
    document.getElementById("perm-app-admin").checked = allowedApps.includes('admin') || user.role === 'Admin';

    // Set WT Sites
    renderWtSiteCheckboxes(user.allowedSites);

    // Set RDP Sites
    renderRdpSiteCheckboxes(user.allowedRdpSites);

  } else {
    if (formTitle) formTitle.textContent = "➕ เพิ่มผู้ใช้ใหม่และกำหนดสิทธิ์";
    document.getElementById("admin-user-username").value = "";
    document.getElementById("admin-user-username").readOnly = false;
    document.getElementById("admin-user-fullname").value = "";
    document.getElementById("admin-user-role").value = "Member";
    document.getElementById("admin-user-chatid").value = "";
    document.getElementById("admin-user-password").value = "";
    document.getElementById("admin-user-status").value = "Active";
    if (passHint) passHint.textContent = "สำหรับล็อกอินสำรองโดยไม่ใช้ OTP";

    document.getElementById("perm-app-worktracker").checked = true;
    document.getElementById("perm-app-rdp").checked = true;
    document.getElementById("perm-app-calendar").checked = true;
    document.getElementById("perm-app-admin").checked = false;

    renderWtSiteCheckboxes('ALL');
    renderRdpSiteCheckboxes('ALL');
  }

  if (container) container.classList.remove("hidden");
  container?.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
}

function closeAdminUserForm() {
  const container = document.getElementById("adminUserFormContainer");
  if (container) container.classList.add("hidden");
  adminState.editingUsername = null;
}

function renderWtSiteCheckboxes(allowedSitesVal) {
  const wrapper = document.getElementById("wtSiteCheckboxesWrapper");
  const listContainer = document.getElementById("wtSiteCheckboxesList") || wrapper;
  if (!wrapper || !listContainer) return;

  const isAll = (!allowedSitesVal || allowedSitesVal === 'ALL');
  const radios = document.getElementsByName("wtSiteAccessType");
  radios.forEach(r => {
    if (r.value === 'ALL') r.checked = isAll;
    if (r.value === 'CUSTOM') r.checked = !isAll;
  });

  toggleWtSiteCheckboxes(!isAll);

  let allowedList = [];
  if (!isAll) {
    if (Array.isArray(allowedSitesVal)) allowedList = allowedSitesVal;
    else {
      try { allowedList = JSON.parse(allowedSitesVal); } catch(e) {
        if (typeof allowedSitesVal === 'string' && allowedSitesVal.includes(',')) {
          allowedList = allowedSitesVal.split(',').map(s => s.trim()).filter(Boolean);
        } else {
          allowedList = [allowedSitesVal];
        }
      }
    }
  }

  const allSites = (adminState.wtSites && adminState.wtSites.length > 0)
    ? adminState.wtSites
    : ((window.state && state.allSites && state.allSites.length > 0)
      ? state.allSites
      : ((window.state && state.sites && state.sites.length > 0) ? state.sites : []));

  if (allSites.length === 0) {
    listContainer.innerHTML = '<p class="text-xs text-[#6E6862] p-2 text-center">ยังไม่มีรายการไซต์งานในระบบ</p>';
    updateWtSitesCountBadge();
    return;
  }

  listContainer.innerHTML = allSites.map(s => {
    const isChecked = isAll || allowedList.includes(s);
    return `
      <label class="flex items-center gap-2 p-1.5 rounded-lg hover:bg-white cursor-pointer text-xs">
        <input type="checkbox" class="chk-wt-site rounded text-[#2491FA]" value="${escapeHtml(s)}" ${isChecked ? 'checked' : ''} onchange="updateWtSitesCountBadge()">
        <span class="text-[#201E1C]">${escapeHtml(s)}</span>
      </label>
    `;
  }).join("");

  updateWtSitesCountBadge();
}

function selectAllWtSites(selectAll) {
  const checkboxes = document.querySelectorAll('.chk-wt-site');
  checkboxes.forEach(cb => { cb.checked = selectAll; });
  updateWtSitesCountBadge();
}

function updateWtSitesCountBadge() {
  const badge = document.getElementById("wtSitesCountBadge");
  const total = document.querySelectorAll('.chk-wt-site').length;
  const checked = document.querySelectorAll('.chk-wt-site:checked').length;
  if (badge) badge.textContent = `เลือก ${checked} จาก ${total} ไซต์`;
}

function toggleWtSiteCheckboxes(showCustom) {
  const wrapper = document.getElementById("wtSiteCheckboxesWrapper");
  if (wrapper) {
    if (showCustom) wrapper.classList.remove("hidden");
    else wrapper.classList.add("hidden");
  }
}

function renderRdpSiteCheckboxes(allowedRdpSitesVal) {
  const wrapper = document.getElementById("rdpSiteCheckboxesWrapper");
  const listContainer = document.getElementById("rdpSiteCheckboxesList") || wrapper;
  if (!wrapper || !listContainer) return;

  const isAll = (!allowedRdpSitesVal || allowedRdpSitesVal === 'ALL');
  const radios = document.getElementsByName("rdpSiteAccessType");
  radios.forEach(r => {
    if (r.value === 'ALL') r.checked = isAll;
    if (r.value === 'CUSTOM') r.checked = !isAll;
  });

  toggleRdpSiteCheckboxes(!isAll);

  let allowedList = [];
  if (!isAll) {
    if (Array.isArray(allowedRdpSitesVal)) allowedList = allowedRdpSitesVal;
    else {
      try { allowedList = JSON.parse(allowedRdpSitesVal); } catch(e) {
        if (typeof allowedRdpSitesVal === 'string' && allowedRdpSitesVal.includes(',')) {
          allowedList = allowedRdpSitesVal.split(',').map(s => s.trim()).filter(Boolean);
        } else {
          allowedList = [allowedRdpSitesVal];
        }
      }
    }
  }

  // ดึงรายชื่อไซต์งาน RDP
  const rdpSites = (adminState.rdpSites && adminState.rdpSites.length > 0)
    ? adminState.rdpSites
    : ((window.rdpState && rdpState.sites && rdpState.sites.length > 0) ? rdpState.sites : []);

  if (rdpSites.length === 0) {
    listContainer.innerHTML = '<p class="text-xs text-[#6E6862] p-2 text-center">ยังไม่มีรายการไซต์งาน RDP ในระบบ</p>';
    updateRdpSitesCountBadge();
    return;
  }

  listContainer.innerHTML = rdpSites.map(s => {
    const isChecked = isAll || allowedList.includes(s.site_id) || allowedList.includes(s.site_name);
    return `
      <label class="flex items-center gap-2 p-1.5 rounded-lg hover:bg-white cursor-pointer text-xs">
        <input type="checkbox" class="chk-rdp-site rounded text-[#2491FA]" value="${escapeHtml(s.site_id)}" ${isChecked ? 'checked' : ''} onchange="updateRdpSitesCountBadge()">
        <span class="text-[#201E1C] font-semibold">${escapeHtml(s.site_name)}</span>
        <span class="text-[10px] text-[#6E6862]">(${escapeHtml(s.group_name || 'ทั่วไป')})</span>
      </label>
    `;
  }).join("");

  updateRdpSitesCountBadge();
}

function selectAllRdpSites(selectAll) {
  const checkboxes = document.querySelectorAll('.chk-rdp-site');
  checkboxes.forEach(cb => { cb.checked = selectAll; });
  updateRdpSitesCountBadge();
}

function updateRdpSitesCountBadge() {
  const badge = document.getElementById("rdpSitesCountBadge");
  const total = document.querySelectorAll('.chk-rdp-site').length;
  const checked = document.querySelectorAll('.chk-rdp-site:checked').length;
  if (badge) badge.textContent = `เลือก ${checked} จาก ${total} ไซต์`;
}

function toggleRdpSiteCheckboxes(showCustom) {
  const wrapper = document.getElementById("rdpSiteCheckboxesWrapper");
  if (wrapper) {
    if (showCustom) wrapper.classList.remove("hidden");
    else wrapper.classList.add("hidden");
  }
}

function handleAdminUserRoleChange() {
  const role = document.getElementById("admin-user-role").value;
  if (role === 'Admin') {
    document.getElementById("perm-app-worktracker").checked = true;
    document.getElementById("perm-app-rdp").checked = true;
    document.getElementById("perm-app-calendar").checked = true;
    document.getElementById("perm-app-admin").checked = true;

    // Admin ได้สิทธิ์เข้าถึงทุกไซต์งานอัตโนมัติ
    const wtRadios = document.getElementsByName("wtSiteAccessType");
    wtRadios.forEach(r => { if (r.value === 'ALL') r.checked = true; });
    toggleWtSiteCheckboxes(false);

    const rdpRadios = document.getElementsByName("rdpSiteAccessType");
    rdpRadios.forEach(r => { if (r.value === 'ALL') r.checked = true; });
    toggleRdpSiteCheckboxes(false);
  } else if (role === 'Supervisor') {
    document.getElementById("perm-app-worktracker").checked = true;
    document.getElementById("perm-app-calendar").checked = true;
    document.getElementById("perm-app-admin").checked = false;
  }
}

function editAdminUser(username) {
  const u = adminState.users.find(x => x.username.toLowerCase() === username.toLowerCase());
  if (u) openAdminUserForm(u);
}

function deleteAdminUserConfirm(username) {
  if (!confirm(`คุณแน่ใจหรือไม่ว่าต้องการลบผู้ใช้งาน "${username}" ออกจากระบบ?`)) {
    return;
  }

  google.script.run
    .withSuccessHandler(res => {
      if (res && res.success) {
        showToast(res.message || "ลบผู้ใช้เรียบร้อยแล้ว", "success");
        loadAdminData();
      } else {
        showToast((res && res.message) || "ไม่สามารถลบผู้ใช้ได้", "error");
      }
    })
    .withFailureHandler(err => {
      showToast("ลบผู้ใช้ไม่สำเร็จ: " + (err.message || err), "error");
    })
    .deleteUser(username);
}

function handleAdminUserSubmit(event) {
  event.preventDefault();

  const username = document.getElementById("admin-user-username").value.trim().toLowerCase();
  const fullName = document.getElementById("admin-user-fullname").value.trim();
  const role = document.getElementById("admin-user-role").value;
  const telegramChatId = document.getElementById("admin-user-chatid").value.trim();
  const password = document.getElementById("admin-user-password").value;
  const status = document.getElementById("admin-user-status").value;

  if (!username || !fullName) {
    showToast("กรุณากรอก Username และชื่อ-นามสกุล", "warning");
    return;
  }

  // Allowed Apps
  const allowedApps = [];
  if (document.getElementById("perm-app-worktracker").checked) allowedApps.push("work_tracker");
  if (document.getElementById("perm-app-rdp").checked) allowedApps.push("rdp_manager");
  if (document.getElementById("perm-app-calendar").checked) allowedApps.push("site_calendar");
  if (document.getElementById("perm-app-admin").checked || role === 'Admin') allowedApps.push("admin");

  if (allowedApps.length === 0) {
    showToast("กรุณาเลือกสิทธิ์เข้าถึงระบบอย่างน้อย 1 ระบบ", "warning");
    return;
  }

  // WT Allowed Sites
  let allowedSites = "ALL";
  const wtRadios = document.getElementsByName("wtSiteAccessType");
  let isCustomWt = false;
  wtRadios.forEach(r => { if (r.checked && r.value === 'CUSTOM') isCustomWt = true; });

  if (isCustomWt) {
    const selected = [];
    document.querySelectorAll(".chk-wt-site:checked").forEach(cb => selected.push(cb.value));
    if (selected.length === 0) {
      showToast("กรุณาเลือกไซต์งานติดตามงานอย่างน้อย 1 ไซต์ หรือเลือก 'ทุกไซต์งาน'", "warning");
      return;
    }
    allowedSites = selected;
  }

  // RDP Allowed Sites
  let allowedRdpSites = "ALL";
  const rdpRadios = document.getElementsByName("rdpSiteAccessType");
  let isCustomRdp = false;
  rdpRadios.forEach(r => { if (r.checked && r.value === 'CUSTOM') isCustomRdp = true; });

  if (isCustomRdp) {
    const selected = [];
    document.querySelectorAll(".chk-rdp-site:checked").forEach(cb => selected.push(cb.value));
    if (selected.length === 0) {
      showToast("กรุณาเลือกไซต์งาน RDP อย่างน้อย 1 ไซต์ หรือเลือก 'ทุกไซต์งาน'", "warning");
      return;
    }
    allowedRdpSites = selected;
  }

  const userData = {
    username: username,
    fullName: fullName,
    role: role,
    telegramChatId: telegramChatId,
    password: password,
    status: status,
    allowedApps: allowedApps,
    allowedSites: allowedSites,
    allowedRdpSites: allowedRdpSites
  };

  const btnSubmit = document.getElementById("btnAdminSaveUser");
  if (btnSubmit) {
    btnSubmit.disabled = true;
    btnSubmit.innerHTML = '<i class="fa-solid fa-spinner fa-spin mr-1"></i>กำลังบันทึก...';
  }

  google.script.run
    .withSuccessHandler(res => {
      if (btnSubmit) {
        btnSubmit.disabled = false;
        btnSubmit.innerHTML = 'บันทึกข้อมูลผู้ใช้';
      }

      if (res && res.success) {
        showToast(res.message || "บันทึกข้อมูลผู้ใช้สำเร็จ", "success");
        closeAdminUserForm();
        loadAdminData();
      } else {
        showToast((res && res.message) || "เกิดข้อผิดพลาดในการบันทึกผู้ใช้", "error");
      }
    })
    .withFailureHandler(err => {
      if (btnSubmit) {
        btnSubmit.disabled = false;
        btnSubmit.innerHTML = 'บันทึกข้อมูลผู้ใช้';
      }
      showToast("บันทึกข้อมูลผู้ใช้ไม่สำเร็จ: " + (err.message || err), "error");
    })
    .saveUser(userData);
}

function addNewSiteFromAdmin() {
  const input = document.getElementById("adminInputNewSiteName");
  if (!input) return;
  const name = input.value.trim();
  if (!name) return;

  if (adminState.wtSites.includes(name)) {
    showToast("มีชื่อไซต์งานนี้ในระบบแล้ว", "warning");
    return;
  }

  adminState.wtSites.push(name);
  input.value = "";
  renderAdminSitesList();
}

function removeAdminSiteRow(siteName) {
  adminState.wtSites = adminState.wtSites.filter(s => s !== siteName);
  if (adminState.wtSiteChatIds) delete adminState.wtSiteChatIds[siteName];
  renderAdminSitesList();
}

function toggleAdminBulkSitesMode() {
  adminState.bulkMode = !adminState.bulkMode;
  const quick = document.getElementById("adminQuickAddSiteWrapper");
  const bulk = document.getElementById("adminBulkSitesWrapper");
  const toggleText = document.getElementById("adminBulkSitesToggleText");

  if (adminState.bulkMode) {
    if (quick) quick.classList.add("hidden");
    if (bulk) bulk.classList.remove("hidden");
    if (toggleText) toggleText.textContent = "โหมดพิมพ์ทีละไซต์";
    const textarea = document.getElementById("adminBulkSitesTextarea");
    if (textarea) textarea.value = (adminState.wtSites || []).join("\n");
  } else {
    if (quick) quick.classList.remove("hidden");
    if (bulk) bulk.classList.add("hidden");
    if (toggleText) toggleText.textContent = "โหมดพิมพ์หลายบรรทัด";
  }
}

function applyAdminBulkSites() {
  const textarea = document.getElementById("adminBulkSitesTextarea");
  if (!textarea) return;

  const lines = textarea.value.split("\n")
    .map(l => l.trim())
    .filter(Boolean);

  const unique = Array.from(new Set(lines));
  adminState.wtSites = unique;
  toggleAdminBulkSitesMode();
  renderAdminSitesList();
}

function saveAdminSitesChanges() {
  // Sync Chat IDs from DOM
  const rows = document.querySelectorAll("#adminSitesListContainer .site-list-item");
  const chatIds = {};
  rows.forEach(r => {
    const sName = r.dataset.site;
    const input = r.querySelector(".site-chatid-input");
    if (sName && input) {
      const cid = input.value.trim();
      if (cid) chatIds[sName] = cid;
    }
  });

  adminState.wtSiteChatIds = chatIds;
  if (adminState.settings) {
    adminState.settings.SITE_TELEGRAM_CHAT_IDS = chatIds;
    adminState.settings.SITES = adminState.wtSites;
  }
  if (window.state) {
    state.allSites = adminState.wtSites;
    if (state.currentUser && state.currentUser.role === 'Admin') {
      state.sites = adminState.wtSites;
    }
    if (typeof syncWorkTrackerDropdowns === 'function') {
      syncWorkTrackerDropdowns();
    }
  }

  const btn = document.getElementById("btnAdminSaveSites");
  if (btn) {
    btn.disabled = true;
    btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin mr-1"></i>กำลังบันทึก...';
  }

  google.script.run
    .withSuccessHandler(res => {
      if (btn) {
        btn.disabled = false;
        btn.innerHTML = 'บันทึกรายชื่อไซต์งาน';
      }

      if (res && res.success) {
        showToast("บันทึกรายชื่อไซต์งานเรียบร้อย", "success");
        adminState.wtSites = res.sites || adminState.wtSites;
        adminState.wtSiteChatIds = res.chatIds || chatIds;
        loadAdminData(true);
      } else {
        showToast((res && res.message) || "เกิดข้อผิดพลาดในการบันทึกไซต์งาน", "error");
      }
    })
    .withFailureHandler(err => {
      if (btn) {
        btn.disabled = false;
        btn.innerHTML = 'บันทึกรายชื่อไซต์งาน';
      }
      showToast("บันทึกไซต์งานไม่สำเร็จ: " + (err.message || err), "error");
    })
    .saveSitesList(adminState.wtSites, chatIds);
}

/**
 * แปลงวันเวลาดิบเป็นเวลาท้องถิ่นของประเทศไทย (Asia/Bangkok, UTC+07:00)
 * รูปแบบ 3: YYYY-MM-DD HH:mm:ss (ปี ค.ศ. เวลาไทย 24 ชม.)
 * @param {string|Date|number} raw
 * @returns {string}
 */
function formatThaiDateTime(raw) {
  if (!raw) return '-';
  try {
    let d = null;
    if (raw instanceof Date) {
      d = raw;
    } else if (typeof raw === 'string') {
      const trimmed = raw.trim();
      if (!trimmed) return '-';
      // ถ้าเป็นรูปแบบ YYYY-MM-DD HH:mm:ss อยู่แล้ว
      if (/^\d{4}-\d{2}-\d{2} \d{2}:\d{2}:\d{2}$/.test(trimmed)) {
        return trimmed;
      }
      // ทำความสะอาดข้อความในวงเล็บ เช่น (เวลาอินโดจีน)
      const cleaned = trimmed.replace(/\([^)]*\)/g, '').trim();
      d = new Date(cleaned);
    } else if (typeof raw === 'number') {
      d = new Date(raw);
    }

    if (!d || isNaN(d.getTime())) return String(raw);

    const parts = new Intl.DateTimeFormat('en-GB', {
      timeZone: 'Asia/Bangkok',
      year: 'numeric',
      month: '2-digit',
      day: '2-digit',
      hour: '2-digit',
      minute: '2-digit',
      second: '2-digit',
      hour12: false
    }).formatToParts(d).reduce((acc, p) => { acc[p.type] = p.value; return acc; }, {});

    return `${parts.year}-${parts.month}-${parts.day} ${parts.hour}:${parts.minute}:${parts.second}`;
  } catch (e) {
    return String(raw);
  }
}
window.formatThaiDateTime = formatThaiDateTime;

/**
 * จัดฟอร์แมตค่าเวลาให้อยู่ในรูปแบบ 24 ชั่วโมงประเทศไทย (HH:mm) เช่น 07:00 หรือ 17:00
 */
function formatTo24HourTime(val) {
  if (val === undefined || val === null || val === '') return '07:00';

  const s = String(val).trim();

  // หากเป็น Date String ผิดเพี้ยนจาก Sheets (เช่น Sat Dec 30 1899...)
  if (s.includes('1899') || s.includes('GMT')) {
    const d = new Date(s);
    if (!isNaN(d.getTime())) {
      if (d.getFullYear() < 1920) {
        // ใช้ Fixed +07:00 สำหรับปี 1899 เพื่อไม่ให้ LMT คลาดเคลื่อน 18 นาที
        const bkk = new Date(d.getTime() + 7 * 3600000);
        const hh = String(bkk.getUTCHours()).padStart(2, '0');
        const mm = String(bkk.getUTCMinutes()).padStart(2, '0');
        return `${hh}:${mm}`;
      }
      try {
        const parts = new Intl.DateTimeFormat('en-GB', {
          timeZone: 'Asia/Bangkok',
          hour: '2-digit',
          minute: '2-digit',
          hour12: false
        }).formatToParts(d).reduce((acc, p) => { acc[p.type] = p.value; return acc; }, {});
        if (parts.hour && parts.minute && parts.hour !== 'NaN') {
          return `${parts.hour}:${parts.minute}`;
        }
      } catch (e) {}
    }
    return '07:00';
  }

  // รูปแบบ HH:mm หรือ H:mm
  const match = s.match(/^([01]?\d|2[0-3]):([0-5]\d)/);
  if (match) {
    const hh = String(match[1]).padStart(2, '0');
    const mm = String(match[2]).padStart(2, '0');
    return `${hh}:${mm}`;
  }

  // ตัวเลขเดี่ยวระบุชั่วโมง (เช่น "7" หรือ 7)
  const num = parseInt(s, 10);
  if (!isNaN(num) && num >= 0 && num <= 23) {
    return `${String(num).padStart(2, '0')}:00`;
  }

  return '07:00';
}
window.formatTo24HourTime = formatTo24HourTime;

/**
 * เติมตัวเลือกนาที 00-59 ลงใน Dropdown นาที (รองรับทุกนาทีอย่างละเอียด)
 */
function ensureCalMinuteOptions() {
  const minSelect = document.getElementById("cal-cfg-reminder-minute");
  if (!minSelect || minSelect.options.length === 60) return;
  const currentVal = minSelect.value || "00";
  let html = "";
  for (let m = 0; m < 60; m++) {
    const pad = String(m).padStart(2, "0");
    html += `<option value="${pad}">${pad}</option>`;
  }
  minSelect.innerHTML = html;
  minSelect.value = currentVal;
}

 * ซิงค์ค่าจาก Dropdown ชั่วโมง + นาที (24 ชม.) ไปยัง Hidden Input

  const hrEl = document.getElementById("cal-cfg-reminder-hour");

  }

/**
 * ตั้งค่า Dropdown ชั่วโมง + นาที (24 ชม.) จากสตริง HH:mm
 */
function setCalTimeSelects(timeVal) {
  ensureCalMinuteOptions();
  const clean = formatTo24HourTime(timeVal);
  const parts = clean.split(":");
  const hh = parts[0] || "07";

  const minEl = document.getElementById("cal-cfg-reminder-minute");

  if (hrEl) hrEl.value = hh;

}

    textEl.className = "font-semibold text-rose-800";

    if (isAuthErr) {
      textEl.textContent = "⚠️ ยังไม่ได้รับอนุญาตสิทธิ์ ScriptApp (กรุณารันฟังก์ชัน authorizeCalendarTrigger ใน Apps Script Editor 1 ครั้งตามคำแนะนำด้านล่าง)";
      if (editorBtn && statusObj && statusObj.scriptEditorUrl) {
        editorBtn.href = statusObj.scriptEditorUrl;
      }
      if (authGuide) authGuide.classList.remove("hidden");
    } else {
      textEl.textContent = "ไม่สามารถตรวจสอบ Trigger ได้" + (errText ? ` (${errText})` : "");
      if (authGuide) authGuide.classList.add("hidden");
    }

    if (lastRunEl) lastRunEl.textContent = "";
    return;
  }

  if (authGuide) authGuide.classList.add("hidden");

  if (statusObj.installed) {
    const modeLabel = statusObj.isExactMode ? "ตรวจสอบทุก 5 นาที (ตรงเวลาเป๊ะ)" : "แบบรายวันเดิม (แนะนำกดติดตั้ง/รีเซ็ตใหม่)";
    const timeBadge = statusObj.configuredTime ? `เวลา ${statusObj.configuredTime} น.` : "";
    const activeState = statusObj.enabled === false ? "⚠️ ปิดการเตือนล่วงหน้าอยู่" : "🟢 พร้อมทำงานอัตโนมัติ";

    banner.className = statusObj.enabled === false
      ? "flex flex-col sm:flex-row sm:items-center justify-between gap-2 px-3.5 py-2.5 rounded-2xl border border-amber-200 bg-amber-50/70 text-xs"
      : "flex flex-col sm:flex-row sm:items-center justify-between gap-2 px-3.5 py-2.5 rounded-2xl border border-emerald-200 bg-emerald-50/70 text-xs";
    dot.className = statusObj.enabled === false
      ? "w-2.5 h-2.5 rounded-full bg-amber-500 shrink-0"
      : "w-2.5 h-2.5 rounded-full bg-emerald-500 shrink-0";
    textEl.className = statusObj.enabled === false ? "font-semibold text-amber-900" : "font-semibold text-emerald-900";
    textEl.textContent = `${activeState} • ${modeLabel} (${timeBadge})`;

    if (lastRunEl) {
      if (statusObj.lastRunAt) {
        lastRunEl.textContent = `ทำงานล่าสุด: ${statusObj.lastRunAt}`;
        lastRunEl.title = statusObj.lastRunResult || "";
      } else {
        lastRunEl.textContent = "ยังไม่เคยส่งรอบอัตโนมัติ";
      }
    }
  } else {
    banner.className = "flex flex-col sm:flex-row sm:items-center justify-between gap-2 px-3.5 py-2.5 rounded-2xl border border-rose-200 bg-rose-50/80 text-xs";
    dot.className = "w-2.5 h-2.5 rounded-full bg-rose-500 shrink-0";
    textEl.className = "font-semibold text-rose-800";
    textEl.textContent = "🔴 ยังไม่ได้ติดตั้ง Time Trigger (กรุณากด 'ติดตั้ง/รีเซ็ต Time Trigger' หรือ 'บันทึกการตั้งค่าทั้งหมด')";
    if (lastRunEl) lastRunEl.textContent = "";
  }
}

/**
 * เติมค่าการตั้งค่าระบบปฏิทินเข้าไซต์งานลงในฟอร์ม Admin Center
 */
function populateCalendarSettings() {
  const s = adminState.settings || {};

  const enableAdvance = document.getElementById("cal-cfg-enable-advance-reminder");
  const reminderDays = document.getElementById("cal-cfg-reminder-days");

  const notifyImmediate = document.getElementById("cal-cfg-notify-immediate");
  const notifySiteGroup = document.getElementById("cal-cfg-notify-site-group");
  const notifyMainGroup = document.getElementById("cal-cfg-notify-main-group");

  const firstDay = document.getElementById("cal-cfg-first-day");
  const memberSchedule = document.getElementById("cal-cfg-member-schedule");
  const maxChips = document.getElementById("cal-cfg-max-chips");

  if (enableAdvance) {
    enableAdvance.checked = (s.CALENDAR_ENABLE_ADVANCE_REMINDER !== false && s.CALENDAR_ENABLE_ADVANCE_REMINDER !== "false");
  }
  if (reminderDays) {
    reminderDays.value = String(s.CALENDAR_REMINDER_DAYS_BEFORE !== undefined ? s.CALENDAR_REMINDER_DAYS_BEFORE : "1");
  }

  setCalTimeSelects(s.CALENDAR_REMINDER_TIME);

  if (notifyImmediate) {
    notifyImmediate.checked = (s.CALENDAR_NOTIFY_ON_SCHEDULE !== false && s.CALENDAR_NOTIFY_ON_SCHEDULE !== "false");
  }
  if (notifySiteGroup) {
    notifySiteGroup.checked = (s.CALENDAR_NOTIFY_SITE_GROUP !== false && s.CALENDAR_NOTIFY_SITE_GROUP !== "false");
  }
  if (notifyMainGroup) {
    notifyMainGroup.checked = (s.CALENDAR_NOTIFY_MAIN_GROUP === true || s.CALENDAR_NOTIFY_MAIN_GROUP === "true");
  }

  if (firstDay) {
    firstDay.value = String(s.CALENDAR_FIRST_DAY_OF_WEEK !== undefined ? s.CALENDAR_FIRST_DAY_OF_WEEK : "0");
  }
  if (memberSchedule) {
    memberSchedule.checked = (s.CALENDAR_MEMBER_CAN_SCHEDULE === true || s.CALENDAR_MEMBER_CAN_SCHEDULE === "true");
  }
  if (maxChips) {
    maxChips.value = String(s.CALENDAR_MAX_CHIPS_PER_CELL !== undefined ? s.CALENDAR_MAX_CHIPS_PER_CELL : "3");
  }

  // โหลดสถานะ Time Trigger ล่าสุด
  loadCalendarTriggerStatus();
}

/**
 * บันทึกการตั้งค่าระบบปฏิทินเข้าไซต์งาน พร้อมติดตั้ง/ซิงค์ Time Trigger ให้อัตโนมัติ
 */
function saveCalendarSettings() {
  const btn = document.getElementById("btnSaveCalendarSettings");
  const origHtml = btn ? btn.innerHTML : "";
  if (btn) {
    btn.disabled = true;
    btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin mr-1.5"></i>กำลังบันทึกและซิงค์ Trigger...';
  }

  syncCalTimeHiddenFromSelects();
  const rawReminderTime = document.getElementById("cal-cfg-reminder-time")?.value;
  const cleanReminderTime = formatTo24HourTime(rawReminderTime);

  const newSettings = {
    CALENDAR_ENABLE_ADVANCE_REMINDER: document.getElementById("cal-cfg-enable-advance-reminder")?.checked ?? true,
    CALENDAR_REMINDER_DAYS_BEFORE: document.getElementById("cal-cfg-reminder-days")?.value || "1",
    CALENDAR_REMINDER_TIME: cleanReminderTime,
    CALENDAR_NOTIFY_ON_SCHEDULE: document.getElementById("cal-cfg-notify-immediate")?.checked ?? true,
    CALENDAR_NOTIFY_SITE_GROUP: document.getElementById("cal-cfg-notify-site-group")?.checked ?? true,
    CALENDAR_NOTIFY_MAIN_GROUP: document.getElementById("cal-cfg-notify-main-group")?.checked ?? false,
    CALENDAR_FIRST_DAY_OF_WEEK: document.getElementById("cal-cfg-first-day")?.value || "0",
    CALENDAR_MEMBER_CAN_SCHEDULE: document.getElementById("cal-cfg-member-schedule")?.checked ?? false,
    CALENDAR_MAX_CHIPS_PER_CELL: document.getElementById("cal-cfg-max-chips")?.value || "3"
  };

  google.script.run
    .withSuccessHandler(res => {
      if (btn) {
        btn.disabled = false;
        btn.innerHTML = origHtml;
      }
      if (res && res.success) {
        if (!adminState.settings) adminState.settings = {};
        Object.assign(adminState.settings, newSettings);
        if (window.state && state.settings) {
          Object.assign(state.settings, newSettings);
        }
        if (res.triggerStatus) {
          renderCalendarTriggerStatus(res.triggerStatus);
          if (res.triggerStatus.success === false) {
            showToast(
              `บันทึกการตั้งค่าลงชีตแล้ว แต่ยังติดตั้ง Trigger ไม่ได้ (${isCalendarTriggerAuthError(res.triggerStatus) ? "ต้องกดอนุญาตสิทธิ์ ScriptApp ก่อน" : (res.triggerStatus.message || "เกิดข้อผิดพลาด")})`,
              "warning",
              4500
            );
          } else {
            showToast(`บันทึกการตั้งค่าและซิงค์เวลาส่ง ${cleanReminderTime} น. เรียบร้อย`, "success");
          }
        } else {
          showToast(`บันทึกการตั้งค่าเวลา ${cleanReminderTime} น. เรียบร้อย`, "success");
          loadCalendarTriggerStatus();
        }
      } else {
        showToast((res && res.message) || "เกิดข้อผิดพลาดในการบันทึก", "error");
      }
    })
    .withFailureHandler(err => {
      if (btn) {
        btn.disabled = false;
        btn.innerHTML = origHtml;
      }
      showToast("บันทึกไม่สำเร็จ: " + (err.message || err), "error");
    })
    .saveSettings(newSettings);
}

/**
 * ทดสอบยิงแจ้งเตือนล่วงหน้ารอบเช้าทันที (ไม่ต้องรอเวลา Trigger)
 * @param {boolean} [forceResend] บังคับส่งซ้ำแม้เคยส่งเตือนไปแล้ว
 */
function testCalendarReminderNow(forceResend = false) {
  const currentUsername = (state && state.currentUser) ? state.currentUser.username : "";
  showToast(forceResend ? "กำลังบังคับส่งแจ้งเตือนทดสอบซ้ำ..." : "กำลังตรวจสอบและส่งแจ้งเตือน...", "info", 2000);

  google.script.run
    .withSuccessHandler(res => {
      if (res && res.success) {
        loadCalendarTriggerStatus();
        if (typeof Swal !== 'undefined') {
          const hasAlreadySent = (res.alreadySentCount > 0 && res.foundCount === 0);
          const missingUsers = Array.isArray(res.missingChatIdUsers) ? res.missingChatIdUsers : [];

          let detailsHtml = `<div class="text-xs text-left space-y-1.5 bg-[#FAF8F2] p-3.5 rounded-xl border border-[#EFE9DC]">
            <p><b>สรุปผล:</b> ${escapeHtml(res.message || '-')}</p>
            <p><b>วันที่เป้าหมาย:</b> ${escapeHtml(res.targetThai || res.targetDate || '-')}</p>
            <p><b>คิวงานในวันเป้าหมาย:</b> ทั้งหมด ${res.totalForDate || 0} รายการ | รอส่ง ${res.foundCount || 0} | ส่งแล้วก่อนหน้า ${res.alreadySentCount || 0}</p>
            <div class="pt-1 border-t border-[#EFE9DC]/80 grid grid-cols-3 gap-1.5 text-[11px]">
              <span class="bg-white px-2 py-1 rounded border border-[#EFE9DC]">📱 ส่วนตัว: <b>${res.personalSentCount || 0}</b></span>
              <span class="bg-white px-2 py-1 rounded border border-[#EFE9DC]">👥 กลุ่มไซต์: <b>${res.siteGroupSentCount || 0}</b></span>
              <span class="bg-white px-2 py-1 rounded border border-[#EFE9DC]">📢 ส่วนกลาง: <b>${res.mainGroupSentCount || 0}</b></span>
            </div>`;

          if (missingUsers.length > 0) {
            detailsHtml += `<p class="text-[11px] text-amber-800 bg-amber-50 p-2 rounded-lg border border-amber-200 mt-1.5">
              <b>⚠️ ผู้ใช้ที่ยังไม่มี Telegram Chat ID ส่วนตัว:</b> ${escapeHtml(missingUsers.join(', '))}
            </p>`;
          }
          detailsHtml += `</div>`;

          Swal.fire({
            title: (res.sentCount > 0) ? 'ทดสอบส่งแจ้งเตือนสำเร็จ!' : 'ผลการตรวจสอบและทดสอบ',
            html: detailsHtml,
            icon: (res.sentCount > 0) ? 'success' : 'info',
            showCancelButton: hasAlreadySent,
            confirmButtonText: 'ตกลง',
            confirmButtonColor: '#059669',
            cancelButtonText: 'บังคับส่งทดสอบซ้ำอีกครั้ง',
            cancelButtonColor: '#D97706'
          }).then(result => {
            if (result.dismiss === Swal.DismissReason.cancel && hasAlreadySent) {
              testCalendarReminderNow(true);
            }
          });
        } else {
          showToast(res.message || "ทดสอบแจ้งเตือนเรียบร้อย", "success");
        }
      } else {
        showToast((res && res.message) || "ไม่สามารถส่งแจ้งเตือนได้", "error");
      }
    })
    .withFailureHandler(err => {
      showToast("เกิดข้อผิดพลาดในการทดสอบ: " + (err.message || err), "error");
    })
    .triggerDailySiteScheduleRemindersNow(currentUsername, { forceResend: Boolean(forceResend) });
}

/**
 * ติดตั้งหรือรีเซ็ต Apps Script Time-driven Trigger แบบละเอียดทุก 5 นาที
 */
function setupCalendarTrigger() {
  showToast("กำลังตรวจสอบและติดตั้ง Time Trigger...", "info", 2000);

  google.script.run
    .withSuccessHandler(res => {
      if (res && res.success) {
        if (res.triggerStatus) {
          renderCalendarTriggerStatus(res.triggerStatus);
        } else {
          loadCalendarTriggerStatus();
        }
        if (typeof Swal !== 'undefined') {
          Swal.fire({
            title: 'ติดตั้ง Time Trigger สำเร็จ!',
            text: res.message || 'ระบบจะตรวจสอบและส่งแจ้งเตือนอัตโนมัติตรงเวลาที่กำหนดทุกวัน',
            icon: 'success',
            confirmButtonText: 'ตกลง',
            confirmButtonColor: '#059669'
          });
        } else {
          showToast(res.message || "ติดตั้ง Trigger สำเร็จ", "success");
        }
      } else {
        renderCalendarTriggerStatus(res || { success: false, installed: false, message: "ไม่สามารถติดตั้ง Trigger ได้" });
        if (isCalendarTriggerAuthError(res)) {
          showCalendarTriggerAuthModal(res && res.scriptEditorUrl);
        } else {
          showToast((res && res.message) || "ไม่สามารถติดตั้ง Trigger ได้", "error");
        }
      }
    })
    .withFailureHandler(err => {
      const errMsg = (err && err.message) ? err.message : String(err || "");
      renderCalendarTriggerStatus({ success: false, installed: false, authError: errMsg });
      if (isCalendarTriggerAuthError(errMsg)) {
        showCalendarTriggerAuthModal();
      } else {
        showToast("เกิดข้อผิดพลาดในการติดตั้ง Trigger: " + errMsg, "error");
      }
    })
    .setupScheduleReminderTrigger();
}
</script>
