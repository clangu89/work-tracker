<script>
/**
 * =========================================================================
 * SITE CALENDAR CLIENT MODULE (CalendarScript.html)
 * Client-side Controller & Interactive UI for Site Visit Schedule Management
 * =========================================================================
 */

// Client Fallback สำหรับไซต์งานเริ่มต้น (ป้องกันกรณีออฟไลน์หรือชีตยังไม่ตอบกลับ)
window.DEFAULT_SITES = window.DEFAULT_SITES || [
  'ไซต์ A - อาคารสำนักงานใหญ่',
  'ไซต์ B - โครงการคอนโดสุขุมวิท',
  'ไซต์ C - โรงงานนิคมชลบุรี',
  'งานซ่อมบำรุงและบริการทั่วไป'
];

const calendarState = {
  currentYear: new Date().getFullYear(),
  currentMonth: new Date().getMonth() + 1, // 1 - 12
  schedules: [],
  sites: [],
  tasks: [],
  usersList: [],
  selectedDate: null,
  siteFilter: 'ALL',
  userFilter: 'ALL',
  myScheduleOnly: false,
  modalSelectedUsers: new Set(),
  modalUserSearchKeyword: '',
  isLoading: false,
  isInitialized: false
};

const THAI_MONTH_NAMES = [
  'มกราคม', 'กุมภาพันธ์', 'มีนาคม', 'เมษายน', 'พฤษภาคม', 'มิถุนายน',
  'กรกฎาคม', 'สิงหาคม', 'กันยายน', 'ตุลาคม', 'พฤศจิกายน', 'ธันวาคม'
];

const THAI_DAY_NAMES = [
  'วันอาทิตย์', 'วันจันทร์', 'วันอังคาร', 'วันพุธ', 'วันพฤหัสบดี', 'วันศุกร์', 'วันเสาร์'
];

/**
 * ตรวจสอบสิทธิ์ว่าผู้ใช้ปัจจุบันมีสิทธิ์จัดการตารางเข้าไซต์หรือไม่ (Admin, Supervisor หรือ Member เมื่อเปิดให้ลงคิวตนเองได้)
 */
function canManageCalendar() {
  if (!state.currentUser) return false;
  const role = String(state.currentUser.role || '').trim();
  if (role === 'Admin' || role === 'Supervisor') return true;
  const settings = state.settings || (window.adminState && adminState.settings) || {};
  if (settings.CALENDAR_MEMBER_CAN_SCHEDULE === true || settings.CALENDAR_MEMBER_CAN_SCHEDULE === 'true') {
    return true;
  }
  return false;
}

/**
 * เริ่มต้นระบบปฏิทินเข้าไซต์งานเมื่อเข้าสู่แอป
 */
function initCalendarApp() {
  updateCalendarNavbarUser();

  // ปรับแต่ง UI ตามสิทธิ์ของผู้ใช้
  const canManage = canManageCalendar();
  const btnAdd = document.getElementById('btnCalendarAddSchedule');
  const btnModalAdd = document.getElementById('btnModalAddForThisDay');
  if (btnAdd) btnAdd.classList.toggle('hidden', !canManage);
  if (btnModalAdd) btnModalAdd.classList.toggle('hidden', !canManage);

  // เตรียมตัวเลือกใน Dropdown ฟิลเตอร์และฟอร์มเบื้องต้น
  syncCalendarDropdowns();

  // โหลดข้อมูล Bootstrap แบบครบวงจรสำหรับปฏิทิน (Schedules, Sites, Tasks, Users, Settings)
  loadCalendarBootstrapData();
  calendarState.isInitialized = true;
}

/**
 * โหลดข้อมูลเริ่มต้นแบบครบวงจรสำหรับระบบปฏิทิน (Schedules, Sites, Tasks, Users, Settings)
 */
function loadCalendarBootstrapData() {
  if (calendarState.isLoading) return;
  calendarState.isLoading = true;

  const refreshIcon = document.getElementById('calRefreshIcon');
  if (refreshIcon) refreshIcon.classList.add('animate-spin');

  updateCalendarMonthTitle();

  if (typeof google === 'undefined' || !google.script || !google.script.run) {
    calendarState.isLoading = false;
    if (refreshIcon) refreshIcon.classList.remove('animate-spin');
    renderCalendarGrid();
    return;
  }

  const curUsername = state.currentUser ? state.currentUser.username : '';

  google.script.run
    .withSuccessHandler(function(res) {
      calendarState.isLoading = false;
      if (refreshIcon) refreshIcon.classList.remove('animate-spin');
      if (res && res.success) {
        // 1. กำหนด Schedules
        calendarState.schedules = res.schedules || [];

        // 2. กำหนด Sites
        if (res.sites && res.sites.length > 0) {
          calendarState.sites = res.sites;
          if (!state.sites || state.sites.length === 0) state.sites = res.sites;
          if (!state.allSites || state.allSites.length === 0) state.allSites = res.sites;
        }

        // 3. กำหนด Active Tasks สำหรับเชื่อมโยง
        if (res.tasks && res.tasks.length > 0) {
          calendarState.tasks = res.tasks;
          if (!state.tasks || state.tasks.length === 0) state.tasks = res.tasks;
        }

        // 4. กำหนด Users
        if (res.users && res.users.length > 0) {
          calendarState.usersList = res.users;
          populateCalendarUserDropdowns(res.users);
        }

        // 5. กำหนด Settings
        if (res.settings) {
          if (!state.settings) state.settings = {};
          Object.assign(state.settings, res.settings);
        }

        // ซิงค์ Dropdown ใหม่ทั้งหมดด้วยข้อมูลที่สดใหม่
        syncCalendarDropdowns();

        renderCalendarGrid();
        renderCalendarAgenda();
        updateTodayDutyCountBadge();
      } else {
        // หาก getCalendarBootstrapData มีปัญหา ให้ fallback ไปเรียก getSiteSchedules
        loadCalendarSchedules();
      }
    })
    .withFailureHandler(function(err) {
      console.warn('loadCalendarBootstrapData fallback: ' + err.message);
      loadCalendarSchedules();
    })
    .getCalendarBootstrapData(calendarState.currentYear, calendarState.currentMonth, calendarState.siteFilter, calendarState.userFilter, curUsername);
}
window.loadCalendarBootstrapData = loadCalendarBootstrapData;

/**
 * อัปเดตข้อมูลผู้ใช้งานบน Navbar ของปฏิทิน
 */
function updateCalendarNavbarUser() {
  if (!state.currentUser) return;
  const nameEl = document.getElementById('calNavUserFullName');
  const roleEl = document.getElementById('calNavUserRole');
  if (nameEl) nameEl.textContent = state.currentUser.fullName || state.currentUser.username;
  if (roleEl) {
    roleEl.textContent = state.currentUser.role || 'Member';
    if (state.currentUser.role === 'Admin') {
      roleEl.className = 'text-[10px] text-purple-700 font-bold uppercase';
    } else if (state.currentUser.role === 'Supervisor') {
      roleEl.className = 'text-[10px] text-blue-700 font-bold uppercase';
    } else {
      roleEl.className = 'text-[10px] text-emerald-700 font-semibold uppercase';
    }
  }
}

/**
 * ซิงค์ข้อมูลไซต์งาน ผู้ใช้งาน และ Task ไปยัง Dropdown ทั้งหมดในปฏิทิน
 * @param {string} [siteForTaskFilter] ไซต์งานที่ต้องการจัดกลุ่มงานให้แสดงด้านบนในฟอร์ม
 */
function syncCalendarDropdowns(siteForTaskFilter) {
  // 1. ซิงค์ไซต์งาน
  const sourceSites = (calendarState.sites && calendarState.sites.length > 0)
    ? calendarState.sites
    : ((state.sites && state.sites.length > 0)
        ? state.sites
        : ((state.allSites && state.allSites.length > 0)
            ? state.allSites
            : (window.DEFAULT_SITES || [])));

  const filterSiteEl = document.getElementById('calFilterSite');
  const formSiteEl = document.getElementById('calFormSite');

  if (filterSiteEl) {
    const currentVal = filterSiteEl.value;
    filterSiteEl.innerHTML = '<option value="ALL">🏢 ทุกไซต์งาน</option>' +
      sourceSites.map(s => `<option value="${escapeHtml(s)}">${escapeHtml(s)}</option>`).join('');
    if (sourceSites.includes(currentVal)) filterSiteEl.value = currentVal;
  }

  if (formSiteEl) {
    const currentFormVal = formSiteEl.value;
    formSiteEl.innerHTML = '<option value="">-- กรุณาเลือกไซต์งาน --</option>' +
      sourceSites.map(s => `<option value="${escapeHtml(s)}">${escapeHtml(s)}</option>`).join('');
    if (currentFormVal && sourceSites.includes(currentFormVal)) {
      formSiteEl.value = currentFormVal;
    }
  }

  // 2. ดึงรายชื่อผู้ใช้ถ้ายังไม่มี
  if (!calendarState.usersList || calendarState.usersList.length === 0) {
    loadCalendarUsersList();
  } else {
    populateCalendarUserDropdowns(calendarState.usersList);
  }

  // 3. ซิงค์ Task เชื่อมโยงในฟอร์ม
  const formTaskEl = document.getElementById('calFormTaskId');
  if (formTaskEl) {
    const currentTaskVal = formTaskEl.value;
    const allTasks = (calendarState.tasks && calendarState.tasks.length > 0)
      ? calendarState.tasks
      : (state.tasks || []);

    const activeTasks = allTasks.filter(t => t.status !== 'เสร็จสิ้น');

    if (activeTasks.length === 0) {
      formTaskEl.innerHTML = '<option value="">-- ไม่ระบุงานเชื่อมโยง (ไม่มีงานค้าง) --</option>';
    } else {
      let optionsHtml = '<option value="">-- ไม่ระบุงานเชื่อมโยง --</option>';
      const targetSite = siteForTaskFilter || (formSiteEl ? formSiteEl.value : '');

      if (targetSite) {
        const siteTasks = activeTasks.filter(t => t.site === targetSite);
        const otherTasks = activeTasks.filter(t => t.site !== targetSite);

        if (siteTasks.length > 0) {
          optionsHtml += `<optgroup label="📌 งานในไซต์นี้ (${escapeHtml(targetSite)} - ${siteTasks.length} งาน)">` +
            siteTasks.map(t => `<option value="${escapeHtml(t.id)}">[${escapeHtml(t.id)}] ${escapeHtml(t.title)} (${escapeHtml(t.status)})</option>`).join('') +
            '</optgroup>';
        }

        if (otherTasks.length > 0) {
          optionsHtml += `<optgroup label="📋 งานในไซต์อื่นๆ (${otherTasks.length} งาน)">` +
            otherTasks.map(t => `<option value="${escapeHtml(t.id)}">[${escapeHtml(t.id)}] ${escapeHtml(t.title)} (${escapeHtml(t.site || 'ไม่ระบุ')})</option>`).join('') +
            '</optgroup>';
        }
      } else {
        optionsHtml += activeTasks.map(t => `<option value="${escapeHtml(t.id)}">[${escapeHtml(t.id)}] ${escapeHtml(t.title)} (${escapeHtml(t.site || 'ไม่ระบุไซต์')})</option>`).join('');
      }

      formTaskEl.innerHTML = optionsHtml;
      if (currentTaskVal) {
        formTaskEl.value = currentTaskVal;
      }
    }
  }
}

/**
 * เมื่อมีการเลือกเปลี่ยนไซต์งานเป้าหมายในฟอร์ม
 * ปรับปรุงรายการงานใน calFormTaskId ให้จัดกลุ่มงานของไซต์ที่เลือกมาไว้ด้านบน
 */
function onCalFormSiteChanged(selectedSite) {
  syncCalendarDropdowns(selectedSite);
}
window.onCalFormSiteChanged = onCalFormSiteChanged;

/**
 * เมื่อมีการเลือกงานที่เชื่อมโยงใน calFormTaskId
 * ปรับปรุงให้ auto-select calFormSite ตามไซต์ของงานนั้น และแนะนำวัตถุประสงค์งาน
 */
function onCalFormTaskChanged(selectedTaskId) {
  if (!selectedTaskId) return;

  const allTasks = (calendarState.tasks && calendarState.tasks.length > 0)
    ? calendarState.tasks
    : (state.tasks || []);

  const task = allTasks.find(t => String(t.id) === String(selectedTaskId));
  if (!task) return;

  // 1. Auto-select Site ถ้างานนั้นมีไซต์ระบุไว้
  const formSiteEl = document.getElementById('calFormSite');
  if (formSiteEl && task.site) {
    if (formSiteEl.value !== task.site) {
      formSiteEl.value = task.site;
      // รีเฟรช dropdown task เพื่อให้ optgroup ตรงกับไซต์ใหม่
      syncCalendarDropdowns(task.site);
      const updatedTaskEl = document.getElementById('calFormTaskId');
      if (updatedTaskEl) updatedTaskEl.value = selectedTaskId;
    }
  }

  // 2. แนะนำวัตถุประสงค์งานลงในช่อง calFormPurpose ถ้ายังว่างอยู่
  const purposeEl = document.getElementById('calFormPurpose');
  if (purposeEl && (!purposeEl.value || purposeEl.value.trim() === '')) {
    purposeEl.value = task.title ? `[${task.id}] ${task.title}` : `เข้าดำเนินการงาน ${task.id}`;
  }
}
window.onCalFormTaskChanged = onCalFormTaskChanged;

/**
 * ดึงรายชื่อผู้ใช้จากระบบ
 */
function loadCalendarUsersList() {
  if (typeof google === 'undefined' || !google.script || !google.script.run) return;
  google.script.run
    .withSuccessHandler(function(res) {
      if (res && res.users) {
        calendarState.usersList = res.users;
        populateCalendarUserDropdowns(res.users);
      }
    })
    .withFailureHandler(function(err) {
      console.warn('loadCalendarUsersList failed: ' + err.message);
    })
    .getUsersList();
}

/**
 * เติมรายชื่อผู้ใช้ลงใน Dropdown
 */
function populateCalendarUserDropdowns(users) {
  const filterUserEl = document.getElementById('calFilterUser');
  const formUserEl = document.getElementById('calFormUser');

  const activeUsers = users.filter(u => u.status !== 'Inactive');

  if (filterUserEl) {
    const currentVal = filterUserEl.value;
    filterUserEl.innerHTML = '<option value="ALL">👤 ทุกผู้ปฏิบัติงาน</option>' +
      activeUsers.map(u => `<option value="${escapeHtml(u.username)}">${escapeHtml(u.fullName || u.username)} (@${escapeHtml(u.username)})</option>`).join('');
    if (currentVal) filterUserEl.value = currentVal;
  }

  if (formUserEl) {
    formUserEl.innerHTML = '<option value="">-- กรุณาเลือกผู้ปฏิบัติงาน --</option>' +
      activeUsers.map(u => `<option value="${escapeHtml(u.username)}" data-fullname="${escapeHtml(u.fullName || u.username)}">${escapeHtml(u.fullName || u.username)} (${u.role || 'Member'})</option>`).join('');
  }

  // เรนเดอร์ Checklist ผู้ปฏิบัติงานใน Modal
  renderModalUsersChecklist();
}

/**
 * เรนเดอร์รายการผู้ปฏิบัติงานใน Modal ลงตารางเข้าไซต์งาน (รองรับเลือกหลายคน)
 */
function renderModalUsersChecklist() {
  const container = document.getElementById('calUsersChecklist');
  const countBadge = document.getElementById('calSelectedUsersCount');
  const tagsContainer = document.getElementById('calSelectedUsersTags');
  const hiddenInput = document.getElementById('calFormUser');
  const quickBtns = document.getElementById('calUserQuickSelectBtns');
  if (!container) return;

  const users = (calendarState.usersList || []).filter(u => u.status !== 'Inactive');
  const curUserRole = String(state.currentUser?.role || '').trim();
  const isMember = (curUserRole !== 'Admin' && curUserRole !== 'Supervisor');
  const curUsername = state.currentUser ? state.currentUser.username : '';

  // หากเป็น Member ล็อกให้เลือกเฉพาะตนเองเท่านั้น
  if (isMember) {
    calendarState.modalSelectedUsers.clear();
    if (curUsername) calendarState.modalSelectedUsers.add(curUsername);
    if (quickBtns) quickBtns.classList.add('hidden');
  } else {
    if (quickBtns) quickBtns.classList.remove('hidden');
  }

  // 1. อัปเดตป้ายจำนวน
  const selCount = calendarState.modalSelectedUsers.size;
  if (countBadge) {
    countBadge.textContent = `เลือกแล้ว ${selCount} คน`;
    if (selCount > 0) {
      countBadge.className = 'text-[11px] font-bold text-emerald-800 bg-emerald-100/90 px-2.5 py-0.5 rounded-full border border-emerald-300 shadow-2xs';
    } else {
      countBadge.className = 'text-[11px] font-bold text-[#6E6862] bg-[#FAF8F2] px-2.5 py-0.5 rounded-full border border-[#EFE9DC]';
    }
  }

  if (hiddenInput) {
    hiddenInput.value = Array.from(calendarState.modalSelectedUsers).join(',');
  }

  // 2. เรนเดอร์ชิปรายชื่อที่ถูกเลือก (Selected User Chips)
  if (tagsContainer) {
    if (selCount === 0) {
      tagsContainer.innerHTML = '';
      tagsContainer.classList.add('hidden');
    } else {
      tagsContainer.classList.remove('hidden');
      const selectedChips = Array.from(calendarState.modalSelectedUsers).map(uName => {
        const u = users.find(x => x.username.toLowerCase() === uName.toLowerCase()) || { username: uName, fullName: uName };
        const displayName = escapeHtml(u.fullName || u.username);
        return `
          <span class="inline-flex items-center gap-1.5 px-2.5 py-1 rounded-xl text-[11px] font-bold bg-emerald-50 text-emerald-900 border border-emerald-200/90 shadow-2xs animate-in fade-in duration-150">
            <span class="w-1.5 h-1.5 rounded-full bg-emerald-500"></span>
            <span>${displayName}</span>
            ${!isMember ? `
              <button type="button" onclick="event.stopPropagation(); removeCalSelectedUser('${escapeHtml(u.username)}')" 
                      class="w-3.5 h-3.5 rounded-full hover:bg-emerald-200/80 text-emerald-700 flex items-center justify-center transition-colors cursor-pointer text-[10px] ml-0.5"
                      title="ลบออก">
                <i class="fa-solid fa-xmark"></i>
              </button>
            ` : ''}
          </span>
        `;
      }).join('');
      tagsContainer.innerHTML = selectedChips;
    }
  }

  // 3. กรองตามคำค้นหา
  const query = (calendarState.modalUserSearchKeyword || '').toLowerCase().trim();
  const filteredUsers = users.filter(u => {
    if (!query) return true;
    const fn = (u.fullName || '').toLowerCase();
    const un = (u.username || '').toLowerCase();
    return fn.includes(query) || un.includes(query);
  });

  if (filteredUsers.length === 0) {
    container.innerHTML = `
      <div class="py-6 text-center text-xs text-[#9E9890]">
        <i class="fa-solid fa-user-slash text-base mb-1 block text-[#C4BEB4]"></i>
        <span>ไม่พบรายชื่อผู้ปฏิบัติงานที่ค้นหา</span>
      </div>
    `;
    return;
  }

  // 4. เรนเดอร์รายการช่างแบบ Checklist
  container.innerHTML = filteredUsers.map(u => {
    const isChecked = calendarState.modalSelectedUsers.has(u.username);
    const initial = (u.fullName || u.username).substring(0, 1).toUpperCase();
    
    let roleBadge = '<span class="px-1.5 py-0.5 rounded text-[10px] font-semibold bg-[#EDE7DA] text-[#6E6862]">Member</span>';
    if (u.role === 'Admin') {
      roleBadge = '<span class="px-1.5 py-0.5 rounded text-[10px] font-bold bg-purple-50 text-purple-700 border border-purple-200">Admin</span>';
    } else if (u.role === 'Supervisor') {
      roleBadge = '<span class="px-1.5 py-0.5 rounded text-[10px] font-bold bg-blue-50 text-blue-700 border border-blue-200">Supervisor</span>';
    }

    const rowBg = isChecked 
      ? 'bg-emerald-50/80 border-emerald-300 ring-1 ring-emerald-500/20 shadow-2xs' 
      : 'bg-white hover:bg-[#FAF8F2] border-[#EFE9DC]';

    const isLockedMember = (isMember && u.username !== curUsername);
    const disabledClass = isLockedMember ? 'opacity-40 cursor-not-allowed' : 'cursor-pointer active:scale-[0.99]';
    const clickHandler = isLockedMember ? '' : `onclick="toggleCalModalUser('${escapeHtml(u.username)}')"` ;

    return `
      <div ${clickHandler}
           class="flex items-center justify-between p-2 rounded-xl border transition-all select-none ${rowBg} ${disabledClass}">
        <div class="flex items-center gap-2.5 min-w-0">
          <input type="checkbox" ${isChecked ? 'checked' : ''} ${isLockedMember ? 'disabled' : ''}
                 onclick="event.stopPropagation(); toggleCalModalUser('${escapeHtml(u.username)}')"
                 class="w-4 h-4 rounded text-emerald-600 focus:ring-emerald-500 border-[#D6CEBF] cursor-pointer">
          <div class="w-7 h-7 rounded-full bg-[#EDE7DA] text-[#201E1C] font-bold text-xs flex items-center justify-center shrink-0">
            ${escapeHtml(initial)}
          </div>
          <div class="min-w-0">
            <div class="font-bold text-xs text-[#201E1C] truncate leading-tight">
              ${escapeHtml(u.fullName || u.username)}
            </div>
            <div class="text-[10px] text-[#6E6862] font-mono truncate">
              @${escapeHtml(u.username)}
            </div>
          </div>
        </div>
        <div class="shrink-0 ml-2">
          ${roleBadge}
        </div>
      </div>
    `;
  }).join('');
}

/**
 * สลับสถานะเลือกผู้ใช้ใน Modal
 */
function toggleCalModalUser(username) {
  if (!username) return;
  const curUserRole = String(state.currentUser?.role || '').trim();
  if (curUserRole !== 'Admin' && curUserRole !== 'Supervisor') {
    return; // Member ไม่สามารถเปลี่ยนเป็นคนอื่นได้
  }

  if (calendarState.modalSelectedUsers.has(username)) {
    calendarState.modalSelectedUsers.delete(username);
  } else {
    calendarState.modalSelectedUsers.add(username);
  }

  renderModalUsersChecklist();
}

/**
 * ลบผู้ใช้ที่เลือกออกจากชิป
 */
function removeCalSelectedUser(username) {
  if (!username) return;
  const curUserRole = String(state.currentUser?.role || '').trim();
  if (curUserRole !== 'Admin' && curUserRole !== 'Supervisor') return;

  calendarState.modalSelectedUsers.delete(username);
  renderModalUsersChecklist();
}

/**
 * เลือกทั้งหมด หรือ ล้างการเลือก
 */
function selectAllCalModalUsers(selectAll) {
  const curUserRole = String(state.currentUser?.role || '').trim();
  if (curUserRole !== 'Admin' && curUserRole !== 'Supervisor') return;

  const users = (calendarState.usersList || []).filter(u => u.status !== 'Inactive');
  if (selectAll) {
    users.forEach(u => calendarState.modalSelectedUsers.add(u.username));

  } else {

/**
 * โหลดข้อมูลตารางกำหนดการเข้าไซต์งาน
 */
function loadCalendarSchedules() {
  if (calendarState.isLoading) return;
  calendarState.isLoading = true;

  const refreshIcon = document.getElementById('calRefreshIcon');
  if (refreshIcon) refreshIcon.classList.add('animate-spin');

  updateCalendarMonthTitle();

  if (typeof google === 'undefined' || !google.script || !google.script.run) {
    calendarState.isLoading = false;
    if (refreshIcon) refreshIcon.classList.remove('animate-spin');
    renderCalendarGrid();
    return;
  }

  google.script.run
    .withSuccessHandler(function(res) {
      calendarState.isLoading = false;
      if (refreshIcon) refreshIcon.classList.remove('animate-spin');
      if (res && res.success) {
        calendarState.schedules = res.schedules || [];
        renderCalendarGrid();
        renderCalendarAgenda();
        updateTodayDutyCountBadge();
      } else {
        showToast(res ? res.message : 'ไม่สามารถโหลดข้อมูลปฏิทินได้', 'error');
      }
    })
    .withFailureHandler(function(err) {
      calendarState.isLoading = false;
      if (refreshIcon) refreshIcon.classList.remove('animate-spin');
      showToast('เกิดข้อผิดพลาด: ' + err.message, 'error');
    })
    .getSiteSchedules(calendarState.currentYear, calendarState.currentMonth, calendarState.siteFilter, calendarState.userFilter);
}

/**
 * รีเฟรชข้อมูลปฏิทินแบบแมนนวล
 */
function refreshCalendarData() {
  syncCalendarDropdowns();

  showToast('กำลังรีเฟรชข้อมูลปฏิทิน...', 'info', 1500);
}

/**
 * เลื่อนเดือนในปฏิทิน (-1 หรือ +1)
 */
function changeCalendarMonth(delta) {
  calendarState.currentMonth += delta;
  if (calendarState.currentMonth < 1) {
    calendarState.currentMonth = 12;
    calendarState.currentYear -= 1;
  } else if (calendarState.currentMonth > 12) {
    calendarState.currentMonth = 1;
    calendarState.currentYear += 1;
  }
  loadCalendarSchedules();
}

function getFilteredSchedules() {

  return calendarState.schedules.filter(item => {
    if (calendarState.siteFilter !== 'ALL' && item.site !== calendarState.siteFilter) return false;
    if (calendarState.userFilter !== 'ALL' && item.username.toLowerCase() !== calendarState.userFilter.toLowerCase()) return false;
    if (calendarState.myScheduleOnly && item.username.toLowerCase() !== curUser) return false;
    return true;
  });
}

/**
 * เรนเดอร์ตารางปฏิทินรายเดือน (Monthly Grid View 7x5 หรือ 7x6)
 */
function renderCalendarGrid() {
  const container = document.getElementById('calGridDays');
  if (!container) return;

  const year = calendarState.currentYear;
  const month = calendarState.currentMonth; // 1 - 12

  const settings = state.settings || (window.adminState && adminState.settings) || {};
  const firstDaySetting = parseInt(settings.CALENDAR_FIRST_DAY_OF_WEEK !== undefined ? settings.CALENDAR_FIRST_DAY_OF_WEEK : '0', 10); // 0=Sun, 1=Mon
  const maxChips = parseInt(settings.CALENDAR_MAX_CHIPS_PER_CELL !== undefined ? settings.CALENDAR_MAX_CHIPS_PER_CELL : '3', 10);

  // อัปเดตหัวตารางวัน (Sun-Sat หรือ Mon-Sun)
  const headerContainer = document.getElementById('calGridWeekdayHeaders');
  if (headerContainer) {
    if (firstDaySetting === 1) {
      headerContainer.innerHTML = `
        <div>จันทร์</div>
        <div>อังคาร</div>
        <div>พุธ</div>
        <div>พฤหัสบดี</div>
        <div>ศุกร์</div>
        <div class="text-indigo-600">เสาร์</div>
        <div class="text-rose-600">อาทิตย์</div>
      `;
    } else {
      headerContainer.innerHTML = `
        <div class="text-rose-600">อาทิตย์</div>
        <div>จันทร์</div>
        <div>อังคาร</div>
        <div>พุธ</div>
        <div>พฤหัสบดี</div>
        <div>ศุกร์</div>
        <div class="text-indigo-600">เสาร์</div>
      `;
    }
  }

  // วันในสัปดาห์ของวันที่ 1 ของเดือน (0 = อาทิตย์, 1 = จันทร์, ..., 6 = เสาร์)
  const dayOfWeek = new Date(year, month - 1, 1).getDay();
  // คำนวณจำนวนวันว่าง Leading Days ตามวันเริ่มต้นสัปดาห์
  const leadingDays = (firstDaySetting === 1) ? ((dayOfWeek + 6) % 7) : dayOfWeek;

  // จำนวนวันในเดือนนี้
  const daysInMonth = new Date(year, month, 0).getDate();
  // จำนวนวันในเดือนก่อนหน้า
  const daysInPrevMonth = new Date(year, month - 1, 0).getDate();

  const today = new Date();
  const todayIso = `${today.getFullYear()}-${String(today.getMonth() + 1).padStart(2, '0')}-${String(today.getDate()).padStart(2, '0')}`;

  const filtered = getFilteredSchedules();
  // จับคู่ตามวันที่ YYYY-MM-DD
  const scheduleByDate = {};
  filtered.forEach(s => {
    if (!scheduleByDate[s.date]) scheduleByDate[s.date] = [];
    scheduleByDate[s.date].push(s);
  });

  let html = '';

  // 1. เติมวันของเดือนก่อนหน้า (Padding Leading Days)
  for (let i = leadingDays - 1; i >= 0; i--) {
    const prevDayNum = daysInPrevMonth - i;
    const prevMonth = month === 1 ? 12 : month - 1;
    const prevYear = month === 1 ? year - 1 : year;
    const dateStr = `${prevYear}-${String(prevMonth).padStart(2, '0')}-${String(prevDayNum).padStart(2, '0')}`;
    const dayItems = scheduleByDate[dateStr] || [];

    html += renderCalendarCellHtml(prevDayNum, dateStr, dayItems, false, false, maxChips);
  }

  // 2. เติมวันของเดือนปัจจุบัน
  for (let day = 1; day <= daysInMonth; day++) {
    const dateStr = `${year}-${String(month).padStart(2, '0')}-${String(day).padStart(2, '0')}`;
    const isToday = (dateStr === todayIso);
    const dayItems = scheduleByDate[dateStr] || [];

    html += renderCalendarCellHtml(day, dateStr, dayItems, true, isToday, maxChips);
  }

  // 3. เติมวันของเดือนถัดไป (Padding Trailing Days เพื่อให้ครบสัปดาห์)
  const totalCells = leadingDays + daysInMonth;
  const nextDaysCount = (7 - (totalCells % 7)) % 7;
  for (let day = 1; day <= nextDaysCount; day++) {
    const nextMonth = month === 12 ? 1 : month + 1;
    const nextYear = month === 12 ? year + 1 : year;
    const dateStr = `${nextYear}-${String(nextMonth).padStart(2, '0')}-${String(day).padStart(2, '0')}`;
    const dayItems = scheduleByDate[dateStr] || [];

    html += renderCalendarCellHtml(day, dateStr, dayItems, false, false, maxChips);
  }

  container.innerHTML = html;
}

/**
 * แปลงวันที่เป็นข้อความภาษาไทยสวยงาม
 */
function formatThaiDateDisplay(dateStr) {
  if (!dateStr) return '';
  const parts = dateStr.split('-');
  if (parts.length !== 3) return dateStr;
  const d = new Date(parseInt(parts[0], 10), parseInt(parts[1], 10) - 1, parseInt(parts[2], 10));
  const dayName = THAI_DAY_NAMES[d.getDay()] || '';
  const monthName = THAI_MONTH_NAMES[parseInt(parts[1], 10) - 1] || '';
  const thaiYear = parseInt(parts[0], 10) + 543;
  return `${dayName}ที่ ${parseInt(parts[2], 10)} ${monthName} ${thaiYear}`;
}

function openScheduleModal(dateStr, scheduleId) {

    showToast('จำกัดเฉพาะสิทธิ์ Admin หรือ Supervisor เท่านั้น', 'warning');
    return;

  const modal = document.getElementById('modalSiteSchedule');
  const titleEl = document.getElementById('modalScheduleFormTitle');

  const idInput = document.getElementById('calFormScheduleId');
  const dateInput = document.getElementById('calFormDate');

  const purposeInput = document.getElementById('calFormPurpose');
  const taskSelect = document.getElementById('calFormTaskId');
  const notifyCheck = document.getElementById('calFormNotifyTelegram');
  const searchInput = document.getElementById('calUserSearchInput');

  if (!calendarState.sites || calendarState.sites.length === 0 || !calendarState.tasks || calendarState.tasks.length === 0) {

      loadCalendarBootstrapData();
    }
  }

  const userRole = String(state.currentUser?.role || '').trim();
  const isAdminOrSup = (userRole === 'Admin' || userRole === 'Supervisor');

  // รีเซ็ตการค้นหาช่าง
  calendarState.modalUserSearchKeyword = '';
  if (searchInput) searchInput.value = '';

  if (scheduleId) {
    const item = calendarState.schedules.find(s => s.id === scheduleId);

        return;
      }
      if (titleEl) titleEl.textContent = 'แก้ไขตารางเข้าไซต์งาน';
      if (submitTextEl) submitTextEl.textContent = 'บันทึกการแก้ไข';
      if (idInput) idInput.value = item.id;
      if (dateInput) dateInput.value = item.date;
      
      // ซิงค์ตัวเลือกและจัดกลุ่มงานตามไซต์ของรายการนี้
      syncCalendarDropdowns(item.site);
      if (siteSelect) siteSelect.value = item.site;
      if (purposeInput) purposeInput.value = item.purpose || '';
      if (taskSelect) taskSelect.value = item.taskId || '';
      if (notifyCheck) notifyCheck.checked = true;

      // เลือกช่างของรายการนี้ไว้
      calendarState.modalSelectedUsers = new Set([item.username]);
    }
  } else {
    if (titleEl) titleEl.textContent = 'ลงตารางเข้าไซต์งาน';
    if (submitTextEl) submitTextEl.textContent = 'บันทึกกำหนดการ';
    if (idInput) idInput.value = '';
    const today = new Date();
    const todayIso = `${today.getFullYear()}-${String(today.getMonth() + 1).padStart(2, '0')}-${String(today.getDate()).padStart(2, '0')}`;
    if (dateInput) dateInput.value = dateStr || todayIso;
    
    const initialSite = (calendarState.siteFilter !== 'ALL') ? calendarState.siteFilter : '';
    syncCalendarDropdowns(initialSite);
    if (siteSelect) siteSelect.value = initialSite;
    if (purposeInput) purposeInput.value = '';
    if (taskSelect) taskSelect.value = '';
    if (notifyCheck) notifyCheck.checked = true;

    // ค่าเริ่มต้นสำหรับเลือกช่าง
    if (!isAdminOrSup && state.currentUser) {
      calendarState.modalSelectedUsers = new Set([state.currentUser.username]);
    } else if (calendarState.userFilter !== 'ALL') {
      calendarState.modalSelectedUsers = new Set([calendarState.userFilter]);
    } else {
      calendarState.modalSelectedUsers = new Set();
    }
  }

  // เรนเดอร์ Checklist ช่าง
  renderModalUsersChecklist();

  if (modal) modal.classList.remove('hidden');
}

/**
 * ปิด Modal ฟอร์ม
 */
function closeScheduleModal() {
  const modal = document.getElementById('modalSiteSchedule');
  if (modal) modal.classList.add('hidden');
  calendarState.modalSelectedUsers.clear();
  calendarState.modalUserSearchKeyword = '';
  const searchInput = document.getElementById('calUserSearchInput');
  if (searchInput) searchInput.value = '';
}

/**
 * ตั้งวันที่ในฟอร์มเป็น วันนี้
 */
function setCalFormDateToday() {
  const d = new Date();
  const iso = `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
  const input = document.getElementById('calFormDate');
  if (input) input.value = iso;
}

/**
 * ตั้งวันที่ในฟอร์มเป็น วันพรุ่งนี้
 */
function setCalFormDateTomorrow() {
  const d = new Date(Date.now() + 24 * 60 * 60 * 1000);
  const iso = `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
  const input = document.getElementById('calFormDate');
  if (input) input.value = iso;
}

/**
 * กดแก้ไขจาก Modal รายวัน
 */
function editSiteSchedule(scheduleId) {
  closeDayScheduleDetailModal();
  openScheduleModal(null, scheduleId);
}

/**
 * บันทึกฟอร์มลงตารางเข้าไซต์งาน
 */
function handleScheduleFormSubmit(event) {
  if (event) event.preventDefault();

  if (!canManageCalendar()) {
    showToast('จำกัดเฉพาะสิทธิ์ Admin หรือ Supervisor เท่านั้น', 'warning');
    return;
  }

  const id = document.getElementById('calFormScheduleId')?.value || '';
  const date = document.getElementById('calFormDate')?.value || '';
  const site = document.getElementById('calFormSite')?.value || '';
  const purpose = document.getElementById('calFormPurpose')?.value || '';
  const taskId = document.getElementById('calFormTaskId')?.value || '';
  const notifyTelegram = document.getElementById('calFormNotifyTelegram')?.checked ?? true;

  const userRole = String(state.currentUser?.role || '').trim();
  const isAdminOrSup = (userRole === 'Admin' || userRole === 'Supervisor');

  // ตรวจสอบช่างที่เลือก
  let usernames = Array.from(calendarState.modalSelectedUsers);
  if (!isAdminOrSup && state.currentUser) {
    usernames = [state.currentUser.username];
  }

  if (!date || !site) {
    showToast('กรุณากรอก วันที่ และ ไซต์งาน ให้ครบถ้วน', 'warning');
    return;
  }

  if (usernames.length === 0) {
    showToast('กรุณาเลือกผู้ปฏิบัติงานอย่างน้อย 1 คน', 'warning');
    return;
  }

  const usersList = calendarState.usersList || [];
  const userDetails = usernames.map(uName => {
    const found = usersList.find(u => String(u.username).toLowerCase() === String(uName).toLowerCase());
    return {
      username: uName,
      fullName: found ? (found.fullName || found.username) : uName
    };
  });

  const scheduleData = {
    id: id,
    date: date,
    site: site,
    usernames: usernames,
    usersDetail: userDetails,
    username: usernames[0], // backward compatibility
    fullName: userDetails[0]?.fullName || usernames[0],
    purpose: purpose,
    taskId: taskId,
    notifyTelegram: notifyTelegram
  };

  const btnSubmit = document.getElementById('btnSubmitScheduleForm');
  if (btnSubmit) {
    btnSubmit.disabled = true;
    btnSubmit.classList.add('opacity-60');
  }

  const operatorUsername = state.currentUser ? state.currentUser.username : 'admin';

  if (typeof google === 'undefined' || !google.script || !google.script.run) {
    if (btnSubmit) {
      btnSubmit.disabled = false;
      btnSubmit.classList.remove('opacity-60');
    }
    showToast('กำลังอยู่ในโหมดจำลอง ไม่สามารถส่งข้อมูลไปยังเซิร์ฟเวอร์ได้', 'info');
    return;
  }

  google.script.run
    .withSuccessHandler(function(res) {
      if (btnSubmit) {
        btnSubmit.disabled = false;
        btnSubmit.classList.remove('opacity-60');
      }
      if (res && res.success) {
        showToast(res.message || 'บันทึกตารางเข้าไซต์งานสำเร็จ!', 'success');
        closeScheduleModal();
        loadCalendarSchedules();
      } else {
        showToast(res ? res.message : 'ไม่สามารถบันทึกข้อมูลได้', 'error');
      }
    })
    .withFailureHandler(function(err) {
      if (btnSubmit) {
        btnSubmit.disabled = false;
        btnSubmit.classList.remove('opacity-60');
      }
      showToast('เกิดข้อผิดพลาด: ' + err.message, 'error');
    })
    .saveSiteSchedule(scheduleData, operatorUsername);
}

/**
 * ยืนยันและลบรายการตารางเข้าไซต์งาน
 */
function confirmDeleteSiteSchedule(scheduleId) {
  if (!canManageCalendar()) {
    showToast('จำกัดเฉพาะสิทธิ์ Admin หรือ Supervisor เท่านั้น', 'warning');
    return;
  }

  const userRole = String(state.currentUser?.role || '').trim();
  const isAdminOrSup = (userRole === 'Admin' || userRole === 'Supervisor');
  if (!isAdminOrSup) {
    const item = calendarState.schedules.find(s => s.id === scheduleId);
    if (item && item.username !== state.currentUser?.username) {
      showToast('คุณสามารถลบได้เฉพาะรายการของตนเองเท่านั้น', 'warning');
      return;
    }
  }

  if (typeof Swal !== 'undefined') {
    Swal.fire({
      title: 'ยืนยันการลบรายการ?',
      text: 'คุณต้องการลบกำหนดการเข้าไซต์งานนี้ใช่หรือไม่?',
      icon: 'warning',
      showCancelButton: true,
      confirmButtonColor: '#e11d48',
      cancelButtonColor: '#6e6862',
      confirmButtonText: 'ใช่, ลบรายการ',
      cancelButtonText: 'ยกเลิก',
      reverseButtons: true
    }).then((result) => {
      if (result.isConfirmed) {
        executeDeleteSiteSchedule(scheduleId);
      }
    });
  } else {
    if (confirm('คุณต้องการลบกำหนดการเข้าไซต์งานนี้ใช่หรือไม่?')) {
      executeDeleteSiteSchedule(scheduleId);
    }
  }
}

/**
 * เรียก API ลบรายการ
 */
function executeDeleteSiteSchedule(scheduleId) {
  const operatorUsername = state.currentUser ? state.currentUser.username : 'admin';
  if (typeof google === 'undefined' || !google.script || !google.script.run) return;

  google.script.run
    .withSuccessHandler(function(res) {
      if (res && res.success) {
        showToast('ลบรายการนัดหมายเรียบร้อยแล้ว', 'success');
        loadCalendarSchedules();
        // หากเปิด Modal รายวันอยู่ ให้รีเฟรชข้อมูลใน Modal ด้วย
        if (calendarState.selectedDate) {
          openDayScheduleDetail(calendarState.selectedDate);
        }
      } else {
        showToast(res ? res.message : 'ไม่สามารถลบรายการได้', 'error');
      }
    })
    .withFailureHandler(function(err) {
      showToast('เกิดข้อผิดพลาดในการลบ: ' + err.message, 'error');
    })
    .deleteSiteSchedule(scheduleId, operatorUsername);
}

/**
 * กระโดดไปดูงานในระบบ Work Tracker (Deep Link)
 */
function jumpToTaskInWorkTracker(taskId) {
  closeDayScheduleDetailModal();
  enterApp('work_tracker');
  // ค้นหาและไฮไลต์ Task นั้น
  setTimeout(() => {
    const searchInput = document.getElementById('searchInput');
    if (searchInput) {
      searchInput.value = taskId;
      if (typeof renderDashboard === 'function') renderDashboard();
    }
    showToast(`กำลังเปิดงาน #${taskId} ในระบบติดตามงาน`, 'info', 2000);
  }, 200);
}
</script>
