/**
 * ขอรหัส PIN 6 หลักผ่าน Telegram
 */
function handleRequestPin() {
  const usernameInput = document.getElementById('loginUsername');
  const username = (state.loginUsername || usernameInput.value).trim().toLowerCase();

  if (!username) {
    Swal.fire({ icon: 'warning', title: 'กรุณากรอกชื่อผู้ใช้', text: 'กรุณาระบุชื่อผู้ใช้ (Username) ของคุณ' });
    if (usernameInput) usernameInput.focus();
    return;
  }

  state.loginUsername = username;

  const btn = document.getElementById('btnRequestPin');
  const btnResend = document.getElementById('btnResendPin');
  if (btn) {
    btn.disabled = true;
    btn.innerHTML = '<i class="fa-solid fa-circle-notch fa-spin mr-1"></i> กำลังส่ง PIN เข้า Telegram...';
  }
  if (btnResend) {
    btnResend.disabled = true;
    btnResend.innerText = 'กำลังส่งรหัส...';
  }

  google.script.run
    .withSuccessHandler((res) => {
      if (btn) {
        btn.disabled = false;
        btn.innerHTML = '<i class="fa-brands fa-telegram text-base"></i> <span>ขอรหัส PIN ทาง Telegram</span>';
      }
      if (btnResend) {
        btnResend.disabled = false;
        btnResend.innerHTML = 'ไม่ได้รับรหัส? <span class="underline">ส่งรหัสใหม่อีกครั้ง</span>';
      }

      if (!res.success) {
        Swal.fire({ icon: 'error', title: 'ขอรหัสไม่สำเร็จ', text: res.message });
        return;
      }

      // สลับไปขั้นตอนที่ 2
      document.getElementById('loginStep1').classList.add('hidden');
      document.getElementById('loginStep2').classList.remove('hidden');
      document.getElementById('loginUserDisplay').innerText = res.fullName || res.username;
      document.getElementById('loginUsernameDisplay').innerText = '@' + res.username;

      // ล้างช่อง PIN ทั้งหมดและโฟกัสช่องแรก
      clearPinInputs();

      // เริ่มนับถอยหลัง 5 นาที (300 วินาที)
      startPinCountdown(res.expiresIn || 300);

      Swal.fire({
        toast: true,
        position: 'top-end',
        icon: 'info',
        title: res.message,
        showConfirmButton: false,
        timer: 4000
      });
    })
    .withFailureHandler((err) => {
      if (btn) {
        btn.disabled = false;
        btn.innerHTML = '<i class="fa-brands fa-telegram text-base"></i> <span>ขอรหัส PIN ทาง Telegram</span>';
      }
      if (btnResend) {
        btnResend.disabled = false;
        btnResend.innerHTML = 'ไม่ได้รับรหัส? <span class="underline">ส่งรหัสใหม่อีกครั้ง</span>';
      }
      Swal.fire({ icon: 'error', title: 'เกิดข้อผิดพลาด', text: err.message });
    })
    .requestLoginPin(username);
}

function backToStep1() {
  if (state.countdownInterval) clearInterval(state.countdownInterval);
  document.getElementById('loginStep2').classList.add('hidden');
  document.getElementById('loginStep1').classList.remove('hidden');
  clearPinInputs();
  setTimeout(() => {
    document.getElementById('loginUsername').focus();
  }, 200);
}

function startPinCountdown(seconds) {
  if (state.countdownInterval) clearInterval(state.countdownInterval);
  let remaining = seconds;
  const timerDisplay = document.getElementById('countdownTimerText');

  const updateDisplay = () => {
    const mins = Math.floor(remaining / 60);
    const secs = remaining % 60;
    if (timerDisplay) {
      timerDisplay.innerText = `${String(mins).padStart(2, '0')}:${String(secs).padStart(2, '0')}`;
    }
    if (remaining <= 0) {
      clearInterval(state.countdownInterval);
      if (timerDisplay) timerDisplay.innerText = '00:00 (หมดอายุ)';
    }
    remaining--;
  };

  updateDisplay();
  state.countdownInterval = setInterval(updateDisplay, 1000);
}

function clearPinInputs() {
  for (let i = 0; i < 6; i++) {
    const el = document.getElementById('pin-' + i);
    if (el) el.value = '';
  }
  const first = document.getElementById('pin-0');
  if (first) first.focus();
}

/**
 * ตั้งค่าการพิมพ์และควบคุมช่อง PIN 6 หลัก
 */
function setupPinInputHandlers() {
  const container = document.getElementById('pinInputsContainer');
  if (!container) return;

  for (let i = 0; i < 6; i++) {
    const input = document.getElementById('pin-' + i);
    if (!input) continue;

    input.addEventListener('input', (e) => {
      const val = e.target.value.replace(/\D/g, '');
      e.target.value = val ? val[0] : '';
      if (val && i < 5) {
        const next = document.getElementById('pin-' + (i + 1));
        if (next) next.focus();
      }
      // หากกรอกครบ 6 ตัว ให้ล็อกอินอัตโนมัติ
      checkAndAutoSubmitPin();
    });

    input.addEventListener('keydown', (e) => {
      if (e.key === 'Backspace' && !e.target.value && i > 0) {
        const prev = document.getElementById('pin-' + (i - 1));
        if (prev) {
          prev.focus();
          prev.value = '';
        }
      } else if (e.key === 'Enter') {
        handleVerifyPin();
      }
    });

    input.addEventListener('paste', (e) => {
      e.preventDefault();
      const pastedData = (e.clipboardData || window.clipboardData).getData('text').replace(/\D/g, '');
      if (pastedData) {
        for (let j = 0; j < 6 && j < pastedData.length; j++) {
          const pinBox = document.getElementById('pin-' + j);
          if (pinBox) pinBox.value = pastedData[j];
        }
        if (pastedData.length >= 6) {
          const last = document.getElementById('pin-5');
          if (last) last.focus();
          handleVerifyPin();
        } else {
          const target = document.getElementById('pin-' + Math.min(pastedData.length, 5));
          if (target) target.focus();
        }
      }
    });
  }

  // กด Enter ที่ช่อง Username
  const uInput = document.getElementById('loginUsername');
  if (uInput) {
    uInput.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') handleRequestPin();
    });
  }
}

function checkAndAutoSubmitPin() {
  let pin = '';
  for (let i = 0; i < 6; i++) {
    const val = document.getElementById('pin-' + i).value;
    if (!val) return;
    pin += val;
  }
  if (pin.length === 6) {
    handleVerifyPin();
  }
}

/**
 * ยืนยันรหัส PIN 6 หลักเพื่อเข้าสู่ระบบ
 */
function handleVerifyPin() {
  let pin = '';
  for (let i = 0; i < 6; i++) {
    const val = document.getElementById('pin-' + i).value;
    pin += val;
  }

  if (pin.length !== 6) {
    Swal.fire({ icon: 'warning', title: 'กรุณากรอกรหัส PIN ให้ครบ 6 หลัก' });
    return;
  }

  const btn = document.getElementById('btnVerifyPin');
  btn.disabled = true;
  btn.innerHTML = '<i class="fa-solid fa-circle-notch fa-spin mr-1"></i> กำลังตรวจสอบรหัส...';

  google.script.run
    .withSuccessHandler((res) => {
      btn.disabled = false;
      btn.innerHTML = '<i class="fa-solid fa-lock-open text-xs mr-1"></i> เข้าสู่ระบบ';

      if (!res.success) {
        Swal.fire({ icon: 'error', title: 'เข้าสู่ระบบไม่สำเร็จ', text: res.message });
        clearPinInputs();
        return;
      }

      // บันทึก Session
      if (state.countdownInterval) clearInterval(state.countdownInterval);
      state.currentUser = res.user;
      sessionStorage.setItem('work_tracker_session', JSON.stringify(res.user));

      updateNavbarUser();
      startHeartbeat();
      document.getElementById('loginScreen').classList.add('hidden');

      Swal.fire({
        toast: true,
        position: 'top-end',
        icon: 'success',
        title: `ยินดีต้อนรับ ${res.user.fullName || res.user.username}`,
        showConfirmButton: false,
        timer: 2500
      });

      // โหลดข้อมูล Dashboard
      loadInitialData();
    })
    .withFailureHandler((err) => {
      btn.disabled = false;
      btn.innerHTML = '<i class="fa-solid fa-lock-open text-xs mr-1"></i> เข้าสู่ระบบ';
      Swal.fire({ icon: 'error', title: 'เกิดข้อผิดพลาด', text: err.message });
    })
    .verifyLoginPin(state.loginUsername, pin);
}

/**
 * ออกจากระบบ (Logout)
 */
function handleLogout() {
  Swal.fire({
    title: 'ออกจากระบบ?',
    text: 'คุณต้องการออกจากระบบหรือไม่?',
    icon: 'question',
    showCancelButton: true,
    confirmButtonColor: '#2563eb',
    cancelButtonColor: '#64748b',
    confirmButtonText: 'ออกจากระบบ',
    cancelButtonText: 'ยกเลิก'
  }).then((result) => {
    if (result.isConfirmed) {
      const oldUsername = state.currentUser ? state.currentUser.username : '';
      stopHeartbeat();
      stopRealtimeSync();
      if (oldUsername) {
        google.script.run.logoutOnlineUser(oldUsername);
      }

      sessionStorage.removeItem('work_tracker_session');
      state.currentUser = null;
      state.loginUsername = '';
      state.filters.dueDateInitialized = false;
      state.filters.dueDateFrom = '';
      state.filters.dueDateTo = '';
      state.filters.includeNoDueDate = false;
      if (state.countdownInterval) clearInterval(state.countdownInterval);

      // รีเซ็ตหน้าจอ Login
      document.getElementById('loginUsername').value = '';
      clearPinInputs();
      document.getElementById('loginStep2').classList.add('hidden');
      document.getElementById('loginStep1').classList.remove('hidden');
      document.getElementById('loginScreen').classList.remove('hidden');
      document.getElementById('userProfileBadge').classList.add('hidden');
      const btnOnline = document.getElementById('btnOnlineUsers');
      if (btnOnline) btnOnline.classList.add('hidden');
    }
  });
}

/**

 * SETTINGS TABS & USER MANAGEMENT
 * =========================================================================
 */

function setTabBtnState(btn, isActive) {
  if (!btn) return;
  if (isActive) {
    btn.classList.add('border-[#2491FA]', 'text-[#2491FA]', 'font-bold');
    btn.classList.remove('border-transparent', 'text-[#6E6862]', 'font-semibold');
  } else {
    btn.classList.remove('border-[#2491FA]', 'text-[#2491FA]', 'font-bold');
    btn.classList.add('border-transparent', 'text-[#6E6862]', 'font-semibold');
  }
}

function switchSettingsTab(tabName) {
  const tabGeneral = document.getElementById('settingsTabGeneral');
  const tabSites = document.getElementById('settingsTabSites');
  const tabUsers = document.getElementById('settingsTabUsers');
  const btnGeneral = document.getElementById('btnTabGeneral');
  const btnSites = document.getElementById('btnTabSites');
  const btnUsers = document.getElementById('btnTabUsers');

  if (tabGeneral) tabGeneral.classList.toggle('hidden', tabName !== 'general');
  if (tabSites) tabSites.classList.toggle('hidden', tabName !== 'sites');
  if (tabUsers) tabUsers.classList.toggle('hidden', tabName !== 'users');

  setTabBtnState(btnGeneral, tabName === 'general');
  setTabBtnState(btnSites, tabName === 'sites');
  setTabBtnState(btnUsers, tabName === 'users');

  if (tabName === 'sites') {
    loadSitesTab();
  } else if (tabName === 'users') {
    loadUsersList();
  }
}

function loadUsersList() {
  const tbody = document.getElementById('usersTableBody');
  if (tbody) tbody.innerHTML = '<tr><td colspan="6" class="text-center py-4 text-slate-400"><i class="fa-solid fa-spinner fa-spin mr-1"></i> กำลังโหลดรายชื่อผู้ใช้...</td></tr>';

  google.script.run
    .withSuccessHandler((res) => {
      if (!res.success) {
        tbody.innerHTML = `<tr><td colspan="6" class="text-center py-4 text-rose-500">${res.message}</td></tr>`;
        return;
      }
      state.users = res.users || [];
      renderUsersTable(state.users);
      renderAssigneeFormOptions();
      renderAssigneeFilterOptions();
      renderUserReportersList();
    })
    .withFailureHandler((err) => {
      tbody.innerHTML = `<tr><td colspan="6" class="text-center py-4 text-rose-500">${err.message}</td></tr>`;
    })
    .getUsersList();
}

function renderUsersTable(users) {
  const tbody = document.getElementById('usersTableBody');
  if (!tbody) return;

  if (users.length === 0) {
    tbody.innerHTML = '<tr><td colspan="6" class="text-center py-4 text-slate-400">ยังไม่มีข้อมูลผู้ใช้ในระบบ</td></tr>';
    return;
  }

  tbody.innerHTML = users.map(u => {
    const isCurrentUser = state.currentUser && state.currentUser.username.toLowerCase() === u.username.toLowerCase();
    const isAllSites = !u.allowedSites || u.allowedSites === 'ALL' || u.role === 'Admin';
    let sitesBadge = '';
    if (isAllSites) {
      sitesBadge = '<span class="px-2 py-0.5 rounded text-[10px] font-bold bg-emerald-100 text-emerald-700">ทุกไซต์งาน</span>';
    } else if (Array.isArray(u.allowedSites)) {
      const count = u.allowedSites.length;
      const titleTooltip = escapeHtml(u.allowedSites.join(', '));
      sitesBadge = `<span class="px-2 py-0.5 rounded text-[10px] font-bold bg-blue-100 text-blue-700 cursor-help" title="${titleTooltip}">เฉพาะ ${count} ไซต์</span>`;
    } else {
      sitesBadge = '<span class="px-2 py-0.5 rounded text-[10px] font-bold bg-emerald-100 text-emerald-700">ทุกไซต์งาน</span>';
    }

    return `
      <tr class="hover:bg-slate-50/80 transition-colors">
        <td class="px-3 py-2.5 font-mono font-semibold text-slate-800">
          ${escapeHtml(u.username)}
          ${isCurrentUser ? '<span class="ml-1 text-[10px] bg-blue-100 text-blue-700 px-1 rounded">คุณ</span>' : ''}
        </td>
        <td class="px-3 py-2.5 text-slate-700">${escapeHtml(u.fullName)}</td>
        <td class="px-3 py-2.5 font-mono text-slate-500">${u.telegramChatId ? escapeHtml(u.telegramChatId) : '<span class="text-rose-500 italic">ยังไม่ระบุ</span>'}</td>
        <td class="px-3 py-2.5">
          <span class="px-1.5 py-0.5 rounded text-[10px] font-bold ${u.role === 'Admin' ? 'bg-purple-100 text-purple-700' : 'bg-slate-100 text-slate-600'}">
            ${escapeHtml(u.role)}
          </span>
        </td>
        <td class="px-3 py-2.5">
          ${sitesBadge}
        </td>
        <td class="px-3 py-2.5 text-right">
          <div class="flex items-center justify-end gap-1">
            <button onclick='editUser(${JSON.stringify(u)})' class="p-1 text-slate-400 hover:text-blue-600 rounded cursor-pointer" title="แก้ไข">
              <i class="fa-regular fa-pen-to-square"></i>
            </button>
            ${u.username !== 'admin' ? `
              <button onclick="confirmDeleteUser('${u.username}')" class="p-1 text-slate-400 hover:text-rose-600 rounded cursor-pointer" title="ลบ">
                <i class="fa-regular fa-trash-can"></i>
              </button>
            ` : ''}
          </div>
        </td>
      </tr>
    `;
  }).join('');
}

function handleSiteAccessTypeChange() {
  const selectedRadio = document.querySelector('input[name="siteAccessType"]:checked');
  const container = document.getElementById('userSpecificSitesContainer');
  if (!selectedRadio || !container) return;

  if (selectedRadio.value === 'CUSTOM') {
    container.classList.remove('hidden');
    renderUserSitesCheckboxes();
  } else {
    container.classList.add('hidden');
  }
}

function renderUserSitesCheckboxes(selectedSites = []) {
  const container = document.getElementById('userSitesCheckboxList');
  if (!container) return;

  const sitesToRender = state.allSites && state.allSites.length > 0 ? state.allSites : (state.sites || []);
  if (sitesToRender.length === 0) {
    container.innerHTML = '<p class="text-slate-400 text-xs col-span-2 py-2">ยังไม่มีไซต์งานในระบบ</p>';
    return;
  }

  container.innerHTML = sitesToRender.map(siteName => {
    const isChecked = selectedSites.includes(siteName);
    return `
      <label class="flex items-center gap-2 p-1.5 rounded-lg hover:bg-slate-50 border border-slate-100 cursor-pointer text-xs transition-colors">
        <input type="checkbox" name="userSiteCheckbox" value="${escapeHtml(siteName)}" ${isChecked ? 'checked' : ''}
               class="rounded text-[#2491FA] focus:ring-[#2491FA]">
        <span class="text-slate-700 truncate" title="${escapeHtml(siteName)}">${escapeHtml(siteName)}</span>
      </label>
    `;
  }).join('');
}

function selectAllUserSites(selectAll) {
  const checkboxes = document.querySelectorAll('input[name="userSiteCheckbox"]');
  checkboxes.forEach(cb => { cb.checked = selectAll; });
}

function openAddUserForm() {
  document.getElementById('userFormTitle').innerText = 'เพิ่มผู้ใช้ใหม่';
  document.getElementById('inputUserUsername').value = '';
  document.getElementById('inputUserUsername').readOnly = false;
  document.getElementById('inputUserFullName').value = '';
  document.getElementById('inputUserChatId').value = '';
  document.getElementById('inputUserRole').value = 'Member';

  const radioAll = document.querySelector('input[name="siteAccessType"][value="ALL"]');
  if (radioAll) radioAll.checked = true;
  const container = document.getElementById('userSpecificSitesContainer');
  if (container) container.classList.add('hidden');
  selectAllUserSites(false);

  document.getElementById('userFormContainer').classList.remove('hidden');
}

function cancelUserForm() {
  document.getElementById('userFormContainer').classList.add('hidden');
}

function editUser(user) {
  document.getElementById('userFormTitle').innerText = `แก้ไขข้อมูลผู้ใช้ (@${user.username})`;
  const uInput = document.getElementById('inputUserUsername');
  uInput.value = user.username;
  uInput.readOnly = true; // ไม่ให้แก้ username
  document.getElementById('inputUserFullName').value = user.fullName;
  document.getElementById('inputUserChatId').value = user.telegramChatId || '';
  document.getElementById('inputUserRole').value = user.role || 'Member';

  const isAll = !user.allowedSites || user.allowedSites === 'ALL';
  const radioAll = document.querySelector('input[name="siteAccessType"][value="ALL"]');
  const radioCustom = document.querySelector('input[name="siteAccessType"][value="CUSTOM"]');
  const container = document.getElementById('userSpecificSitesContainer');

  if (isAll) {
    if (radioAll) radioAll.checked = true;
    if (container) container.classList.add('hidden');
    selectAllUserSites(false);
  } else {
    if (radioCustom) radioCustom.checked = true;
    if (container) container.classList.remove('hidden');
    const selected = Array.isArray(user.allowedSites) ? user.allowedSites : [];
    renderUserSitesCheckboxes(selected);
  }

  document.getElementById('userFormContainer').classList.remove('hidden');
}

function submitUserForm() {
  const username = document.getElementById('inputUserUsername').value.trim();
  const fullName = document.getElementById('inputUserFullName').value.trim();
  const chatId = document.getElementById('inputUserChatId').value.trim();
  const role = document.getElementById('inputUserRole').value;

  if (!username || !fullName) {
    Swal.fire({ icon: 'warning', title: 'ข้อมูลไม่ครบ', text: 'กรุณากรอก Username และชื่อ-นามสกุล' });
    return;
  }

  const selectedRadio = document.querySelector('input[name="siteAccessType"]:checked');
  let allowedSites = 'ALL';

  if (selectedRadio && selectedRadio.value === 'CUSTOM') {
    const checkedBoxes = document.querySelectorAll('input[name="userSiteCheckbox"]:checked');
    if (checkedBoxes.length === 0) {
      Swal.fire({
        icon: 'warning',
        title: 'ยังไม่ได้เลือกไซต์งาน',
        text: 'กรุณาเลือกไซต์งานที่อนุญาตอย่างน้อย 1 ไซต์งาน หรือเลือก "เข้าถึงได้ทุกไซต์งาน"'
      });
      return;
    }
    allowedSites = Array.from(checkedBoxes).map(cb => cb.value);
  }

  showLoading(true);
  google.script.run
    .withSuccessHandler((res) => {
      showLoading(false);
      if (res.success) {
        Swal.fire({ toast: true, position: 'top-end', icon: 'success', title: res.message, showConfirmButton: false, timer: 2000 });
        cancelUserForm();
        loadUsersList();
        if (state.currentUser && state.currentUser.username.toLowerCase() === username.toLowerCase()) {
          loadInitialData();
        }
      } else {
        Swal.fire({ icon: 'error', title: 'บันทึกไม่สำเร็จ', text: res.message });
      }
    })
    .withFailureHandler((err) => {
      showLoading(false);
      Swal.fire({ icon: 'error', title: 'ผิดพลาด', text: err.message });
    })
    .saveUser({ username, fullName, telegramChatId: chatId, role, allowedSites, status: 'Active' });
}

function confirmDeleteUser(username) {
  Swal.fire({
    title: 'ยืนยันการลบผู้ใช้?',
    text: `ต้องการลบผู้ใช้ @${username} หรือไม่?`,
    icon: 'warning',
    showCancelButton: true,
    confirmButtonColor: '#e11d48',
    cancelButtonColor: '#64748b',
    confirmButtonText: 'ใช่, ลบผู้ใช้',
    cancelButtonText: 'ยกเลิก'
  }).then((res) => {
    if (res.isConfirmed) {
      showLoading(true);
      google.script.run
        .withSuccessHandler((result) => {
          showLoading(false);
          if (result.success) {
            Swal.fire({ toast: true, position: 'top-end', icon: 'success', title: result.message, showConfirmButton: false, timer: 2000 });
            loadUsersList();
          } else {
            Swal.fire({ icon: 'error', title: 'ลบไม่สำเร็จ', text: result.message });
          }
        })
        .withFailureHandler((err) => {
          showLoading(false);
          Swal.fire({ icon: 'error', title: 'ผิดพลาด', text: err.message });
        })
        .deleteUser(username);
    }
  });
}

function loadSitesTab() {
  state.tempSites = Array.isArray(state.sites) ? [...state.sites] : [];
  state.tempSiteChatIds = { ...(state.settings.siteTelegramChatIds || {}) };
  renderSitesListTable();
}

  if (countBadge) {
    countBadge.innerText = state.tempSites.length;
  }

  if (state.tempSites.length === 0) {

        <p class="text-[11px] text-[#6E6862]/80 mt-0.5">พิมพ์ชื่อด้านบนเพื่อเพิ่มไซต์งานใหม่</p>

  }

    if (t.site) {
      taskCounts[t.site] = (taskCounts[t.site] || 0) + 1;

  });

  container.innerHTML = state.tempSites.map((siteName, index) => {
    const count = taskCounts[siteName] || 0;
    const siteChatId = (state.tempSiteChatIds && state.tempSiteChatIds[siteName]) || '';
    return `
      <div class="flex items-center justify-between px-4 py-2.5 hover:bg-[#FAF8F2] transition-colors">
        <div class="flex items-center gap-2.5 min-w-0 pr-2">
          <span class="w-6 h-6 rounded-lg bg-[#EDE7DA] text-[#6E6862] text-[11px] font-bold flex items-center justify-center flex-shrink-0">
            ${index + 1}
          </span>
          <div class="min-w-0">
            <span class="text-xs font-semibold text-[#201E1C] truncate block" title="${escapeHtml(siteName)}">
              ${escapeHtml(siteName)}
            </span>
            <div class="mt-0.5">
              ${siteChatId ? `
                <button type="button" onclick="openSiteTelegramModalByIndex(${index})"
                        class="inline-flex items-center gap-1 px-2 py-0.5 rounded-full text-[10px] font-semibold bg-blue-50 text-[#2491FA] border border-blue-200/80 hover:bg-blue-100 transition-colors cursor-pointer"

                  <i class="fa-brands fa-telegram"></i> กลุ่ม: ${escapeHtml(siteChatId)}
                </button>
              ` : `
                <button type="button" onclick="openSiteTelegramModalByIndex(${index})"
                        class="inline-flex items-center gap-1 px-2 py-0.5 rounded-full text-[10px] font-medium bg-[#EDE7DA]/80 text-[#6E6862] hover:bg-[#E2DACB] transition-colors cursor-pointer"
                        title="คลิกเพื่อกำหนด Chat ID กลุ่มเฉพาะของไซต์นี้">
                  <i class="fa-brands fa-telegram text-slate-400"></i> ใช้กลุ่มหลัก (Default)
                </button>
              `}
            </div>
          </div>
        </div>
        <div class="flex items-center gap-1.5 flex-shrink-0">
          <span class="px-2 py-0.5 rounded-full text-[10px] font-semibold ${count > 0 ? 'bg-blue-100 text-blue-700' : 'bg-[#EDE7DA] text-[#6E6862]'}">
            ${count} งาน
          </span>
          <button type="button" onclick="openSiteTelegramModalByIndex(${index})" title="ตั้งค่า Telegram กลุ่มไซต์นี้"
                  class="p-1.5 text-[#6E6862] hover:text-[#2491FA] hover:bg-blue-50 rounded-lg transition-colors cursor-pointer">
            <i class="fa-brands fa-telegram text-sm"></i>
          </button>
          <button type="button" onclick="editSiteName(${index})" title="แก้ไขชื่อไซต์"
                  class="p-1.5 text-[#6E6862] hover:text-[#2491FA] hover:bg-[#EDE7DA] rounded-lg transition-colors cursor-pointer">
            <i class="fa-regular fa-pen-to-square text-xs"></i>
          </button>
          <button type="button" onclick="deleteSite(${index})" title="ลบไซต์งาน"
                  class="p-1.5 text-[#6E6862] hover:text-rose-600 hover:bg-rose-50 rounded-lg transition-colors cursor-pointer">

    title: `<div class="flex items-center gap-2 text-base text-[#201E1C] font-bold"><i class="fa-brands fa-telegram text-[#2491FA] text-xl"></i><span>ตั้งค่า Telegram กลุ่มไซต์งาน</span></div>`,
    html: `
      <div class="text-left space-y-3 pt-1">
        <div class="bg-[#FAF8F2] p-2.5 rounded-xl border border-[#EFE9DC]">
          <span class="text-[11px] text-[#6E6862] block">ไซต์งาน:</span>

            <i class="fa-solid fa-location-dot text-[#2491FA]"></i> ${escapeHtml(siteName)}
          </span>
        </div>

        <div>
          <label class="block text-xs font-medium text-[#201E1C] mb-1">Telegram Group Chat ID ประจำไซต์งาน</label>
          <input type="text" id="swalSiteChatId" value="${escapeHtml(currentChatId)}" placeholder="เช่น -1001234567890 (หรือเว้นว่างเพื่อใช้กลุ่มหลัก)"
                 class="w-full px-3 py-2 text-xs bg-white border border-[#EFE9DC] rounded-xl outline-none focus:ring-2 focus:ring-[#2491FA]/30 focus:border-[#2491FA] text-[#201E1C]">
          <p class="text-[11px] text-[#6E6862] mt-1">
            💡 นำบอทเข้ากลุ่ม และใช้ Chat ID ของกลุ่มนั้น (กลุ่ม Telegram มักขึ้นต้นด้วย <code>-100...</code>)<br>
            * หากเว้นว่างไว้ ระบบจะส่งแจ้งเตือนเข้า <b>กลุ่มหลัก (Default)</b>
          </p>
        </div>

        <div class="pt-1">
          <button type="button" id="swalBtnTestSiteTelegram"
                  class="w-full py-1.5 text-xs font-bold text-[#2491FA] bg-blue-50 hover:bg-blue-100 border border-blue-200 rounded-xl transition-colors flex items-center justify-center gap-1.5 cursor-pointer">
            <i class="fa-brands fa-telegram"></i>
            <span>ทดสอบส่งข้อความเข้ากลุ่มไซต์นี้</span>
          </button>
        </div>
      </div>
    `,
    showCancelButton: true,
    confirmButtonColor: '#2491FA',
    cancelButtonColor: '#6E6862',
    confirmButtonText: '<i class="fa-solid fa-check mr-1"></i> ตกลง',
    cancelButtonText: 'ยกเลิก',
    didOpen: () => {
      const testBtn = document.getElementById('swalBtnTestSiteTelegram');
      if (testBtn) {
        testBtn.addEventListener('click', () => {
          const inputEl = document.getElementById('swalSiteChatId');
          const testChatId = inputEl ? inputEl.value.trim() : '';
          if (!testChatId) {
            Swal.showValidationMessage('กรุณากรอก Chat ID ก่อนกดทดสอบส่ง');
            return;
          }
          testBtn.disabled = true;
          testBtn.innerHTML = '<i class="fa-solid fa-circle-notch fa-spin mr-1"></i> กำลังส่ง...';

          google.script.run
            .withSuccessHandler((res) => {
              testBtn.disabled = false;
              testBtn.innerHTML = '<i class="fa-brands fa-telegram mr-1"></i> ทดสอบส่งข้อความเข้ากลุ่มไซต์นี้';
              if (res.success) {
                Swal.showValidationMessage('');
                Swal.fire({
                  toast: true,
                  position: 'top-end',
                  icon: 'success',
                  title: res.message || 'ส่งข้อความทดสอบสำเร็จ!',
                  showConfirmButton: false,
                  timer: 3000
                });
              } else {
                Swal.showValidationMessage('ส่งไม่สำเร็จ: ' + res.message);
              }
            })
            .withFailureHandler((err) => {
              testBtn.disabled = false;
              testBtn.innerHTML = '<i class="fa-brands fa-telegram mr-1"></i> ทดสอบส่งข้อความเข้ากลุ่มไซต์นี้';

        delete state.tempSiteChatIds[siteName];

        position: 'top-end',

function addNewSiteFromSettings() {
  const input = document.getElementById('inputNewSiteName');
  if (!input) return;
  const val = input.value.trim();

  if (!val) {
    Swal.fire({ icon: 'warning', title: 'กรุณากรอกชื่อไซต์งาน', text: 'พิมพ์ชื่อไซต์งานที่ต้องการเพิ่ม' });
    return;
  }

  if (state.tempSites.some(s => s.toLowerCase() === val.toLowerCase())) {
    Swal.fire({ icon: 'info', title: 'ไซต์งานนี้มีอยู่แล้ว', text: `มีไซต์ "${val}" ในรายการแล้ว` });
    return;
  }

  state.tempSites.push(val);
  input.value = '';
  renderSitesListTable();
  input.focus();
}

function editSiteName(index) {
  const currentName = state.tempSites[index];
  if (!currentName) return;

  Swal.fire({
    title: 'แก้ไขชื่อไซต์งาน',
    input: 'text',
    inputValue: currentName,
    inputPlaceholder: 'กรอกชื่อไซต์งานใหม่...',
    showCancelButton: true,
    confirmButtonColor: '#2491FA',
    cancelButtonColor: '#6E6862',
    confirmButtonText: 'บันทึกการแก้ไข',
    cancelButtonText: 'ยกเลิก',
    inputValidator: (val) => {
      if (!val || !val.trim()) {
        return 'กรุณากรอกชื่อไซต์งาน';
      }
      const trimmed = val.trim();
      const duplicate = state.tempSites.some((s, idx) => idx !== index && s.toLowerCase() === trimmed.toLowerCase());
      if (duplicate) {
        return 'มีชื่อไซต์งานนี้ในรายการแล้ว';
      }
      return null;
    }
  }).then((res) => {
    if (res.isConfirmed && res.value) {
      const oldName = currentName;
      const newName = res.value.trim();
      state.tempSites[index] = newName;
      if (state.tempSiteChatIds && state.tempSiteChatIds[oldName] !== undefined) {
        state.tempSiteChatIds[newName] = state.tempSiteChatIds[oldName];
        if (newName !== oldName) {
          delete state.tempSiteChatIds[oldName];
        }
      }
      renderSitesListTable();
      Swal.fire({
        toast: true,
        position: 'top-end',
        icon: 'success',
        title: 'แก้ไขชื่อไซต์เรียบร้อย (อย่าลืมกดบันทึก)',
        showConfirmButton: false,
        timer: 2000
      });
    }
  });
}

function deleteSite(index) {
  const siteName = state.tempSites[index];
  if (!siteName) return;

  const usedCount = (state.tasks || []).filter(t => t.site === siteName).length;
  let warnHtml = `ต้องการลบไซต์งาน <b>${escapeHtml(siteName)}</b> หรือไม่?`;
  if (usedCount > 0) {
    warnHtml += `<br><span class="text-xs text-amber-600 font-normal">⚠️ มีงานที่ผูกกับไซต์นี้อยู่ <b>${usedCount}</b> งาน<br>(งานในระบบจะไม่ถูกลบ แต่ไซต์นี้จะถูกนำออกจากตัวเลือก)</span>`;
  }

  Swal.fire({
    title: 'ยืนยันการลบไซต์งาน?',
    html: warnHtml,
    icon: 'warning',
    showCancelButton: true,
    confirmButtonColor: '#e11d48',
    cancelButtonColor: '#6E6862',
    confirmButtonText: 'ใช่, ลบไซต์นี้',
    cancelButtonText: 'ยกเลิก'
  }).then((res) => {
    if (res.isConfirmed) {
      const delName = state.tempSites[index];
      state.tempSites.splice(index, 1);
      if (state.tempSiteChatIds && delName) {
        delete state.tempSiteChatIds[delName];
      }
      renderSitesListTable();
      Swal.fire({
        toast: true,
        position: 'top-end',
        icon: 'success',
        title: 'นำไซต์งานออกจากรายการแล้ว (อย่าลืมกดบันทึก)',
        showConfirmButton: false,
        timer: 2000
      });
    }
  });
}

function toggleBulkSitesMode() {
  const wrapper = document.getElementById('bulkSitesWrapper');
  const toggleText = document.getElementById('bulkSitesToggleText');
  const textarea = document.getElementById('bulkSitesTextarea');
  if (!wrapper || !toggleText) return;

  const isHidden = wrapper.classList.contains('hidden');
  if (isHidden) {
    wrapper.classList.remove('hidden');
    toggleText.innerText = 'ปิดโหมดพิมพ์หลายบรรทัด';
    if (textarea) {
      textarea.value = state.tempSites.join('\n');
      textarea.focus();
    }
  } else {
    wrapper.classList.add('hidden');
    toggleText.innerText = 'โหมดพิมพ์หลายบรรทัด';
  }
}

function applyBulkSites() {
  const textarea = document.getElementById('bulkSitesTextarea');
  if (!textarea) return;

  const lines = textarea.value.split('\n')
    .map(line => line.trim())
    .filter(Boolean);

  const uniqueSites = [];
  const lowerSet = new Set();
  lines.forEach(item => {
    const low = item.toLowerCase();
    if (!lowerSet.has(low)) {
      lowerSet.add(low);
      uniqueSites.push(item);
    }
  });

  state.tempSites = uniqueSites;
  renderSitesListTable();
  toggleBulkSitesMode();

  Swal.fire({
    toast: true,
    position: 'top-end',
    icon: 'success',
    title: `นำเข้า ${uniqueSites.length} ไซต์งานเรียบร้อย (อย่าลืมกดบันทึก)`,
    showConfirmButton: false,
    timer: 2500
  });
}

function saveSitesChanges() {
  const btn = document.getElementById('btnSaveSites');
  if (btn) {
    btn.disabled = true;
    btn.innerHTML = '<i class="fa-solid fa-circle-notch fa-spin mr-1"></i> กำลังบันทึก...';
  }

  showLoading(true);
  google.script.run
    .withSuccessHandler((res) => {
      showLoading(false);
      if (btn) {
        btn.disabled = false;
        btn.innerHTML = '<i class="fa-solid fa-check mr-1"></i> บันทึกรายชื่อไซต์งาน';
      }

      if (res.success) {
        state.sites = res.sites || state.tempSites;
        if (res.siteTelegramChatIds) {
          state.settings.siteTelegramChatIds = res.siteTelegramChatIds;
          state.tempSiteChatIds = { ...res.siteTelegramChatIds };
        }
        renderSiteFilterOptions();
        renderSiteFormOptions();
        Swal.fire({
          icon: 'success',
          title: 'บันทึกสำเร็จ',
          text: `บันทึกรายชื่อไซต์งานทั้งหมด ${state.sites.length} รายการ และการตั้งค่า Telegram กลุ่มเรียบร้อยแล้ว`
        });
      } else {
        Swal.fire({ icon: 'error', title: 'บันทึกไม่สำเร็จ', text: res.message });
      }
    })
    .withFailureHandler((err) => {
      showLoading(false);
      if (btn) {
        btn.disabled = false;
        btn.innerHTML = '<i class="fa-solid fa-check mr-1"></i> บันทึกรายชื่อไซต์งาน';
      }
      Swal.fire({ icon: 'error', title: 'ข้อผิดพลาด', text: err.message });
    })
    .saveSitesList(state.tempSites, state.tempSiteChatIds || {});
}

/**
 * =========================================================================
 * ARCHIVE SYSTEM CONTROLLER (ระบบคลังจัดเก็บงานถาวร)
 * =========================================================================
 */

function openArchiveModal() {
  const modal = document.getElementById('archiveModal');
  if (!modal) return;
  modal.classList.remove('hidden');

  // อัปเดตตัวเลือกไซต์งานใน Archive Modal
  const siteSelect = document.getElementById('archiveSiteFilter');
  if (siteSelect) {
    let html = '<option value="ALL">🏢 ทุกไซต์งานทั้งหมด</option>';
    const allSites = state.allSites || state.sites || [];
    allSites.forEach(s => {
      html += `<option value="${escapeHtml(s)}">${escapeHtml(s)}</option>`;
    });
    siteSelect.innerHTML = html;
  }

  loadArchivedTasks();
}

function closeArchiveModal() {
  const modal = document.getElementById('archiveModal');
  if (modal) modal.classList.add('hidden');
}

function loadArchivedTasks() {
  const tbody = document.getElementById('archiveTableBody');
  const countBadge = document.getElementById('archiveTasksCount');
  if (tbody) {
    tbody.innerHTML = `
      <tr>
        <td colspan="7" class="py-10 text-center text-[#6E6862]">
          <div class="inline-block w-6 h-6 border-2 border-[#2491FA] border-t-transparent rounded-full animate-spin mb-2"></div>
          <div>กำลังค้นหาและโหลดข้อมูลในคลัง...</div>
        </td>
      </tr>
    `;
  }

  const query = (document.getElementById('archiveSearchInput')?.value || '').trim();
  const site = document.getElementById('archiveSiteFilter')?.value || 'ALL';

  google.script.run
    .withSuccessHandler((res) => {
      if (!res || !res.success) {
        if (tbody) {
          tbody.innerHTML = `
            <tr>
              <td colspan="7" class="py-8 text-center text-rose-600">
                <i class="fa-solid fa-triangle-exclamation mr-1"></i> ${res ? res.message : 'เกิดข้อผิดพลาดในการโหลดคลังงาน'}
              </td>
            </tr>
          `;
        }
        return;
      }

      state.archivedTasks = res.tasks || [];
      if (countBadge) countBadge.innerText = res.totalCount || state.archivedTasks.length;
      renderArchivedTasks(state.archivedTasks);
    })
    .withFailureHandler((err) => {
      if (tbody) {
        tbody.innerHTML = `
          <tr>
            <td colspan="7" class="py-8 text-center text-rose-600">
              <i class="fa-solid fa-triangle-exclamation mr-1"></i> ${err.message}
            </td>
          </tr>
        `;
      }
    })
    .getArchivedTasks({ query, site, limit: 300 });
}

function renderArchivedTasks(tasks) {
  const tbody = document.getElementById('archiveTableBody');
  if (!tbody) return;

  if (!tasks || tasks.length === 0) {
    tbody.innerHTML = `
      <tr>
        <td colspan="7" class="py-12 text-center text-[#6E6862]">
          <i class="fa-solid fa-box-open text-3xl opacity-40 mb-2"></i>
          <p class="font-medium">ไม่พบรายการงานในคลังที่ตรงกับเงื่อนไข</p>
        </td>
      </tr>
    `;
    return;
  }

  tbody.innerHTML = tasks.map(task => {
    const siteStyle = getSiteColorStyle(task.site);
    const hasAttachments = task.attachments && task.attachments.length > 0;

    return `
      <tr class="hover:bg-[#FAF8F2] transition-colors border-b border-[#EFE9DC]/60">
        <td class="px-3.5 py-3 font-mono text-xs font-semibold text-[#6E6862] whitespace-nowrap">${escapeHtml(task.id)}</td>
        <td class="px-3.5 py-3 whitespace-nowrap">
          <span class="badge-site ${siteStyle.bg} ${siteStyle.text} border ${siteStyle.border}">
            <i class="fa-solid fa-location-dot text-[9px]"></i>
            ${escapeHtml(task.site)}
          </span>
        </td>
        <td class="px-3.5 py-3 max-w-xs">
          <div class="flex items-center gap-1.5 font-bold text-[#201E1C]">
            <span>${escapeHtml(task.title)}</span>
            ${hasAttachments ? `
              <span class="inline-flex items-center gap-1 text-[10px] font-bold text-[#2491FA] bg-blue-50 px-1.5 py-0.2 rounded border border-blue-200/60" title="มีไฟล์แนบ ${task.attachments.length} ไฟล์">
                <i class="fa-solid fa-paperclip text-[9px]"></i>
                <span>${task.attachments.length}</span>
              </span>
            ` : ''}
          </div>
          ${task.description ? `<div class="text-[11px] text-[#6E6862] truncate mt-0.5">${escapeHtml(task.description)}</div>` : ''}
        </td>
        <td class="px-3.5 py-3 text-xs text-[#201E1C] whitespace-nowrap">
          <div class="flex items-center gap-1">
            <i class="fa-regular fa-user text-[#6E6862] text-[10px]"></i>
            <span>${escapeHtml(task.assignee)}</span>
          </div>
          ${task.reporter ? `<div class="text-[10px] text-[#6E6862] mt-0.5 flex items-center gap-1"><i class="fa-solid fa-bullhorn text-[9px] text-[#2491FA]"></i> แจ้งโดย: ${escapeHtml(task.reporter)}</div>` : ''}
          ${task.reportDate ? `<div class="text-[10px] text-[#6E6862] mt-0.5 flex items-center gap-1"><i class="fa-regular fa-calendar-plus text-[9px] text-[#2491FA]"></i> วันที่แจ้ง: ${formatDateDisplay(task.reportDate)}</div>` : ''}
        </td>
        <td class="px-3.5 py-3 text-xs text-[#6E6862] whitespace-nowrap">
          ${formatDateDisplay(task.dueDate)}
        </td>
        <td class="px-3.5 py-3 text-xs text-[#6E6862] whitespace-nowrap font-mono text-[11px]">
          ${escapeHtml(task.archivedAt || '-')}
        </td>
        <td class="px-3.5 py-3 text-right whitespace-nowrap">
          <div class="flex items-center justify-end gap-1.5">
            <button onclick="openViewArchivedTaskModal('${task.id}')"
                    title="ดูรายละเอียดและไฟล์แนบ"
                    class="px-2 py-1 text-xs font-medium text-[#2491FA] hover:bg-blue-50 rounded-lg transition-colors flex items-center gap-1 cursor-pointer">
              <i class="fa-regular fa-eye"></i>
              <span>ดู</span>
            </button>
            <button onclick="handleRestoreArchivedTask('${task.id}', '${escapeJs(task.title)}')"
                    title="กู้คืนงานกลับสู่ระบบหลัก"
                    class="px-2 py-1 text-xs font-semibold text-emerald-700 hover:bg-emerald-50 rounded-lg transition-colors flex items-center gap-1 cursor-pointer">
              <i class="fa-solid fa-rotate-left"></i>
              <span>กู้คืน</span>
            </button>
          </div>
        </td>
      </tr>
    `;
  }).join('');
}

function openViewArchivedTaskModal(taskId) {
  const task = state.archivedTasks.find(t => t.id === taskId);
  if (!task) return;

  const modal = document.getElementById('viewArchivedTaskModal');
  if (!modal) return;

  document.getElementById('viewArchivedTaskId').innerText = task.id;
  document.getElementById('viewArchivedTaskTitle').innerText = task.title;
  document.getElementById('viewArchivedTaskDesc').innerText = task.description || '(ไม่มีรายละเอียดเพิ่มเติม)';
  document.getElementById('viewArchivedTaskSite').innerText = task.site;
  document.getElementById('viewArchivedTaskAssignee').innerHTML = `<i class="fa-regular fa-user mr-1"></i> ${escapeHtml(task.assignee)}`;

  const reporterBadge = document.getElementById('viewArchivedTaskReporter');
  if (reporterBadge) {
    if (task.reporter) {
      reporterBadge.innerHTML = `<i class="fa-solid fa-bullhorn mr-1 text-[#2491FA]"></i> ผู้แจ้ง: ${escapeHtml(task.reporter)}`;
      reporterBadge.classList.remove('hidden');
    } else {
      reporterBadge.classList.add('hidden');
    }
  }

  const prioBadge = document.getElementById('viewArchivedTaskPriority');
  prioBadge.className = `text-xs font-semibold px-2 py-0.5 rounded-full ${getPriorityBadgeStyle(task.priority)}`;
  prioBadge.innerText = task.priority;

  const reportDateEl = document.getElementById('viewArchivedTaskReportDate');
  if (reportDateEl) {
    reportDateEl.innerText = formatDateDisplay(task.reportDate) || '-';
  }
  document.getElementById('viewArchivedTaskDueDate').innerText = formatDateDisplay(task.dueDate);
  document.getElementById('viewArchivedTaskCreatedAt').innerText = task.createdAt || '-';
  document.getElementById('viewArchivedTaskArchivedAt').innerText = task.archivedAt || '-';

  // Render checklist
  const clSection = document.getElementById('viewArchivedChecklistSection');
  const clBadge = document.getElementById('viewArchivedChecklistBadge');
  const clList = document.getElementById('viewArchivedChecklistList');
  const checklist = Array.isArray(task.checklist) ? task.checklist : [];
  if (clSection && clBadge && clList) {
    if (checklist.length === 0) {
      clSection.classList.add('hidden');
    } else {
      clSection.classList.remove('hidden');
      const stats = getChecklistStats(checklist);
      clBadge.innerText = stats.text;
      clBadge.className = `text-[11px] font-bold px-2 py-0.5 rounded-full border ${stats.isAllDone ? 'text-emerald-700 bg-emerald-50 border-emerald-200' : 'text-[#6E6862] bg-white border-[#EFE9DC]'}`;
      clList.innerHTML = checklist.map(item => `
        <div class="flex items-center gap-2 p-1.5 rounded-lg ${item.done ? 'bg-emerald-50/50' : 'bg-transparent'}">
          <i class="${item.done ? 'fa-solid fa-circle-check text-emerald-600' : 'fa-regular fa-circle text-[#9E9890]'} text-xs"></i>
          <span class="text-xs ${item.done ? 'line-through text-[#6E6862]' : 'text-[#201E1C]'}">${escapeHtml(item.text)}</span>
        </div>
      `).join('');
    }
  }

  // Render attachments
  const attachList = document.getElementById('viewArchivedAttachmentsList');
  const attachCount = document.getElementById('viewArchivedAttachmentsCount');
  const attachments = task.attachments || [];
  attachCount.innerText = attachments.length;

  if (attachments.length === 0) {
    attachList.innerHTML = `<div class="text-xs text-[#6E6862] italic py-1">ไม่มีไฟล์แนบในงานนี้</div>`;
  } else {
    attachList.innerHTML = attachments.map(att => `
      <div class="flex items-center justify-between p-2 rounded-xl bg-white border border-[#EFE9DC]">
        <div class="flex items-center gap-2 min-w-0 pr-2">
          <i class="fa-solid fa-file-lines text-[#2491FA]"></i>
          <span class="text-xs font-medium text-[#201E1C] truncate">${escapeHtml(att.name || 'ไฟล์แนบ')}</span>
          ${att.size ? `<span class="text-[10px] text-[#6E6862]">(${formatFileSize(att.size)})</span>` : ''}
        </div>
        ${att.url ? `
          <a href="${att.url}" target="_blank"
             class="px-2.5 py-1 text-xs font-bold text-white bg-[#2491FA] hover:bg-[#1A7CE0] rounded-lg transition-colors flex items-center gap-1 shadow-2xs whitespace-nowrap">
            <i class="fa-solid fa-arrow-up-right-from-square text-[10px]"></i>
            <span>เปิดไฟล์</span>
          </a>
        ` : ''}
      </div>
    `).join('');
  }

  // Restore button in modal
  const btnRestore = document.getElementById('btnRestoreFromViewModal');
  if (btnRestore) {
    btnRestore.onclick = () => {
      handleRestoreArchivedTask(task.id, task.title);
    };
  }

  modal.classList.remove('hidden');
}

function closeViewArchivedTaskModal() {
  const modal = document.getElementById('viewArchivedTaskModal');
  if (modal) modal.classList.add('hidden');
}

function handleArchiveCompletedPrompt() {
  const doneTasks = state.tasks.filter(t => t.status === 'เสร็จสิ้น');
  if (doneTasks.length === 0) {
    Swal.fire({
      icon: 'info',
      title: 'ไม่พบงานที่เสร็จสิ้น',
      text: 'ไม่มีงานสถานะ "เสร็จสิ้น" บนกระดานที่ต้องจัดเก็บในขณะนี้',
      confirmButtonColor: '#2491FA'
    });
    return;
  }

  Swal.fire({
    title: '📦 จัดเก็บงานเสร็จสิ้นเข้าคลัง',
    html: `
      <p class="text-sm text-[#6E6862] mb-3">พบงานที่เสร็จสิ้นบนกระดานทั้งหมด <b>${doneTasks.length}</b> รายการ กรุณาเลือกเงื่อนไขในการจัดเก็บเข้าคลังถาวร:</p>
      <div class="text-left space-y-2 text-xs bg-[#FAF8F2] p-3 rounded-xl border border-[#EFE9DC]">
        <label class="flex items-center gap-2 p-1.5 rounded-lg hover:bg-white cursor-pointer">
          <input type="radio" name="archiveOption" value="ALL" checked class="text-[#2491FA] focus:ring-0">
          <div>
            <div class="font-bold text-[#201E1C]">จัดเก็บงานเสร็จสิ้นทั้งหมด (${doneTasks.length} รายการ)</div>
            <div class="text-[#6E6862] text-[11px]">ย้ายงานเสร็จสิ้นทั้งหมดเข้าคลังถาวรทันที</div>
          </div>
        </label>
        <label class="flex items-center gap-2 p-1.5 rounded-lg hover:bg-white cursor-pointer">
          <input type="radio" name="archiveOption" value="7" class="text-[#2491FA] focus:ring-0">
          <div>
            <div class="font-bold text-[#201E1C]">เฉพาะงานที่เสร็จสิ้นเกิน 7 วัน</div>
            <div class="text-[#6E6862] text-[11px]">คงเหลืองานที่เพิ่งเสร็จใน 7 วันล่าสุดไว้บนกระดาน</div>
          </div>
        </label>
        <label class="flex items-center gap-2 p-1.5 rounded-lg hover:bg-white cursor-pointer">
          <input type="radio" name="archiveOption" value="30" class="text-[#2491FA] focus:ring-0">
          <div>
            <div class="font-bold text-[#201E1C]">เฉพาะงานที่เสร็จสิ้นเกิน 30 วัน</div>
            <div class="text-[#6E6862] text-[11px]">จัดเก็บเฉพาะงานเก่าที่จบไปแล้วเกิน 1 เดือน</div>
          </div>
        </label>
      </div>
      <p class="text-[11px] text-emerald-700 mt-2"><i class="fa-solid fa-circle-info mr-1"></i> ข้อมูลและไฟล์แนบจะไม่สูญหาย และสามารถค้นหาหรือกู้คืนได้ตลอดเวลา</p>
    `,
    icon: 'question',
    showCancelButton: true,
    confirmButtonText: 'ยืนยันการจัดเก็บ',
    cancelButtonText: 'ยกเลิก',
    confirmButtonColor: '#d97706',
    cancelButtonColor: '#6E6862'
  }).then((result) => {
    if (result.isConfirmed) {
      const selected = document.querySelector('input[name="archiveOption"]:checked');
      const val = selected ? selected.value : 'ALL';

      showLoading(true);
      google.script.run
        .withSuccessHandler((res) => {
          showLoading(false);
          if (!res || !res.success) {
            Swal.fire({
              icon: 'error',
              title: 'จัดเก็บไม่สำเร็จ',
              text: res ? res.message : 'เกิดข้อผิดพลาดในการติดต่อเซิร์ฟเวอร์'
            });
            return;
          }

          Swal.fire({
            icon: 'success',
            title: 'จัดเก็บเข้าคลังสำเร็จ!',
            text: `ได้ย้ายงานที่เสร็จสิ้นจำนวน ${res.archivedCount} รายการเข้าสู่คลังถาวรเรียบร้อยแล้ว`,
            confirmButtonColor: '#2491FA'
          });

          loadInitialData();
        })
        .withFailureHandler((err) => {
          showLoading(false);
          Swal.fire({ icon: 'error', title: 'ข้อผิดพลาด', text: err.message });
        })
        .archiveCompletedTasks(val);
    }
  });
}

function handleArchiveSingleTask(taskId, taskTitle) {
  Swal.fire({
    title: '📦 จัดเก็บงานนี้เข้าคลัง?',
    text: `ต้องการย้ายงาน "${taskTitle || taskId}" เข้าสู่คลังงานถาวรหรือไม่?`,
    icon: 'question',
    showCancelButton: true,
    confirmButtonText: 'จัดเก็บเข้าคลัง',
    cancelButtonText: 'ยกเลิก',
    confirmButtonColor: '#d97706',
    cancelButtonColor: '#6E6862'
  }).then((result) => {
    if (result.isConfirmed) {
      showLoading(true);
      google.script.run
        .withSuccessHandler((res) => {
          showLoading(false);
          if (!res || !res.success) {
            Swal.fire({ icon: 'error', title: 'จัดเก็บไม่สำเร็จ', text: res.message });
            return;
          }

          Swal.fire({
            toast: true,
            position: 'top-end',
            icon: 'success',
            title: `จัดเก็บงาน ${taskId} เข้าคลังแล้ว`,
            showConfirmButton: false,
            timer: 2000
          });

          loadInitialData();
        })
        .withFailureHandler((err) => {
          showLoading(false);
          Swal.fire({ icon: 'error', title: 'ข้อผิดพลาด', text: err.message });
        })
        .archiveSingleTask(taskId);
    }
  });
}

function handleRestoreArchivedTask(taskId, taskTitle) {
  Swal.fire({
    title: '↩️ กู้คืนงานกลับสู่ระบบหลัก?',
    text: `ต้องการกู้คืนงาน "${taskTitle || taskId}" กลับมายังกระดานหลักหรือไม่?`,
    icon: 'question',
    showCancelButton: true,
    confirmButtonText: 'กู้คืนงาน',
    cancelButtonText: 'ยกเลิก',
    confirmButtonColor: '#2491FA',
    cancelButtonColor: '#6E6862'
  }).then((result) => {
    if (result.isConfirmed) {
      showLoading(true);
      google.script.run
        .withSuccessHandler((res) => {
          showLoading(false);
          if (!res || !res.success) {
            Swal.fire({ icon: 'error', title: 'กู้คืนไม่สำเร็จ', text: res.message });
            return;
          }

          closeViewArchivedTaskModal();

          Swal.fire({
            toast: true,
            position: 'top-end',
            icon: 'success',
            title: `กู้คืนงาน ${taskId} สำเร็จแล้ว`,
            showConfirmButton: false,
            timer: 2500
          });

          loadInitialData();
          loadArchivedTasks();
        })
        .withFailureHandler((err) => {
          showLoading(false);
          Swal.fire({ icon: 'error', title: 'ข้อผิดพลาด', text: err.message });
        })
        .restoreArchivedTask(taskId);
    }
  });
}
