<script>
/**
 * =========================================================================
 * WORK TRACKER (โปรแกรมติดตามงาน)
 * Client-side Controller & State Management (JavaScript.html)
 * =========================================================================
 */

// Application State
const state = {
  tasks: [],
  sites: [],
  users: [],
  statuses: ['รอดำเนินการ', 'กำลังดำเนินการ', 'รอตรวจสอบ', 'เสร็จสิ้น'],
  priorities: ['ด่วนมาก', 'สูง', 'ปานกลาง', 'ทั่วไป'],
  settings: {},
  stats: { total: 0, todo: 0, inProgress: 0, review: 0, done: 0, overdue: 0 },
  onlineUsers: [],
  onlineCount: 0,
  heartbeatInterval: null,
  realtimeSyncInterval: null,
  isSyncing: false,
  tasksVersion: '0',
  highlightTaskId: null,
  lastOwnActionTime: 0,
  lastOwnTaskId: null,
  taskFileQueue: [],
  currentEditingAttachments: [],
  currentEditingChecklist: [],
  sheetUrl: '',
  webAppUrl: '',
  filters: {
    site: 'ALL',
    assignee: 'ALL',
    status: 'ALL',
    priority: 'ALL',
    search: '',
    dueDateFrom: '',
    dueDateTo: '',
    includeNoDueDate: false,
    dueDateInitialized: false
  },
  currentView: 'kanban', // 'kanban' | 'table'
  draggedTaskId: null,
  currentUser: null,
  loginUsername: '',
  countdownInterval: null,
  archivedTasks: []
};

// Site Color Palettes for visual differentiation
const SITE_COLORS = [
  { bg: 'bg-sky-100', text: 'text-sky-800', border: 'border-sky-300' },
  { bg: 'bg-emerald-100', text: 'text-emerald-800', border: 'border-emerald-300' },
  { bg: 'bg-amber-100', text: 'text-amber-800', border: 'border-amber-300' },
  { bg: 'bg-purple-100', text: 'text-purple-800', border: 'border-purple-300' },
  { bg: 'bg-rose-100', text: 'text-rose-800', border: 'border-rose-300' },
  { bg: 'bg-indigo-100', text: 'text-indigo-800', border: 'border-indigo-300' },
  { bg: 'bg-teal-100', text: 'text-teal-800', border: 'border-teal-300' }
];

// Document Ready
document.addEventListener('DOMContentLoaded', () => {
  setupEventListeners();
  setupPinInputHandlers();
  checkAuthSession();
});

/**
 * ดึงข้อมูลเริ่มต้นจาก Google Apps Script Backend
 */
function loadInitialData() {
  showLoading(true);
  const username = state.currentUser ? state.currentUser.username : '';
  google.script.run
    .withSuccessHandler(onDataLoaded)
    .withFailureHandler(onServerError)
    .getInitialData(username);
}

/**
 * จัดการเมื่อโหลดข้อมูลสำเร็จ
 */
function onDataLoaded(response) {
  showLoading(false);
  if (!response || !response.success) {
    Swal.fire({
      icon: 'error',
      title: 'โหลดข้อมูลไม่สำเร็จ',
      text: response ? response.error : 'ไม่ได้รับข้อมูลจากเซิร์ฟเวอร์'
    });
    return;
  }

  state.tasks = response.tasks || [];
  state.sites = response.sites || [];
  state.allSites = response.allSites || response.sites || [];
  state.users = response.users || [];
  state.statuses = response.statuses || state.statuses;
  state.priorities = response.priorities || state.priorities;
  state.settings = response.settings || {};
  state.tempSiteChatIds = { ...(state.settings.siteTelegramChatIds || {}) };
  state.stats = response.stats || state.stats;
  state.sheetUrl = response.sheetUrl || '';
  state.webAppUrl = response.webAppUrl || '';

  // อัปเดตสถานะผู้ใช้งานที่กำลังออนไลน์
  if (response.onlineUsers !== undefined) {
    updateOnlineUsersDisplay(response.onlineCount, response.onlineUsers);
  }

  // อัปเดตข้อมูลผู้ใช้ปัจจุบันหากเซิร์ฟเวอร์ส่งกลับมา
  if (response.currentUserProfile && state.currentUser) {
    state.currentUser = { ...state.currentUser, ...response.currentUserProfile };
    sessionStorage.setItem('work_tracker_session', JSON.stringify(state.currentUser));
    updateNavbarUser();
  }

  // อัปเดตลิงก์ไปยัง Google Sheet
  const sheetLinkBtn = document.getElementById('sheetLinkBtn');
  if (sheetLinkBtn && state.sheetUrl) {
    sheetLinkBtn.href = state.sheetUrl;
    sheetLinkBtn.classList.remove('hidden');
  }

  // อัปเดตตัวเลือก Dropdown ไซต์งาน และ ผู้รับผิดชอบ
  renderSiteFilterOptions();
  renderAssigneeFilterOptions();
  renderSiteFormOptions();
  renderAssigneeFormOptions();
  renderUserReportersList();

  // กำหนดค่าเริ่มต้นช่วงวันครบกำหนดส่ง (ดีฟอลต์เป็นทั้งหมดทุกช่วงเวลา)
  initDueDateFilter(false);

  // บันทึกเวอร์ชันข้อมูลและเริ่มการตรวจสอบ Real-time อัตโนมัติ (Zero-Quota Background Sync)
  if (response.version) {
    state.tasksVersion = String(response.version);
  }
  startRealtimeSync();

  // เรนเดอร์การแสดงผล
  renderDashboard();
}

function onServerError(error) {
  showLoading(false);
  Swal.fire({
    icon: 'error',
    title: 'การเชื่อมต่อผิดพลาด',
    text: error.message || 'เกิดข้อผิดพลาดในการติดต่อ Google Apps Script'
  });
}

/**
 * ผูก Event Listeners ในหน้าจอ
 */
function setupEventListeners() {
  // ฟิลเตอร์ไซต์งาน
  document.getElementById('siteFilter').addEventListener('change', (e) => {
    state.filters.site = e.target.value;
    renderDashboard();
  });

  // ฟิลเตอร์ผู้รับผิดชอบ
  const assigneeFilterEl = document.getElementById('assigneeFilter');
  if (assigneeFilterEl) {
    assigneeFilterEl.addEventListener('change', (e) => {
      state.filters.assignee = e.target.value;
      renderDashboard();
    });
  }

  // ฟิลเตอร์ระดับความสำคัญ
  document.getElementById('priorityFilter').addEventListener('change', (e) => {
    state.filters.priority = e.target.value;
    renderDashboard();
  });

  // ฟิลเตอร์ช่วงวันครบกำหนดส่ง
  const fromEl = document.getElementById('dueDateFromFilter');
  const toEl = document.getElementById('dueDateToFilter');
  const includeNoDueEl = document.getElementById('includeNoDueDateFilter');
  const btnResetDue = document.getElementById('btnResetDueDateRange');
  const btnClearDue = document.getElementById('btnClearDueDateRange');

  // เริ่มต้น Date Pickers และ Auto-masking สำหรับช่องตัวกรอง
  initDatePickerInput('dueDateFromFilter');
  initDatePickerInput('dueDateToFilter');

  // เริ่มต้น Date Pickers และ Auto-masking สำหรับช่องใน Modal เพิ่ม/แก้ไขงาน
  initDatePickerInput('taskReportDate', 'btnPickerReportDate');
  initDatePickerInput('taskDueDate', 'btnPickerDueDate');

  if (fromEl) {
    fromEl.addEventListener('change', (e) => {
      const isoVal = parseDmyToIso(e.target.value);
      state.filters.dueDateFrom = isoVal;
      // หากเลือก From มากกว่า To ให้ปรับ To ให้เท่ากับ From
      if (toEl && toEl.value && isoVal) {
        const toIso = parseDmyToIso(toEl.value);
        if (toIso && isoVal > toIso) {
          setDateInputValue('dueDateToFilter', isoVal);
          state.filters.dueDateTo = isoVal;
        }
      }
      renderDashboard();
    });
  }

  if (toEl) {
    toEl.addEventListener('change', (e) => {
      const isoVal = parseDmyToIso(e.target.value);
      state.filters.dueDateTo = isoVal;
      // หากเลือก To น้อยกว่า From ให้ปรับ From ให้เท่ากับ To
      if (fromEl && fromEl.value && isoVal) {
        const fromIso = parseDmyToIso(fromEl.value);
        if (fromIso && isoVal < fromIso) {
          setDateInputValue('dueDateFromFilter', isoVal);
          state.filters.dueDateFrom = isoVal;
        }
      }
      renderDashboard();
    });
  }

  if (includeNoDueEl) {
    includeNoDueEl.addEventListener('change', (e) => {
      state.filters.includeNoDueDate = e.target.checked;
      renderDashboard();
    });
  }

  if (btnResetDue) {
    btnResetDue.addEventListener('click', () => {
      initDueDateFilter(true);
      renderDashboard();
    });
  }

  if (btnClearDue) {
    btnClearDue.addEventListener('click', () => {
      clearDueDateFilter();
    });
  }

  // ช่องค้นหา
  let debounceTimer;
  document.getElementById('searchInput').addEventListener('input', (e) => {
    clearTimeout(debounceTimer);
    debounceTimer = setTimeout(() => {
      state.filters.search = e.target.value.trim().toLowerCase();
      renderDashboard();
    }, 200);
  });

  // สลับมุมมอง Kanban / ตาราง
  document.getElementById('btnViewKanban').addEventListener('click', () => switchView('kanban'));
  document.getElementById('btnViewTable').addEventListener('click', () => switchView('table'));

  // ฟอร์มบันทึกงาน
  document.getElementById('taskForm').addEventListener('submit', handleTaskFormSubmit);

  // สลับการกรอกไซต์งานใหม่
  const siteSelect = document.getElementById('taskSiteSelect');
  const customSiteWrapper = document.getElementById('customSiteWrapper');
  siteSelect.addEventListener('change', (e) => {
    if (e.target.value === '__NEW__') {
      customSiteWrapper.classList.remove('hidden');
      document.getElementById('taskSiteCustom').focus();
    } else {
      customSiteWrapper.classList.add('hidden');
    }
  });

  // ฟอร์มตั้งค่า
  document.getElementById('settingsForm').addEventListener('submit', handleSettingsSubmit);
  document.getElementById('btnTestTelegram').addEventListener('click', handleTestTelegram);

  // ตั้งค่ากล่องลากวางไฟล์แนบ
  setupTaskFileDropZone();

  // ตัวกรองและค้นหาในคลังงาน (Archive)
  const archiveSearchEl = document.getElementById('archiveSearchInput');
  if (archiveSearchEl) {
    let archiveDebounce;
    archiveSearchEl.addEventListener('input', () => {
      clearTimeout(archiveDebounce);
      archiveDebounce = setTimeout(() => {
        loadArchivedTasks();
      }, 300);
    });
  }

  const archiveSiteEl = document.getElementById('archiveSiteFilter');
  if (archiveSiteEl) {
    archiveSiteEl.addEventListener('change', () => {
      loadArchivedTasks();
    });
  }
}

/**
 * สลับมุมมอง Kanban หรือ Table
 */
function switchView(view) {
  state.currentView = view;
  const kanbanSection = document.getElementById('kanbanViewSection');
  const tableSection = document.getElementById('tableViewSection');
  const btnKanban = document.getElementById('btnViewKanban');
  const btnTable = document.getElementById('btnViewTable');

  if (view === 'kanban') {
    kanbanSection.classList.remove('hidden');
    tableSection.classList.add('hidden');
    btnKanban.classList.add('bg-blue-600', 'text-white');
    btnKanban.classList.remove('bg-white', 'text-slate-700');
    btnTable.classList.add('bg-white', 'text-slate-700');
    btnTable.classList.remove('bg-blue-600', 'text-white');
  } else {
    kanbanSection.classList.add('hidden');
    tableSection.classList.remove('hidden');
    btnTable.classList.add('bg-blue-600', 'text-white');
    btnTable.classList.remove('bg-white', 'text-slate-700');
    btnKanban.classList.add('bg-white', 'text-slate-700');
    btnKanban.classList.remove('bg-blue-600', 'text-white');
  }
  renderDashboard();
}

/**
 * คำนวณและเรนเดอร์ทั้ง Dashboard (KPIs, Kanban, Table)
 */
function renderDashboard() {
  const filtered = getFilteredTasks();

  // อัปเดตตัวเลข KPI บนหัวการ์ด
  updateKpiCards(filtered);

  if (state.currentView === 'kanban') {
    renderKanbanBoard(filtered);
  } else {
    renderTableView(filtered);
  }
}

/**
 * ดึงรายการงานที่ผ่านเงื่อนไขการค้นหาและฟิลเตอร์
 */
function getFilteredTasks() {
  return state.tasks.filter(task => {
    // 1. ฟิลเตอร์ไซต์งาน
    if (state.filters.site !== 'ALL' && task.site !== state.filters.site) {
      return false;
    }

    // 2. ฟิลเตอร์ผู้รับผิดชอบ
    if (state.filters.assignee && state.filters.assignee !== 'ALL') {
      const targetAssignee = state.filters.assignee;
      if (targetAssignee === 'ไม่ระบุ') {
        if (task.assignee && task.assignee !== 'ไม่ระบุ' && task.assignee.trim() !== '') {
          return false;
        }
      } else if (task.assignee !== targetAssignee) {
        return false;
      }
    }

    // 3. ฟิลเตอร์ระดับความสำคัญ
    if (state.filters.priority !== 'ALL' && task.priority !== state.filters.priority) {
      return false;
    }

    // 4. ฟิลเตอร์ช่วงวันครบกำหนดส่ง (Due Date Range)
    const hasDateFilter = state.filters.dueDateFrom || state.filters.dueDateTo;
    if (hasDateFilter) {
      const taskDue = task.dueDate ? String(task.dueDate).trim() : '';
      if (!taskDue) {
        // หากไม่มีวันครบกำหนด และไม่ได้เลือก "รวมงานไม่มีกำหนด" ให้กรองออก
        if (!state.filters.includeNoDueDate) {
          return false;
        }
      } else {
        if (state.filters.dueDateFrom && taskDue < state.filters.dueDateFrom) {
          return false;
        }
        if (state.filters.dueDateTo && taskDue > state.filters.dueDateTo) {
          return false;
        }
      }
    }

    // 5. ฟิลเตอร์ค้นหาข้อความ
    if (state.filters.search) {
      const q = state.filters.search;
      const matchTitle = (task.title || '').toLowerCase().includes(q);
      const matchDesc = (task.description || '').toLowerCase().includes(q);
      const matchAssignee = (task.assignee || '').toLowerCase().includes(q);
      const matchSite = (task.site || '').toLowerCase().includes(q);
      const matchId = (task.id || '').toLowerCase().includes(q);
      if (!matchTitle && !matchDesc && !matchAssignee && !matchSite && !matchId) {
        return false;
      }
    }

    return true;
  });
}

/**
 * อัปเดตตัวเลขการ์ดสถิติต่างๆ
 */
function updateKpiCards(filteredTasks) {
  const todayStr = getLocalDateString();

  const total = filteredTasks.length;
  const todo = filteredTasks.filter(t => t.status === 'รอดำเนินการ').length;
  const inProgress = filteredTasks.filter(t => t.status === 'กำลังดำเนินการ').length;
  const review = filteredTasks.filter(t => t.status === 'รอตรวจสอบ').length;
  const done = filteredTasks.filter(t => t.status === 'เสร็จสิ้น').length;
  const overdue = filteredTasks.filter(t => t.dueDate && t.dueDate < todayStr && t.status !== 'เสร็จสิ้น').length;

  document.getElementById('statTotal').innerText = total;
  document.getElementById('statTodo').innerText = todo;
  document.getElementById('statInProgress').innerText = inProgress;
  document.getElementById('statReview').innerText = review;
  document.getElementById('statDone').innerText = done;
  document.getElementById('statOverdue').innerText = overdue;
}

/**
 * เรนเดอร์กระดาน Kanban
 */
function renderKanbanBoard(filteredTasks) {
  state.statuses.forEach(status => {
    const colContainer = document.getElementById(`col-tasks-${status}`);
    const colCountBadge = document.getElementById(`count-${status}`);
    if (!colContainer) return;

    const tasksInStatus = filteredTasks.filter(t => t.status === status);
    if (colCountBadge) colCountBadge.innerText = tasksInStatus.length;

    if (tasksInStatus.length === 0) {
      colContainer.innerHTML = `
        <div class="h-32 flex flex-col items-center justify-center text-slate-400 border-2 border-dashed border-slate-200 rounded-xl">
          <i class="fa-regular fa-folder-open text-2xl mb-1 opacity-50"></i>
          <span class="text-xs">ไม่มีงานในสถานะนี้</span>
        </div>
      `;
      return;
    }

    colContainer.innerHTML = tasksInStatus.map(task => renderTaskCardHtml(task)).join('');
  });
}

/**
 * สร้าง HTML สำหรับการ์ดงานใน Kanban
 */
function renderTaskCardHtml(task) {
  const siteStyle = getSiteColorStyle(task.site);
  const priorityStyle = getPriorityBadgeStyle(task.priority);
  const todayStr = getLocalDateString();
  const isOverdue = task.dueDate && task.dueDate < todayStr && task.status !== 'เสร็จสิ้น';

  // ปุ่มเปลี่ยนสถานะก่อนหน้า/ถัดไป
  const currentIndex = state.statuses.indexOf(task.status);
  const prevStatus = currentIndex > 0 ? state.statuses[currentIndex - 1] : null;
  const nextStatus = currentIndex < state.statuses.length - 1 ? state.statuses[currentIndex + 1] : null;
  const isHighlighted = state.highlightTaskId === task.id;

  return `
    <div class="task-card bg-[#F7F4EA] p-4 rounded-2xl border border-[#EFE9DC] shadow-2xs hover:shadow-md relative group ${isHighlighted ? 'task-card-bounce ring-2 ring-[#2491FA] ring-offset-2' : ''}"
         data-task-id="${task.id}"
         draggable="true"
         ondragstart="onCardDragStart(event, '${task.id}')"
         ondragend="onCardDragEnd(event)">
      
      <!-- Site & Priority Badges -->
      <div class="flex items-center justify-between gap-2 mb-2">
        <span class="badge-site ${siteStyle.bg} ${siteStyle.text} border ${siteStyle.border}">
          <i class="fa-solid fa-location-dot text-[10px]"></i>
          <span class="truncate max-w-[140px]">${escapeHtml(task.site)}</span>
        </span>
        <span class="text-xs font-semibold px-2 py-0.5 rounded-full ${priorityStyle}">
          ${escapeHtml(task.priority)}
        </span>
      </div>

      <!-- Task Title & Badges -->
      <div class="flex items-start justify-between gap-1.5 mb-1.5">
        <h4 class="font-bold text-[#201E1C] text-sm leading-snug group-hover:text-[#2491FA] transition-colors">
          ${escapeHtml(task.title)}
        </h4>
        <div class="flex items-center gap-1 shrink-0">
          ${task.checklist && task.checklist.length > 0 ? (() => {
            const clStats = getChecklistStats(task.checklist);
            return `
              <span class="inline-flex items-center gap-1 text-[10px] font-bold ${clStats.isAllDone ? 'text-emerald-700 bg-emerald-50 border-emerald-200' : 'text-[#6E6862] bg-[#FAF8F2] border-[#EFE9DC]'} px-1.5 py-0.5 rounded-md border" title="รายการย่อยที่เสร็จ: ${clStats.text}">
                <i class="fa-solid fa-list-check text-[9px] ${clStats.isAllDone ? 'text-emerald-600' : 'text-[#2491FA]'}"></i>
                <span>${clStats.text}</span>
              </span>
            `;
          })() : ''}
          ${task.attachments && task.attachments.length > 0 ? `
            <span class="inline-flex items-center gap-1 text-[10px] font-bold text-[#2491FA] bg-blue-50 px-1.5 py-0.5 rounded-md border border-blue-200/60 flex-shrink-0" title="มีไฟล์แนบ ${task.attachments.length} ไฟล์">
              <i class="fa-solid fa-paperclip text-[9px]"></i>
              <span>${task.attachments.length}</span>
            </span>
          ` : ''}
        </div>
      </div>

      <!-- Task Description (ถ้ามี) -->
      ${task.description ? `
        <p class="text-xs text-[#6E6862] mb-2.5 line-clamp-2 leading-relaxed">
          ${escapeHtml(task.description)}
        </p>
      ` : ''}

      <!-- Subtasks Checklist Progress Bar (ถ้ามี) -->
      ${task.checklist && task.checklist.length > 0 ? (() => {
        const clStats = getChecklistStats(task.checklist);
        return `
          <div class="mb-2.5 p-1.5 px-2 bg-[#FAF8F2] rounded-xl border border-[#EFE9DC]/80">
            <div class="flex items-center justify-between text-[11px] mb-1">
              <span class="text-[#6E6862] flex items-center gap-1 font-medium">
                <i class="fa-solid fa-list-check text-[10px] text-[#2491FA]"></i>
                <span>งานย่อย</span>
              </span>
              <span class="font-bold text-[11px] ${clStats.isAllDone ? 'text-emerald-600' : 'text-[#201E1C]'}">
                ${clStats.text} (${clStats.percent}%)
              </span>
            </div>
            <div class="w-full bg-[#EDE7DA] rounded-full h-1.5 overflow-hidden">
              <div class="${clStats.isAllDone ? 'bg-emerald-500' : 'bg-[#2491FA]'} h-1.5 rounded-full transition-all" style="width: ${clStats.percent}%"></div>
            </div>
          </div>
        `;
      })() : ''}

      <!-- Reporter & Report Date (ถ้ามี) -->
      ${task.reporter || task.reportDate ? `
        <div class="text-[11px] text-[#6E6862] mb-1.5 flex items-center justify-between gap-1">
          ${task.reporter ? `
            <div class="flex items-center gap-1.5 truncate" title="ผู้แจ้ง: ${escapeHtml(task.reporter)}">
              <i class="fa-solid fa-bullhorn text-[10px] text-[#2491FA]"></i>
              <span class="text-slate-500 text-[10px]">ผู้แจ้ง:</span>
              <span class="font-medium text-[#201E1C] truncate max-w-[110px]">${escapeHtml(task.reporter)}</span>
            </div>
          ` : '<span></span>'}
          ${task.reportDate ? `
            <div class="text-[10px] text-[#6E6862] flex items-center gap-1 whitespace-nowrap" title="วันที่แจ้ง: ${formatDateDisplay(task.reportDate)}">
              <i class="fa-regular fa-calendar-plus text-[9px] text-[#2491FA]"></i>
              <span>${formatDateDisplay(task.reportDate)}</span>
            </div>
          ` : ''}
        </div>
      ` : ''}

      <!-- Assignee & Due Date -->
      <div class="flex items-center justify-between text-xs text-[#6E6862] border-t border-[#EFE9DC] pt-2.5 mt-2">
        <div class="flex items-center gap-1.5 font-medium text-[#201E1C]">
          <div class="w-6 h-6 rounded-full bg-[#EDE7DA] flex items-center justify-center text-[#201E1C] text-xs font-bold">
            <i class="fa-regular fa-user text-[10px]"></i>
          </div>
          <span class="truncate max-w-[100px]">${escapeHtml(task.assignee)}</span>
        </div>

        <div class="flex items-center gap-1 ${isOverdue ? 'text-rose-600 font-semibold overdue-alert' : 'text-[#6E6862]'}">
          <i class="fa-regular fa-calendar text-[11px]"></i>

/**
 * จัดการ Drag and Drop ในกระดาน Kanban
 */
function onCardDragStart(e, taskId) {
  state.draggedTaskId = taskId;
  e.target.classList.add('dragging');
  e.dataTransfer.setData('text/plain', taskId);
  e.dataTransfer.effectAllowed = 'move';
}

function onCardDragEnd(e) {
  e.target.classList.remove('dragging');
  state.draggedTaskId = null;
}

function handleDragOver(e) {
  e.preventDefault();
  e.currentTarget.classList.add('drag-over');
  e.dataTransfer.dropEffect = 'move';
}

function handleDragLeave(e) {
  e.currentTarget.classList.remove('drag-over');
}

function handleDrop(e, targetStatus) {
  e.preventDefault();
  e.currentTarget.classList.remove('drag-over');
  const taskId = e.dataTransfer.getData('text/plain') || state.draggedTaskId;
  if (!taskId) return;

  const task = state.tasks.find(t => t.id === taskId);
  if (!task || task.status === targetStatus) return;

  // Optimistic UI Update ทันทีเพื่อให้ลื่นไหล
  const oldStatus = task.status;
  task.status = targetStatus;
  state.lastOwnActionTime = Date.now();
  state.lastOwnTaskId = taskId;
  renderDashboard();

  // ส่งบันทึกไปยังเซิร์ฟเวอร์
  google.script.run
    .withSuccessHandler((res) => {
      if (!res.success) {
        task.status = oldStatus;
        renderDashboard();
        Swal.fire({ icon: 'error', title: 'อัปเดตสถานะไม่สำเร็จ', text: res.message });
      }
    })
    .withFailureHandler((err) => {
      task.status = oldStatus;
      renderDashboard();
      Swal.fire({ icon: 'error', title: 'ผิดพลาด', text: err.message });
    })
    .updateTaskStatus(taskId, targetStatus);
}

/**
 * เปลี่ยนสถานะงานด่วน (จากปุ่มลูกศรหรือ Dropdown)
 */
function quickChangeStatus(taskId, newStatus) {
  const task = state.tasks.find(t => t.id === taskId);
  if (!task || task.status === newStatus) return;

  const oldStatus = task.status;
  task.status = newStatus;
  state.lastOwnActionTime = Date.now();
  state.lastOwnTaskId = taskId;
  renderDashboard();

  google.script.run
    .withSuccessHandler((res) => {
      if (!res.success) {
        task.status = oldStatus;
        renderDashboard();
        Swal.fire({ icon: 'error', title: 'เปลี่ยนสถานะไม่สำเร็จ', text: res.message });
      }
    })
    .withFailureHandler((err) => {
      task.status = oldStatus;
      renderDashboard();
      Swal.fire({ icon: 'error', title: 'ข้อผิดพลาด', text: err.message });
    })
    .updateTaskStatus(taskId, newStatus);
}

/**
 * คำนวณสถิติของรายการ Checklist
 * @param {Array} checklist รายการ [{id, text, done}]
 * @returns {Object} { total, done, percent, text, isAllDone }
 */
function getChecklistStats(checklist) {
  if (!Array.isArray(checklist) || checklist.length === 0) {
    return {
      total: 0,
      done: 0,
      percent: 0,
      text: '0/00',
      isAllDone: false
    };
  }

  const total = checklist.length;
  const done = checklist.filter(item => Boolean(item && item.done)).length;
  const totalFormatted = String(total).padStart(2, '0');
  const percent = total > 0 ? Math.round((done / total) * 100) : 0;
  const isAllDone = total > 0 && done === total;

  return {
    total,
    done,
    percent,
    text: `${done}/${totalFormatted}`,
    isAllDone
  };
}

/**
 * อัปเดต UI Progress Badge และ Progress Bar ของ Checklist ใน Modal
 */
function updateTaskChecklistProgressUi() {
  const badge = document.getElementById('taskChecklistProgressBadge');
  const barContainer = document.getElementById('taskChecklistProgressBarContainer');
  const bar = document.getElementById('taskChecklistProgressBar');
  const stats = getChecklistStats(state.currentEditingChecklist);

  if (badge) {
    badge.innerText = stats.text;
    if (stats.total > 0 && stats.isAllDone) {
      badge.className = 'text-[11px] font-bold text-emerald-700 bg-emerald-50 px-2 py-0.5 rounded-full border border-emerald-300';
    } else {
      badge.className = 'text-[11px] font-bold text-[#6E6862] bg-[#FAF8F2] px-2 py-0.5 rounded-full border border-[#EFE9DC]';
    }
  }

  if (barContainer && bar) {
    if (stats.total > 0) {
      barContainer.classList.remove('hidden');
      bar.style.width = `${stats.percent}%`;
      if (stats.isAllDone) {
        bar.className = 'bg-emerald-500 h-1.5 rounded-full transition-all duration-300';
      } else {
        bar.className = 'bg-[#2491FA] h-1.5 rounded-full transition-all duration-300';
      }
    } else {
      barContainer.classList.add('hidden');
      bar.style.width = '0%';
    }
  }
}

/**
 * เรนเดอร์แถวรายการ Checklist ใน Modal
 */
function renderTaskChecklist() {
  const container = document.getElementById('taskChecklistContainer');
  if (!container) return;

  const items = state.currentEditingChecklist || [];
  if (items.length === 0) {
    container.innerHTML = `
      <div class="text-[11px] text-[#9E9890] italic py-2 text-center bg-[#FAF8F2]/60 rounded-xl border border-dashed border-[#EFE9DC]">
        ยังไม่มีรายการงานย่อย (พิมพ์ด้านบนแล้วกด Enter เพื่อเพิ่มได้ไม่จำกัด)
      </div>
    `;
    updateTaskChecklistProgressUi();
    return;
  }

  container.innerHTML = items.map((item) => {
    const isDone = Boolean(item.done);
    return `
      <div id="checklistItemRow_${item.id}"
           class="group flex items-center gap-2 p-1.5 px-2 rounded-xl border transition-all ${isDone ? 'bg-emerald-50/40 border-emerald-200/70' : 'bg-[#FAF8F2] hover:bg-white border-[#EFE9DC]'}">
        <!-- Checkbox ติ๊กเสร็จ -->
        <label class="cursor-pointer flex items-center shrink-0">
          <input type="checkbox"
                 id="checklistItemCb_${item.id}"
                 ${isDone ? 'checked' : ''}
                 onchange="toggleChecklistItem('${item.id}', this.checked)"
                 class="w-4 h-4 text-[#2491FA] rounded-md border-slate-300 focus:ring-[#2491FA] cursor-pointer">
        </label>

        <!-- ข้อความรายการ (แก้ไขได้) -->
        <input type="text"
               id="checklistItemText_${item.id}"
               value="${escapeHtml(item.text || '')}"
               placeholder="ระบุชื่องานย่อย..."
               onchange="updateChecklistItemText('${item.id}', this.value)"
               class="flex-1 bg-transparent border-0 p-0 text-xs outline-none focus:ring-0 ${isDone ? 'line-through text-[#6E6862]' : 'text-[#201E1C]'}">

        <!-- ปุ่มลบรายการ -->
        <button type="button"
                onclick="removeChecklistItem('${item.id}')"
                title="ลบรายการนี้"
                class="opacity-40 group-hover:opacity-100 text-[#6E6862] hover:text-rose-600 p-1 rounded-lg transition-colors cursor-pointer shrink-0">
          <i class="fa-regular fa-trash-can text-xs"></i>
        </button>
      </div>
    `;
  }).join('');

  updateTaskChecklistProgressUi();
}

/**
 * เพิ่มรายการ Checklist ใหม่
 */
function addChecklistItem(text) {
  const trimmed = (text || '').trim();
  if (!trimmed) return;

  if (!Array.isArray(state.currentEditingChecklist)) {
    state.currentEditingChecklist = [];
  }

  const newItem = {
    id: 'cl_' + Date.now() + '_' + Math.random().toString(36).substring(2, 7),
    text: trimmed,
    done: false
  };

  state.currentEditingChecklist.push(newItem);
  renderTaskChecklist();

  // Scroll to bottom
  const container = document.getElementById('taskChecklistContainer');
  if (container) {
    container.scrollTop = container.scrollHeight;
  }
}

/**
 * สลับสถานะ เสร็จ/ไม่เสร็จ ของรายการ Checklist (In-place update เพื่อไม่ให้สูญเสีย Focus)
 */
function toggleChecklistItem(itemId, isChecked) {
  const item = (state.currentEditingChecklist || []).find(it => it.id === itemId);
  if (!item) return;

  item.done = Boolean(isChecked);

  // ปรับแต่ง UI แถวนี้โดยตรง
  const row = document.getElementById(`checklistItemRow_${itemId}`);
  const textInput = document.getElementById(`checklistItemText_${itemId}`);

  if (row) {
    if (item.done) {
      row.className = 'group flex items-center gap-2 p-1.5 px-2 rounded-xl border transition-all bg-emerald-50/40 border-emerald-200/70';
    } else {
      row.className = 'group flex items-center gap-2 p-1.5 px-2 rounded-xl border transition-all bg-[#FAF8F2] hover:bg-white border-[#EFE9DC]';
    }
  }

  if (textInput) {
    if (item.done) {
      textInput.className = 'flex-1 bg-transparent border-0 p-0 text-xs outline-none focus:ring-0 line-through text-[#6E6862]';
    } else {
      textInput.className = 'flex-1 bg-transparent border-0 p-0 text-xs outline-none focus:ring-0 text-[#201E1C]';
    }
  }

  updateTaskChecklistProgressUi();
}

/**
 * อัปเดตข้อความรายการ Checklist เมื่อผู้ใช้พิมพ์แก้ไขในแถว
 */
function updateChecklistItemText(itemId, newText) {
  const item = (state.currentEditingChecklist || []).find(it => it.id === itemId);
  if (!item) return;
  item.text = (newText || '').trim();
}

/**
 * ลบรายการ Checklist
 */
function removeChecklistItem(itemId) {
  state.currentEditingChecklist = (state.currentEditingChecklist || []).filter(it => it.id !== itemId);
  renderTaskChecklist();
}

/**
 * รับเหตุการณ์กดปุ่มบน Input เพิ่มรายการ Checklist
 */
function handleChecklistInputKeyDown(e) {
  if (e.key === 'Enter') {
    e.preventDefault();
    handleAddChecklistFromInput();
  }
}

/**
 * ดึงค่าจาก Input เพื่อเพิ่มรายการ Checklist
 */
function handleAddChecklistFromInput() {
  const input = document.getElementById('newChecklistItemInput');
  if (!input) return;
  const val = input.value.trim();
  if (!val) return;
  addChecklistItem(val);
  input.value = '';
  input.focus();
}

/**
 * เปิด Modal สำหรับสร้างงานใหม่
 */
function openCreateTaskModal(defaultStatus = 'รอดำเนินการ') {
  // ปิดปฏิทิน Flatpickr หากมีเปิดค้างอยู่
  const rFp = document.getElementById('taskReportDate')?._flatpickr;
  if (rFp) rFp.close();
  const dFp = document.getElementById('taskDueDate')?._flatpickr;
  if (dFp) dFp.close();

  document.getElementById('taskModalTitle').innerText = 'สร้างงานใหม่';
  document.getElementById('taskId').value = '';
  document.getElementById('taskTitle').value = '';
  document.getElementById('taskDesc').value = '';
  document.getElementById('taskPriority').value = 'ปานกลาง';
  document.getElementById('taskStatus').value = defaultStatus;
  
  // วันครบกำหนดตั้งเป็นค่าว่าง
  setDateInputValue('taskDueDate', '');

  // รีเซ็ตการเลือกไซต์งาน
  renderSiteFormOptions();
  document.getElementById('taskSiteSelect').value = state.sites[0] || '';
  document.getElementById('customSiteWrapper').classList.add('hidden');
  document.getElementById('taskSiteCustom').value = '';

  // รีเซ็ตการเลือกผู้รับผิดชอบ
  renderAssigneeFormOptions('');
  const assigneeSelect = document.getElementById('taskAssigneeSelect');
  if (assigneeSelect) assigneeSelect.value = '';
  document.getElementById('customAssigneeWrapper').classList.add('hidden');
  document.getElementById('taskAssigneeCustom').value = '';

  // ตั้งค่าผู้แจ้ง เริ่มต้นเป็นผู้ใช้ที่เข้าสู่ระบบ
  renderUserReportersList();
  const reporterInput = document.getElementById('taskReporter');
  if (reporterInput) {
    const currentUserName = state.currentUser ? (state.currentUser.fullName || state.currentUser.username || '') : '';
    reporterInput.value = currentUserName;
  }

  // ตั้งค่าวันที่แจ้ง เริ่มต้นเป็นวันปัจจุบัน (รูปแบบ DD/MM/YYYY)
  setDateInputValue('taskReportDate', getLocalDateString());

  // รีเซ็ตการจัดการไฟล์แนบ
  state.taskFileQueue = [];
  state.currentEditingAttachments = [];
  const progressWrapper = document.getElementById('taskUploadProgressWrapper');
  if (progressWrapper) progressWrapper.classList.add('hidden');
  renderExistingAttachmentsList([], '');
  renderSelectedFilesQueue();
  updateAttachmentsBadge();
  const fileInput = document.getElementById('taskFileInput');
  if (fileInput) fileInput.value = '';

  // รีเซ็ตรายการ Checklist
  state.currentEditingChecklist = [];
  const checklistInput = document.getElementById('newChecklistItemInput');
  if (checklistInput) checklistInput.value = '';
  renderTaskChecklist();

  document.getElementById('taskModal').classList.remove('hidden');
}

/**
 * เปิด Modal เพื่อแก้ไขงานเดิม
 */
function openEditTaskModal(taskId) {
  const task = state.tasks.find(t => t.id === taskId);
  if (!task) return;

  // ปิดปฏิทิน Flatpickr หากมีเปิดค้างอยู่
  const rFp = document.getElementById('taskReportDate')?._flatpickr;
  if (rFp) rFp.close();
  const dFp = document.getElementById('taskDueDate')?._flatpickr;
  if (dFp) dFp.close();

  document.getElementById('taskModalTitle').innerText = `แก้ไขงาน (${task.id})`;
  document.getElementById('taskId').value = task.id;
  document.getElementById('taskTitle').value = task.title;
  document.getElementById('taskDesc').value = task.description || '';
  document.getElementById('taskPriority').value = task.priority;
  document.getElementById('taskStatus').value = task.status;
  setDateInputValue('taskDueDate', task.dueDate || '');

  // จัดการตัวเลือกไซต์งาน
  renderSiteFormOptions();
  const siteSelect = document.getElementById('taskSiteSelect');
  if (state.sites.includes(task.site)) {
    siteSelect.value = task.site;
    document.getElementById('customSiteWrapper').classList.add('hidden');
  } else {
    siteSelect.value = '__NEW__';
    document.getElementById('customSiteWrapper').classList.remove('hidden');
    document.getElementById('taskSiteCustom').value = task.site;
  }

  // จัดการตัวเลือกผู้รับผิดชอบ
  renderAssigneeFormOptions(task.assignee);
  const assigneeSelect = document.getElementById('taskAssigneeSelect');
  const customAssigneeWrapper = document.getElementById('customAssigneeWrapper');
  const customAssigneeInput = document.getElementById('taskAssigneeCustom');

  let assigneeMatched = false;
  if (assigneeSelect && task.assignee) {
    for (let i = 0; i < assigneeSelect.options.length; i++) {
      if (assigneeSelect.options[i].value === task.assignee) {
        assigneeSelect.selectedIndex = i;
        assigneeMatched = true;
        break;
      }
    }
  }

  if (assigneeMatched) {
    customAssigneeWrapper.classList.add('hidden');
    customAssigneeInput.value = '';
  } else if (task.assignee && task.assignee !== 'ไม่ระบุ') {
    assigneeSelect.value = '__CUSTOM__';
    customAssigneeWrapper.classList.remove('hidden');
    customAssigneeInput.value = task.assignee;
  } else {
    assigneeSelect.value = '';
    customAssigneeWrapper.classList.add('hidden');
    customAssigneeInput.value = '';
  }

  // จัดการผู้แจ้ง
  renderUserReportersList();
  const reporterInput = document.getElementById('taskReporter');
  if (reporterInput) {
    reporterInput.value = task.reporter || '';
  }

  // จัดการวันที่แจ้ง (รูปแบบ DD/MM/YYYY)
  setDateInputValue('taskReportDate', task.reportDate || getLocalDateString());

  // จัดการไฟล์แนบเดิม และรีเซ็ตคิวไฟล์ใหม่
  state.taskFileQueue = [];
  state.currentEditingAttachments = Array.isArray(task.attachments) ? [...task.attachments] : [];
  const progressWrapper = document.getElementById('taskUploadProgressWrapper');
  if (progressWrapper) progressWrapper.classList.add('hidden');
  renderExistingAttachmentsList(state.currentEditingAttachments, task.id);
  renderSelectedFilesQueue();
  updateAttachmentsBadge();
  const fileInput = document.getElementById('taskFileInput');
  if (fileInput) fileInput.value = '';

  // จัดการรายการ Checklist
  state.currentEditingChecklist = Array.isArray(task.checklist) ? JSON.parse(JSON.stringify(task.checklist)) : [];
  const checklistInput = document.getElementById('newChecklistItemInput');
  if (checklistInput) checklistInput.value = '';
  renderTaskChecklist();

  document.getElementById('taskModal').classList.remove('hidden');
}

function closeTaskModal() {
  document.getElementById('taskModal').classList.add('hidden');
  state.taskFileQueue = [];
  state.currentEditingAttachments = [];
  state.currentEditingChecklist = [];
  const checklistInput = document.getElementById('newChecklistItemInput');
  if (checklistInput) checklistInput.value = '';
  const fileInput = document.getElementById('taskFileInput');
  if (fileInput) fileInput.value = '';

  // ปิดปฏิทิน Flatpickr หากยังเปิดค้างอยู่
  const rFp = document.getElementById('taskReportDate')?._flatpickr;
  if (rFp) rFp.close();
  const dFp = document.getElementById('taskDueDate')?._flatpickr;
  if (dFp) dFp.close();
}

/**
 * บันทึกฟอร์มงาน
 */
function handleTaskFormSubmit(e) {
  e.preventDefault();

  const siteSelectVal = document.getElementById('taskSiteSelect').value;
  let finalSite = siteSelectVal;
  if (siteSelectVal === '__NEW__') {
    finalSite = document.getElementById('taskSiteCustom').value.trim();
    if (!finalSite) {
      Swal.fire({ icon: 'warning', title: 'ข้อมูลไม่ครบ', text: 'กรุณาระบุชื่อไซต์งาน' });
      return;
    }
  }

  const assigneeSelectVal = document.getElementById('taskAssigneeSelect').value;
  let finalAssignee = assigneeSelectVal;
  if (assigneeSelectVal === '__CUSTOM__') {
    finalAssignee = document.getElementById('taskAssigneeCustom').value.trim();
  }
  if (!finalAssignee) finalAssignee = 'ไม่ระบุ';

  const rawReportDate = document.getElementById('taskReportDate') ? document.getElementById('taskReportDate').value.trim() : '';
  let finalReportDate = '';
  if (rawReportDate) {
    finalReportDate = parseDmyToIso(rawReportDate);
    if (!finalReportDate) {
      Swal.fire({
        icon: 'warning',
        title: 'รูปแบบวันที่แจ้งไม่ถูกต้อง',
        text: 'กรุณากรอกวันที่แจ้งในรูปแบบ วัน/เดือน/ปี เช่น 14/10/2026 หรือคลิกเลือกจากปฏิทิน'
      });
      return;
    }
  } else {
    finalReportDate = getLocalDateString();
  }

  const rawDueDate = document.getElementById('taskDueDate') ? document.getElementById('taskDueDate').value.trim() : '';
  let finalDueDate = '';
  if (rawDueDate) {
    finalDueDate = parseDmyToIso(rawDueDate);
    if (!finalDueDate) {
      Swal.fire({
        icon: 'warning',
        title: 'รูปแบบวันครบกำหนดไม่ถูกต้อง',
        text: 'กรุณากรอกวันครบกำหนดในรูปแบบ วัน/เดือน/ปี เช่น 25/10/2026 หรือคลิกเลือกจากปฏิทิน'
      });
      return;
    }
  }

  const taskData = {
    id: document.getElementById('taskId').value.trim(),
    site: finalSite,
    title: document.getElementById('taskTitle').value.trim(),
    description: document.getElementById('taskDesc').value.trim(),
    assignee: finalAssignee,
    reporter: (document.getElementById('taskReporter') ? document.getElementById('taskReporter').value.trim() : ''),
    reportDate: finalReportDate,
    priority: document.getElementById('taskPriority').value,
    status: document.getElementById('taskStatus').value,
    dueDate: finalDueDate,
    checklist: state.currentEditingChecklist || []
  };

  if (!taskData.title) {
    Swal.fire({ icon: 'warning', title: 'ข้อมูลไม่ครบ', text: 'กรุณาระบุชื่องาน' });
    return;
  }

  const submitBtn = document.getElementById('btnSubmitTask');
  submitBtn.disabled = true;
  submitBtn.innerHTML = '<i class="fa-solid fa-circle-notch fa-spin mr-1"></i> กำลังบันทึก...';

  google.script.run
    .withSuccessHandler((res) => {
      if (!res.success) {
        submitBtn.disabled = false;
        submitBtn.innerHTML = '<i class="fa-solid fa-floppy-disk mr-1"></i> บันทึกงาน';
        Swal.fire({ icon: 'error', title: 'บันทึกไม่สำเร็จ', text: res.message });
        return;
      }

      const savedTask = res.task;
      const finalTaskId = savedTask ? savedTask.id : taskData.id;
      const targetSite = savedTask ? savedTask.site : taskData.site;

      // หากมีไฟล์แนบในคิว ให้อัปโหลดทีละไฟล์แบบ Sequential
      if (state.taskFileQueue && state.taskFileQueue.length > 0) {
        submitBtn.innerHTML = '<i class="fa-solid fa-cloud-arrow-up fa-spin mr-1"></i> กำลังอัปโหลดไฟล์...';
        uploadQueuedFilesSequential(finalTaskId, targetSite, res.isNew, submitBtn);
      } else {
        submitBtn.disabled = false;
        submitBtn.innerHTML = '<i class="fa-solid fa-floppy-disk mr-1"></i> บันทึกงาน';

        closeTaskModal();
        Swal.fire({
          toast: true,
          position: 'top-end',
          icon: 'success',
          title: res.isNew ? 'เพิ่มงานใหม่เรียบร้อย' : 'บันทึกการแก้ไขเรียบร้อย',
          showConfirmButton: false,
          timer: 2000
        });

        // รีเฟรชข้อมูลใหม่ทั้งหมด
        loadInitialData();
      }
    })
    .withFailureHandler((err) => {
      submitBtn.disabled = false;
      submitBtn.innerHTML = '<i class="fa-solid fa-floppy-disk mr-1"></i> บันทึกงาน';
      Swal.fire({ icon: 'error', title: 'ข้อผิดพลาด', text: err.message });
    })
    .saveTask(taskData);
}

/**
 * ตั้งค่าการลากและวางไฟล์ (Drag & Drop Zone)
 */
function setupTaskFileDropZone() {
  const dropZone = document.getElementById('taskFileDropZone');
  if (!dropZone) return;

  ['dragenter', 'dragover'].forEach(eventName => {
    dropZone.addEventListener(eventName, (e) => {
      e.preventDefault();
      e.stopPropagation();
      dropZone.classList.add('border-[#2491FA]', 'bg-blue-50/50');
      dropZone.classList.remove('border-[#EFE9DC]', 'bg-[#FAF8F2]');
    }, false);
  });

  ['dragleave', 'drop'].forEach(eventName => {
    dropZone.addEventListener(eventName, (e) => {
      e.preventDefault();
      e.stopPropagation();
      dropZone.classList.remove('border-[#2491FA]', 'bg-blue-50/50');
      dropZone.classList.add('border-[#EFE9DC]', 'bg-[#FAF8F2]');
    }, false);
  });

  dropZone.addEventListener('drop', (e) => {
    const dt = e.dataTransfer;
    const files = dt ? dt.files : null;
    if (files && files.length > 0) {
      processSelectedFiles(files);
    }
  }, false);
}

/**
 * จัดการเมื่อมีการเลือกไฟล์จาก File Input (<input type="file">)
 */
function handleFileSelect(e) {
  const files = e.target.files;
  if (files && files.length > 0) {
    processSelectedFiles(files);
  }
  // รีเซ็ตเพื่อให้เลือกไฟล์ชื่อเดิมซ้ำได้ถ้าต้องการ
  e.target.value = '';
}

/**
 * ประมวลผลไฟล์ที่เลือก อ่านเป็น Base64 แล้วใส่เข้าคิว state.taskFileQueue
 */
async function processSelectedFiles(files) {
  if (!files || files.length === 0) return;

  for (let i = 0; i < files.length; i++) {
    const file = files[i];
    try {
      const base64Data = await readFileAsBase64_(file);
      state.taskFileQueue.push({
        name: file.name,
        size: file.size,
        type: file.type || 'application/octet-stream',
        base64: base64Data
      });
    } catch (err) {
      console.error('Error reading file: ' + file.name, err);
      Swal.fire({
        toast: true,
        position: 'top-end',
        icon: 'error',
        title: `อ่านไฟล์ ${file.name} ไม่สำเร็จ: ` + err.message,
        showConfirmButton: false,
        timer: 3000
      });
    }
  }

  renderSelectedFilesQueue();
  updateAttachmentsBadge();
}

/**
 * Helper แปลงไฟล์เป็น Base64
 */
function readFileAsBase64_(file) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = () => {
      const result = reader.result;
      const base64 = result.indexOf(',') !== -1 ? result.split(',')[1] : result;
      resolve(base64);
    };
    reader.onerror = (error) => reject(error);
    reader.readAsDataURL(file);
  });
}

/**
 * ลบไฟล์ออกจากคิวรออัปโหลด
 */
function removeFileFromQueue(index) {
  if (index >= 0 && index < state.taskFileQueue.length) {
    state.taskFileQueue.splice(index, 1);

}

/**
 * แปลงขนาดไฟล์เป็นหน่วย Byte, KB, MB, GB ที่อ่านง่าย
 */
function formatFileSize(bytes) {
  if (!bytes || isNaN(bytes) || bytes <= 0) return '0 B';
  const k = 1024;
  const sizes = ['B', 'KB', 'MB', 'GB'];
  const i = Math.floor(Math.log(bytes) / Math.log(k));
  return parseFloat((bytes / Math.pow(k, i)).toFixed(1)) + ' ' + sizes[i];
}

/**
 * ดึง HTML ของ FontAwesome Icon ตามประเภทและนามสกุลไฟล์
 */
function getFileIconHtml(fileName, mimeType) {
  const ext = (fileName || '').split('.').pop().toLowerCase();
  const mime = (mimeType || '').toLowerCase();

  if (['pdf'].includes(ext) || mime.includes('pdf')) {
    return '<i class="fa-solid fa-file-pdf text-rose-500"></i>';
  }
  if (['jpg', 'jpeg', 'png', 'gif', 'webp', 'svg', 'bmp'].includes(ext) || mime.startsWith('image/')) {
    return '<i class="fa-solid fa-file-image text-emerald-500"></i>';
  }
  if (['doc', 'docx'].includes(ext) || mime.includes('word') || mime.includes('document')) {
    return '<i class="fa-solid fa-file-word text-blue-600"></i>';
  }
  if (['xls', 'xlsx', 'csv'].includes(ext) || mime.includes('sheet') || mime.includes('excel') || mime.includes('csv')) {
    return '<i class="fa-solid fa-file-excel text-emerald-600"></i>';
  }
  if (['ppt', 'pptx'].includes(ext) || mime.includes('presentation') || mime.includes('powerpoint')) {
    return '<i class="fa-solid fa-file-powerpoint text-amber-600"></i>';
  }
  if (['zip', 'rar', '7z', 'tar', 'gz'].includes(ext) || mime.includes('zip') || mime.includes('compressed')) {
    return '<i class="fa-solid fa-file-zipper text-purple-500"></i>';
  }
  if (['dwg', 'dxf', 'cad'].includes(ext)) {
    return '<i class="fa-solid fa-compass-drafting text-indigo-500"></i>';
  }
  if (['txt', 'log', 'md'].includes(ext) || mime.includes('text/plain')) {
    return '<i class="fa-solid fa-file-lines text-slate-500"></i>';
  }
  return '<i class="fa-solid fa-file text-[#6E6862]"></i>';
}

/**
 * อัปโหลดไฟล์ในคิวทีละไฟล์แบบ Sequential
 * รองรับไฟล์ขนาดใหญ่สูงสุด 50 MB ผ่าน fetch POST (doPost) และมี Fallback ผ่าน google.script.run
 */
async function uploadQueuedFilesSequential(taskId, site, isNew, submitBtn) {
  const total = state.taskFileQueue.length;
  const progressWrapper = document.getElementById('taskUploadProgressWrapper');
  const progressText = document.getElementById('uploadProgressText');
  const progressPercent = document.getElementById('uploadProgressPercent');
  const progressBar = document.getElementById('uploadProgressBar');

  if (progressWrapper) progressWrapper.classList.remove('hidden');

  let successCount = 0;
  let failCount = 0;
  const failedErrors = [];

  for (let i = 0; i < total; i++) {
    const file = state.taskFileQueue[i];
    const percent = Math.round(((i) / total) * 100);
    
    if (progressText) {
      progressText.innerHTML = `<i class="fa-solid fa-circle-notch fa-spin mr-1"></i> กำลังอัปโหลด (${i + 1}/${total}): ${escapeHtml(file.name)}`;
    }
    if (progressPercent) progressPercent.innerText = `${percent}%`;
    if (progressBar) progressBar.style.width = `${percent}%`;

    const filePayload = {
      action: 'uploadAttachment',
      taskId: taskId,
      site: site,
      fileName: file.name,
      mimeType: file.type,
      size: file.size,
      base64: file.base64
    };

    try {
      let uploadSuccess = false;
      let lastErrMsg = '';

      // วิธีที่ 1: หากมี Web App URL ให้ส่งผ่าน fetch POST (doPost) ซึ่งรองรับไฟล์ขนาดใหญ่สูงสุด 50 MB
      if (state.webAppUrl) {
        try {
          const response = await fetch(state.webAppUrl, {
            method: 'POST',
            headers: {
              'Content-Type': 'text/plain;charset=utf-8'
            },
            body: JSON.stringify(filePayload)
          });

          if (response.ok) {
            const res = await response.json();
            if (res && res.success) {
              uploadSuccess = true;
            } else {
              lastErrMsg = res ? res.message : 'Upload failed via doPost';
            }
          } else {
            lastErrMsg = `HTTP ${response.status}: ${response.statusText}`;
          }
        } catch (fetchErr) {
          console.warn('doPost fetch warning, attempting google.script.run fallback:', fetchErr);
          lastErrMsg = fetchErr.message;
        }
      }

      // วิธีที่ 2: หาก fetch ไม่สำเร็จ หรือยังไม่มี webAppUrl ให้ใช้ google.script.run เป็น fallback
      if (!uploadSuccess) {
        await new Promise((resolve, reject) => {
          google.script.run
            .withSuccessHandler((res) => {
              if (res && res.success) {
                uploadSuccess = true;
                resolve(res);
              } else {
                reject(new Error(res ? res.message : (lastErrMsg || 'ข้อผิดพลาดในการอัปโหลด')));
              }
            })
            .withFailureHandler((err) => {
              reject(new Error(err ? err.message : (lastErrMsg || 'google.script.run error')));
            })
            .uploadTaskAttachment(taskId, site, {
              fileName: file.name,
              mimeType: file.type,
              size: file.size,
              base64: file.base64
            });
        });
      }

      successCount++;
    } catch (upErr) {
      console.error(`Failed to upload ${file.name}:`, upErr);
      failCount++;
      failedErrors.push(`${file.name}: ${upErr.message || 'ข้อผิดพลาดไม่ทราบสาเหตุ'}`);
    }
  }

  // จบการอัปโหลด
  if (progressPercent) progressPercent.innerText = '100%';
  if (progressBar) progressBar.style.width = '100%';

  // รีเซ็ตสถานะปุ่ม
  if (submitBtn) {
    submitBtn.disabled = false;
    submitBtn.innerHTML = '<i class="fa-solid fa-floppy-disk mr-1"></i> บันทึกงาน';
  }

  closeTaskModal();

  if (failCount === 0) {
    Swal.fire({
      toast: true,
      position: 'top-end',
      icon: 'success',
      title: isNew 
        ? `สร้างงานใหม่และแนบไฟล์ ${successCount} ไฟล์เรียบร้อย` 
        : `บันทึกงานและแนบไฟล์ ${successCount} ไฟล์เรียบร้อย`,
      showConfirmButton: false,
      timer: 3000
    });
  } else {
    const isPermissionError = failedErrors.some(err => 
      err.includes('DriveApp') || 
      err.includes('สิทธิ์ที่จำเป็น') || 
      err.includes('permission') || 
      err.includes('authorization') ||
      err.includes('ไม่ได้รับอนุญาต')
    );

    if (isPermissionError) {
      Swal.fire({
        icon: 'warning',
        title: 'ระบบต้องการการยืนยันสิทธิ์ Google Drive ครั้งแรก',
        html: `
          <div class="text-left text-xs text-[#201E1C] space-y-2.5">
            <p>เนื่องจากเป็นครั้งแรกที่มีการใช้งาน Google Drive ในระบบ ทาง Google กำหนดให้เจ้าของระบบต้องกด <b>"อนุญาตสิทธิ์ (Authorize)"</b> ในหน้า Google Apps Script Editor 1 ครั้ง</p>
            <div class="bg-blue-50 p-3 rounded-xl border border-blue-200 text-blue-900 space-y-1.5 text-[11px]">
              <div class="font-bold mb-1 flex items-center gap-1 text-[#2491FA]">
                <i class="fa-solid fa-list-check"></i> ขั้นตอนการยืนยันสิทธิ์ (ทำเพียงครั้งเดียว):
              </div>
              <div><b>1.</b> คลิกปุ่มสีน้ำเงินด้านล่างเพื่อเปิดหน้าต่าง Apps Script Editor</div>
              <div><b>2.</b> เมนูด้านบน เลือกฟังก์ชัน <code>authorizeDriveApp</code> แล้วกดปุ่ม <b>▶️ เรียกใช้ (Run)</b></div>
              <div><b>3.</b> กด <b>ตรวจสอบสิทธิ์ (Review permissions)</b> &gt; เลือกบัญชี &gt; กด <b>ขั้นสูง (Advanced)</b> &gt; กด <b>ไปที่... (ไม่ปลอดภัย)</b> &gt; กด <b>อนุญาต (Allow)</b></div>
              <div><b>4.</b> กลับมาหน้านี้แล้วลองกดบันทึกงานใหม่ได้ทันทีครับ</div>
            </div>
            <div class="text-[10px] text-rose-500 font-mono bg-rose-50 p-2 rounded-lg border border-rose-200">
              ${failedErrors.map(e => `<div>${escapeHtml(e)}</div>`).join('')}
            </div>
          </div>
        `,
        showCancelButton: true,
        confirmButtonText: '<i class="fa-solid fa-arrow-up-right-from-square mr-1"></i> เปิด Apps Script เพื่อกดยืนยันสิทธิ์',
        confirmButtonColor: '#2491FA',
        cancelButtonText: 'ปิดหน้าต่าง',
        cancelButtonColor: '#6E6862'
      }).then((result) => {
        if (result.isConfirmed) {
          window.open('https://script.google.com/d/1cd4_bnt_nnuKTQzu3F6gDmMpwWoeBBcuNyqPCn3lDBsAfmguacW1aUBE/edit', '_blank');
        }
      });
    } else {
      Swal.fire({
        icon: 'warning',
        title: 'บันทึกงานเรียบร้อย แต่บางไฟล์อัปโหลดไม่สำเร็จ',
        html: `
          <p class="text-xs text-[#201E1C] mb-2 font-medium">อัปโหลดสำเร็จ <b>${successCount}</b> ไฟล์, ล้มเหลว <b>${failCount}</b> ไฟล์</p>
          <div class="text-[11px] text-rose-600 font-mono bg-rose-50 p-2.5 rounded-xl border border-rose-200 text-left max-h-36 overflow-y-auto space-y-1">
            ${failedErrors.map(e => `<div><i class="fa-solid fa-triangle-exclamation mr-1"></i> ${escapeHtml(e)}</div>`).join('')}
          </div>
        `
      });
    }
  }

  // รีเฟรชข้อมูลใหม่ทั้งหมด
  loadInitialData();
}

function handleSettingsSubmit(e) {
  e.preventDefault();

  const tokenInput = document.getElementById('settingTelegramToken').value.trim();
  const chatId = document.getElementById('settingTelegramChatId').value.trim();
  const notifyCreate = document.getElementById('settingNotifyCreate').checked;
  const notifyStatus = document.getElementById('settingNotifyStatus').checked;
  const notifyAssigneeEl = document.getElementById('settingNotifyAssignee');
  const notifyAssignee = notifyAssigneeEl ? notifyAssigneeEl.checked : true;
  const notifyMainGroupEl = document.getElementById('settingNotifyMainGroupAlways');
  const notifyMainGroupAlways = notifyMainGroupEl ? notifyMainGroupEl.checked : false;

  const payload = {
    TELEGRAM_CHAT_ID: chatId,
    NOTIFY_ON_CREATE: notifyCreate,
    NOTIFY_ON_STATUS_CHANGE: notifyStatus,
    NOTIFY_ASSIGNEE_ON_CREATE: notifyAssignee,
    NOTIFY_MAIN_GROUP_ALWAYS: notifyMainGroupAlways
  };

  // ถ้าไม่ได้เป็น mask (********) ให้บันทึก token ใหม่
  if (tokenInput && !tokenInput.includes('****')) {
    payload.TELEGRAM_BOT_TOKEN = tokenInput;
  }

  showLoading(true);
  google.script.run
    .withSuccessHandler((res) => {
      showLoading(false);
      if (res.success) {
        Swal.fire({ icon: 'success', title: 'บันทึกสำเร็จ', text: 'บันทึกการตั้งค่า Telegram เรียบร้อยแล้ว' });
        loadInitialData();
      } else {
        Swal.fire({ icon: 'error', title: 'บันทึกไม่สำเร็จ', text: res.message });
      }
    })
    .withFailureHandler((err) => {
      showLoading(false);
      Swal.fire({ icon: 'error', title: 'ข้อผิดพลาด', text: err.message });
    })
    .saveSettings(payload);
}

function renderAssigneeFilterOptions() {
  const select = document.getElementById('assigneeFilter');
  if (!select) return;

  const currentVal = state.filters.assignee || 'ALL';
  let optionsHtml = '<option value="ALL">👤 ผู้รับผิดชอบทั้งหมด</option>';

  // รวบรวมรายชื่อผู้รับผิดชอบทั้งหมด (จาก Users และจากงานเดิมใน Tasks)
  const names = [];

  if (state.users && state.users.length > 0) {
    state.users.forEach(u => {
      const name = (u.fullName || u.username || '').trim();
      if (name && !names.includes(name)) {
        names.push(name);
      }
    });
  }

  if (state.tasks && state.tasks.length > 0) {
    state.tasks.forEach(t => {
      const name = (t.assignee || '').trim();
      if (name && name !== 'ไม่ระบุ' && name !== '-' && !names.includes(name)) {
        names.push(name);
      }
    });
  }

  // เรียงลำดับชื่อตามตัวอักษร ก-ฮ
  names.sort((a, b) => a.localeCompare(b, 'th'));

  names.forEach(name => {
    optionsHtml += `<option value="${escapeHtml(name)}" ${name === currentVal ? 'selected' : ''}>👤 ${escapeHtml(name)}</option>`;
  });

  // ตรวจสอบว่ามีงานที่ยังไม่ได้ระบุผู้รับผิดชอบหรือไม่
  const hasUnassigned = state.tasks && state.tasks.some(t => !t.assignee || t.assignee.trim() === '' || t.assignee === 'ไม่ระบุ');
  if (hasUnassigned) {
    optionsHtml += `<option value="ไม่ระบุ" ${currentVal === 'ไม่ระบุ' ? 'selected' : ''}>⚪ ไม่ระบุผู้รับผิดชอบ</option>`;
  }

  select.innerHTML = optionsHtml;
}

/**
 * คำนวณช่วงวันครบกำหนดของงานที่ยังไม่เสร็จ (สถานะ != 'เสร็จสิ้น' และมีระบุวัน)
 * @returns {{ minDate: string, maxDate: string }}
 */
function getUnfinishedTasksDueRange() {
  if (!state.tasks || state.tasks.length === 0) {
    return { minDate: '', maxDate: '' };
  }

  // คัดกรองเฉพาะงานที่ยังไม่เสร็จ และมีระบุวันครบกำหนด
  const unfinishedWithDueDate = state.tasks.filter(t => 
    t.status !== 'เสร็จสิ้น' && 
    t.dueDate && 
    typeof t.dueDate === 'string' && 
    t.dueDate.trim() !== ''
  );

  if (unfinishedWithDueDate.length === 0) {
    return { minDate: '', maxDate: '' };
  }

  // เรียงลำดับวันที่ (รูปแบบ YYYY-MM-DD เรียงลำดับตัวอักษรได้ตรงตามลำดับเวลา)
  const dueDates = unfinishedWithDueDate.map(t => t.dueDate.trim()).sort();
  const minDate = dueDates[0];
  const maxDate = dueDates[dueDates.length - 1];

  return { minDate, maxDate };
}

/**
 * กำหนดค่าเริ่มต้นตัวกรองช่วงวันครบกำหนด (ดีฟอลต์เป็นทั้งหมดทุกช่วงเวลา)
 * @param {boolean} force - บังคับเขียนทับค่าปัจจุบัน (เช่น เมื่อผู้ใช้กดปุ่มงานค้าง)
 */
function initDueDateFilter(force = false) {
  if (state.filters.dueDateInitialized && !force) {
    return;
  }

  if (force) {
    // เมื่อกดปุ่ม "งานค้าง" -> คำนวณช่วงวันของงานค้าง (น้อยสุด - มากสุด)
    const { minDate, maxDate } = getUnfinishedTasksDueRange();
    state.filters.dueDateFrom = minDate || '';
    state.filters.dueDateTo = maxDate || '';
    state.filters.dueDateInitialized = true;
  } else {
    // ค่าเริ่มต้นเมื่อโหลดระบบ -> ดีฟอลต์เป็น "ทั้งหมด" ทุกช่วงเวลา
    state.filters.dueDateFrom = '';
    state.filters.dueDateTo = '';
    state.filters.includeNoDueDate = false;
    state.filters.dueDateInitialized = true;
  }

  const fromInput = document.getElementById('dueDateFromFilter');
  const toInput = document.getElementById('dueDateToFilter');

function getSiteColorStyle(siteName) {

  let hash = 0;

}

function formatDateDisplay(dateStr) {
  if (!dateStr) return 'ไม่ระบุ';
  try {
    const d = parseDateStringToDateObj(dateStr);
    if (d) {
      const day = d.getDate();
      const months = ['ม.ค.', 'ก.พ.', 'มี.ค.', 'เม.ย.', 'พ.ค.', 'มิ.ย.', 'ก.ค.', 'ส.ค.', 'ก.ย.', 'ต.ค.', 'พ.ย.', 'ธ.ค.'];
      const month = months[d.getMonth()];
      const year = d.getFullYear() + 543; // พ.ศ.
      return `${day} ${month} ${year}`;
    }
    return String(dateStr);
  } catch (e) {
    return String(dateStr);
  }
}

/**
 * ดึงวันที่ปัจจุบันตามเวลาท้องถิ่นของเครื่อง (Local Time) รูปแบบ YYYY-MM-DD
 */
function getLocalDateString(d = new Date()) {
  const year = d.getFullYear();
  const month = String(d.getMonth() + 1).padStart(2, '0');
  const day = String(d.getDate()).padStart(2, '0');
  return `${year}-${month}-${day}`;
}

/**
 * แปลงค่าวันที่ในรูปแบบต่างๆ (Date object, ISO YYYY-MM-DD, DD/MM/YYYY, พ.ศ.) ให้เป็น JavaScript Date object
 * @param {any} val 
 * @returns {Date|null}
 */
function parseDateStringToDateObj(val) {
  if (!val) return null;
  if (val instanceof Date) {
    return isNaN(val.getTime()) ? null : new Date(val.getTime());
  }

  const s = String(val).trim();
  if (!s) return null;

  // 1. ตรวจสอบรูปแบบ ISO: YYYY-MM-DD หรือ YYYY-MM-DDTHH:mm:ss
  const isoMatch = s.match(/^(\d{4})-(\d{1,2})-(\d{1,2})/);
  if (isoMatch) {
    const year = parseInt(isoMatch[1], 10);
    const month = parseInt(isoMatch[2], 10);
    const day = parseInt(isoMatch[3], 10);
    if (month >= 1 && month <= 12 && day >= 1 && day <= 31) {
      const d = new Date(year, month - 1, day);
      if (!isNaN(d.getTime())) return d;
    }
  }

  // 2. ตรวจสอบรูปแบบ DD/MM/YYYY หรือ DD-MM-YYYY หรือ DD.MM.YYYY
  const dmyMatch = s.match(/^(\d{1,2})[\/\-\.](\d{1,2})[\/\-\.](\d{2,4})/);
  if (dmyMatch) {
    const day = parseInt(dmyMatch[1], 10);
    const month = parseInt(dmyMatch[2], 10);
    let year = parseInt(dmyMatch[3], 10);

    if (month >= 1 && month <= 12 && day >= 1 && day <= 31) {
      if (year < 100) {
        year = year >= 50 ? (year + 2500) - 543 : 2000 + year;
      } else if (year > 2400) {
        year = year - 543;
      }
      const d = new Date(year, month - 1, day);
      if (!isNaN(d.getTime())) return d;
    }
  }

  // 3. Fallback แปลงด้วย native Date
  const fallback = new Date(s);
  if (!isNaN(fallback.getTime())) {
    return new Date(fallback.getFullYear(), fallback.getMonth(), fallback.getDate());
  }

  return null;
}

/**
 * แปลง JavaScript Date object เป็น DD/MM/YYYY
 * @param {Date} dateObj 
 * @returns {string} DD/MM/YYYY หรือ ''
 */
function formatDateObjToDmy(dateObj) {
  if (!dateObj || !(dateObj instanceof Date) || isNaN(dateObj.getTime())) return '';
  const dd = String(dateObj.getDate()).padStart(2, '0');
  const mm = String(dateObj.getMonth() + 1).padStart(2, '0');
  const yyyy = dateObj.getFullYear();
  return `${dd}/${mm}/${yyyy}`;
}

/**
 * แปลง JavaScript Date object เป็น ISO YYYY-MM-DD
 * @param {Date} dateObj 
 * @returns {string} YYYY-MM-DD หรือ ''
 */
function formatDateObjToIso(dateObj) {
  if (!dateObj || !(dateObj instanceof Date) || isNaN(dateObj.getTime())) return '';
  const dd = String(dateObj.getDate()).padStart(2, '0');
  const mm = String(dateObj.getMonth() + 1).padStart(2, '0');
  const yyyy = dateObj.getFullYear();
  return `${yyyy}-${mm}-${dd}`;
}

/**
 * แปลงวันที่จาก ISO (YYYY-MM-DD) หรือรูปแบบอื่นเป็น DD/MM/YYYY สำหรับแสดงในช่อง Input
 * @param {string|Date} isoStr 
 * @returns {string} DD/MM/YYYY
 */
function isoToDmy(isoStr) {
  if (!isoStr) return '';
  const d = parseDateStringToDateObj(isoStr);
  return d ? formatDateObjToDmy(d) : '';
}

/**
 * แปลงวันที่จาก DD/MM/YYYY หรือ วว/ดด/ปปปป (รองรับทั้ง พ.ศ. และ ค.ศ.) เป็น ISO YYYY-MM-DD (ค.ศ.)
 * @param {string|Date} dmyStr 
 * @returns {string} YYYY-MM-DD หรือ ''
 */
function parseDmyToIso(dmyStr) {
  if (!dmyStr) return '';
  const d = parseDateStringToDateObj(dmyStr);
  return d ? formatDateObjToIso(d) : '';
}

/**
 * ผูก Auto-masking สำหรับช่องกรอกวันที่ ให้พิมพ์ตัวเลขแล้วแทรก / อัตโนมัติ (DD/MM/YYYY)
 * @param {HTMLInputElement} inputEl 
 */
function attachDateInputMask(inputEl) {
  if (!inputEl) return;
  inputEl.addEventListener('input', (e) => {
    // ข้ามเมื่อผู้ใช้กด Backspace หรือ Delete เพื่อให้ลบได้สะดวก
    if (e.inputType === 'deleteContentBackward' || e.inputType === 'deleteContentForward') {
      return;
    }
    let val = inputEl.value.replace(/\D/g, ''); // เอาเฉพาะตัวเลข
    if (val.length > 8) val = val.substring(0, 8);
    let formatted = '';
    if (val.length > 4) {
      formatted = `${val.substring(0, 2)}/${val.substring(2, 4)}/${val.substring(4)}`;
    } else if (val.length > 2) {
      formatted = `${val.substring(0, 2)}/${val.substring(2)}`;
    } else {
      formatted = val;
    }
    inputEl.value = formatted;
  });

  // เมื่อหลุดโฟกัส (blur) ตรวจสอบความถูกต้องและจัดรูปแบบให้เรียบร้อย
  inputEl.addEventListener('blur', () => {
    const raw = inputEl.value.trim();
    if (!raw) {
      if (inputEl._flatpickr) {
        inputEl._flatpickr.clear();
      }
      return;
    }
    const dObj = parseDateStringToDateObj(raw);
    if (dObj) {
      inputEl.value = formatDateObjToDmy(dObj);
      if (inputEl._flatpickr) {
        inputEl._flatpickr.setDate(dObj, false);
      }
    }
  });
}

/**
 * เริ่มต้น Date Picker (Flatpickr) ร่วมกับ Auto-masking สำหรับช่อง Input วันที่
 * @param {string} inputId ID ของ input element
 * @param {string} [btnPickerId] ID ของปุ่มไอคอนปฏิทิน (ถ้ามี)
 * @param {Object} [options] ตัวเลือกเพิ่มเติมสำหรับ Flatpickr
 * @returns {Object|null} Flatpickr instance
 */
function initDatePickerInput(inputId, btnPickerId, options = {}) {
  const inputEl = document.getElementById(inputId);
  if (!inputEl) return null;

  // ติดตั้ง Auto-masking ให้สามารถพิมพ์ได้โดยตรง
  attachDateInputMask(inputEl);

  let fp = null;
  if (typeof flatpickr !== 'undefined') {
    const config = {
      dateFormat: 'd/m/Y',
      allowInput: true,
      locale: (typeof flatpickr.l10ns !== 'undefined' && flatpickr.l10ns.th) ? flatpickr.l10ns.th : 'default',
      disableMobile: true,
      parseDate: function(dateStr) {
        return parseDateStringToDateObj(dateStr);
      },
      formatDate: function(dateObj) {
        return formatDateObjToDmy(dateObj);
      },
      onChange: function(selectedDates, dateStr) {
        inputEl.value = dateStr;
        inputEl.dispatchEvent(new Event('change'));
      },
      ...options
    };

    fp = flatpickr(inputEl, config);

    if (btnPickerId) {
      const btnEl = document.getElementById(btnPickerId);
      if (btnEl) {
        btnEl.addEventListener('click', (e) => {
          e.preventDefault();
          e.stopPropagation();
          fp.open();
        });
      }
    }
  }

  return fp;
}

/**
 * กำหนดค่าวันที่ให้กับ Input (รองรับทั้งส่งมาเป็น YYYY-MM-DD หรือ DD/MM/YYYY หรือ Date object)
 * @param {string} inputId 
 * @param {string|Date} dateVal 
 */
function setDateInputValue(inputId, dateVal) {
  const inputEl = document.getElementById(inputId);
  if (!inputEl) return;
  if (!dateVal) {
    inputEl.value = '';
    if (inputEl._flatpickr) inputEl._flatpickr.clear();
    return;
  }
  const dObj = parseDateStringToDateObj(dateVal);
  if (dObj) {
    inputEl.value = formatDateObjToDmy(dObj);
    if (inputEl._flatpickr) {
      inputEl._flatpickr.setDate(dObj, false);
    }
  } else {
    inputEl.value = String(dateVal);
  }
}

/**
 * ดึงค่าวันที่จาก Input ในรูปแบบมาตรฐาน ISO YYYY-MM-DD
 * @param {string} inputId 
 * @returns {string} YYYY-MM-DD หรือ ''
 */
function getDateInputValue(inputId) {
  const inputEl = document.getElementById(inputId);
  if (!inputEl) return '';
  return parseDmyToIso(inputEl.value.trim());
}

function escapeHtml(text) {
  if (!text) return '';
  return String(text)
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;');
}

function escapeJs(text) {
  if (!text) return '';
  return String(text).replace(/'/g, "\\'").replace(/"/g, '\\"');
}

/**
 * อัปเดตการแสดงผลจำนวนผู้ใช้ออนไลน์บน Navbar และใน Modal
 */
function updateOnlineUsersDisplay(count, users) {
  if (typeof count === 'number') {
    state.onlineCount = count;
  } else if (Array.isArray(users)) {
    state.onlineCount = users.length;
  }
  if (Array.isArray(users)) {
    state.onlineUsers = users;
  }

  // อัปเดตตัวเลขบน Navbar
  const countEl = document.getElementById('onlineUsersCount');
  if (countEl) {
    countEl.innerText = state.onlineCount || (state.onlineUsers ? state.onlineUsers.length : 1);
  }

  // หากหน้าต่าง Modal เปิดอยู่ ให้รีเรนเดอร์รายชื่อด้วย
  const modal = document.getElementById('onlineUsersModal');
  if (modal && !modal.classList.contains('hidden')) {
    renderOnlineUsersList();
  }
}

/**
 * ส่งสัญญาณ Heartbeat ไปยังเซิร์ฟเวอร์
 */
function sendHeartbeat() {
  if (!state.currentUser || !state.currentUser.username) return;

  google.script.run
    .withSuccessHandler((res) => {
      if (res && res.success) {
        updateOnlineUsersDisplay(res.count, res.users);
      }
    })
    .withFailureHandler((err) => {
      console.warn('Heartbeat warning: ' + err.message);
    })
    .pingOnlineUser({
      username: state.currentUser.username,
      fullName: state.currentUser.fullName || state.currentUser.username,
      role: state.currentUser.role || 'Member'
    });
}

/**
 * เริ่มต้นระบบ Heartbeat ส่งสัญญาณทุกๆ 45 วินาที
 */
function startHeartbeat() {
  stopHeartbeat();
  sendHeartbeat();
  state.heartbeatInterval = setInterval(sendHeartbeat, 45000);
}

/**
 * หยุดระบบ Heartbeat
 */
function stopHeartbeat() {
  if (state.heartbeatInterval) {
    clearInterval(state.heartbeatInterval);
    state.heartbeatInterval = null;
  }
}

/**
 * เปิดหน้าต่างดูรายชื่อผู้ใช้งานออนไลน์

 */
function refreshOnlineUsers() {
  const btn = document.getElementById('btnRefreshOnlineUsers');

      }

/**
 * เรนเดอร์การ์ดรายชื่อผู้ใช้งานออนไลน์ใน Modal
 */
function renderOnlineUsersList() {
  const container = document.getElementById('onlineUsersListContainer');
  const modalBadge = document.getElementById('onlineUsersModalBadge');
  if (!container) return;

  const users = state.onlineUsers || [];
  if (modalBadge) modalBadge.innerText = `${users.length} คน`;

  if (users.length === 0) {
    container.innerHTML = `
      <div class="py-8 text-center text-[#6E6862]">
        <i class="fa-solid fa-users-slash text-3xl mb-2 text-[#6E6862]/40"></i>
        <p class="text-xs font-semibold">ยังไม่มีผู้ใช้งานออนไลน์ในขณะนี้</p>

  }

  const currentUsername = state.currentUser ? String(state.currentUser.username).toLowerCase() : '';
  const now = Date.now();

  container.innerHTML = users.map(u => {
    const isMe = currentUsername && (String(u.username).toLowerCase() === currentUsername);

    if (u.lastActive) {
      const diffSec = Math.floor((now - u.lastActive) / 1000);
      if (diffSec > 60) {
        timeAgoText = `ใช้งานเมื่อ ${Math.floor(diffSec / 60)} นาทีที่แล้ว`;
      } else if (diffSec > 10) {
        timeAgoText = `ใช้งานเมื่อ ${diffSec} วินาทีที่แล้ว`;
      }
    }

    const initial = (u.fullName || u.username || '?').charAt(0).toUpperCase();

    return `
      <div class="flex items-center justify-between p-3 rounded-xl border ${isMe ? 'bg-blue-50/60 border-blue-200 ring-1 ring-[#2491FA]/20' : 'bg-[#FAF8F2] border-[#EFE9DC]'} transition-all">
        <div class="flex items-center gap-3 min-w-0 pr-2">
          <div class="relative flex-shrink-0">
            <div class="w-9 h-9 rounded-full ${isMe ? 'bg-[#2491FA] text-white' : 'bg-[#EDE7DA] text-[#201E1C]'} flex items-center justify-center font-bold text-xs shadow-2xs">
              ${initial}
            </div>
            <span class="absolute bottom-0 right-0 w-2.5 h-2.5 rounded-full bg-emerald-500 ring-2 ring-white"></span>
          </div>
          <div class="min-w-0">
            <div class="flex items-center gap-1.5 flex-wrap">
              <span class="text-xs font-bold text-[#201E1C] truncate">${escapeHtml(u.fullName || u.username)}</span>
              ${isMe ? '<span class="text-[10px] bg-[#2491FA] text-white px-1.5 py-0.2 rounded-md font-bold">คุณ</span>' : ''}
              <span class="text-[9px] font-bold uppercase px-1.5 py-0.2 rounded-md border ${roleClass}">
                ${escapeHtml(u.role || 'Member')}
              </span>
            </div>
            <div class="flex items-center gap-2 text-[11px] text-[#6E6862] mt-0.5">
              <span class="font-mono text-[10px] text-[#2491FA]/80">@${escapeHtml(u.username)}</span>
              <span>•</span>
              <span class="text-[10px] text-emerald-700 font-medium flex items-center gap-1">
                <span class="w-1.5 h-1.5 rounded-full bg-emerald-500 inline-block"></span>
                <span>${timeAgoText}</span>
              </span>
            </div>
          </div>
        </div>
      </div>
    `;
  }).join('');
}

/**
 * =========================================================================
 * REAL-TIME AUTO-SYNC CONTROLLER
 * ตรวจสอบและดึงข้อมูลอัปเดตแบบเรียลไทม์อัตโนมัติ (Zero-Quota Background Polling)
 * =========================================================================
 */

/**
 * เริ่มต้น Loop ตรวจสอบอัปเดตข้อมูลแบบ Real-time
 */
function startRealtimeSync() {
  stopRealtimeSync();
  updateLiveSyncBadge('active');
  // ตรวจสอบทุกๆ 4.5 วินาที
  state.realtimeSyncInterval = setInterval(checkRealtimeUpdates, 4500);
}

/**
 * หยุด Loop ตรวจสอบอัปเดตข้อมูล Real-time
 */
function stopRealtimeSync() {
  if (state.realtimeSyncInterval) {
    clearInterval(state.realtimeSyncInterval);
    state.realtimeSyncInterval = null;
  }
  updateLiveSyncBadge('paused');
}

/**
 * ตรวจสอบการอัปเดตข้อมูลจากฝั่งเซิร์ฟเวอร์
 */
function checkRealtimeUpdates() {
  // หากไม่มีผู้ใช้ล็อกอิน หรือกำลังดึงข้อมูลอยู่ หรือหน้าต่างถูกซ่อนไว้ หรือกำลังลากการ์ดอยู่ -> ข้ามรอบนี้
  if (!state.currentUser || state.isSyncing) return;
  if (document.visibilityState === 'hidden') return;
  if (state.draggedTaskId) return;

  state.isSyncing = true;
  updateLiveSyncBadge('syncing');

  const username = state.currentUser ? state.currentUser.username : '';

  google.script.run
    .withSuccessHandler((res) => {
      state.isSyncing = false;
      updateLiveSyncBadge('active');
      handleRealtimeSyncResponse(res);
    })
    .withFailureHandler((err) => {
      state.isSyncing = false;
      console.warn('Real-time sync error (will retry next tick):', err);
      updateLiveSyncBadge('warning');
    })
    .checkTasksUpdate(state.tasksVersion, username);
}

/**
 * จัดการผลลัพธ์ที่ได้รับจากการตรวจสอบ Real-time
 */
function handleRealtimeSyncResponse(res) {
  if (!res || !res.hasUpdate) return;

  const oldVersion = state.tasksVersion;
  state.tasksVersion = String(res.version || Date.now());

  if (res.data && res.data.success) {
    const data = res.data;
    state.tasks = data.tasks || [];
    state.sites = data.sites || [];
    state.allSites = data.allSites || state.allSites;
    state.users = data.users || state.users;
    state.statuses = data.statuses || state.statuses;
    state.priorities = data.priorities || state.priorities;
    state.stats = data.stats || state.stats;

    // อัปเดตออนไลน์ด้วยถ้ามีส่งมา
    if (data.onlineUsers !== undefined) {
      updateOnlineUsersDisplay(data.onlineCount, data.onlineUsers);
    }

    // ตรวจสอบว่าเป็นการกระทำของตนเองหรือไม่ (หากเพิ่งทำใน 5 วินาทีที่แล้ว ไม่ต้องเด้ง Toast แจ้งเตือนตัวเอง)
    const isSelfAction = (res.meta && res.meta.taskId && res.meta.taskId === state.lastOwnTaskId && (Date.now() - state.lastOwnActionTime) < 5000);

    let changedTaskId = null;
    if (res.meta) {
      changedTaskId = res.meta.taskId;

      // ถ้าไม่ใช่การกระทำของตนเอง ให้แสดง SweetAlert Toast และเอฟเฟกต์การ์ดเด้ง
      if (!isSelfAction) {
        if (res.meta.type === 'STATUS_CHANGE') {
          showLiveSyncToast(`งาน <strong>${escapeHtml(res.meta.title || '')}</strong> เปลี่ยนเป็นสถานะ <span class="text-[#2491FA] font-bold">"${escapeHtml(res.meta.newStatus || '')}"</span>`);
        } else if (res.meta.type === 'TASK_SAVED') {
          showLiveSyncToast(res.meta.isNew ? `มีงานใหม่เพิ่มเข้ามา: <strong>${escapeHtml(res.meta.title || '')}</strong>` : `อัปเดตข้อมูลงาน: <strong>${escapeHtml(res.meta.title || '')}</strong>`);
        } else if (res.meta.type === 'TASK_DELETED') {
          showLiveSyncToast(`งาน <strong>${escapeHtml(res.meta.title || '')}</strong> ถูกลบออก`);
        } else if (res.meta.type === 'SHEET_EDIT') {
          showLiveSyncToast('มีการแก้ไขข้อมูลจาก Google Sheets');
        }
      }
    }

    // กำหนด Highlight ให้การ์ดที่เปลี่ยนสถานะหรืออัปเดต เพื่อให้มีคลาสเด้ง (task-card-bounce)
    if (changedTaskId) {
      state.highlightTaskId = changedTaskId;
    }

    // เรนเดอร์แดชบอร์ดใหม่ โดยไม่รีเซ็ตฟิลเตอร์ที่ผู้ใช้กำลังดูอยู่
    renderDashboard();

    // ล้างสถานะ highlight หลังแอนิเมชันเด้งจบ (2.5 วินาที)
    if (state.highlightTaskId) {
      setTimeout(() => {
        state.highlightTaskId = null;
        const cardEl = document.querySelector(`[data-task-id="${changedTaskId}"]`);
        if (cardEl) {
          cardEl.classList.remove('task-card-bounce', 'ring-2', 'ring-[#2491FA]', 'ring-offset-2');
        }
      }, 2500);
    }
  }
}

/**
 * แสดง Toast แจ้งเตือนการอัปเดตแบบเรียลไทม์ (มุมขวาบน ไม่รบกวนการทำงาน)
 */
function showLiveSyncToast(htmlMessage) {
  if (typeof Swal !== 'undefined' && Swal.mixin) {
    const Toast = Swal.mixin({
      toast: true,
      position: 'top-end',
      showConfirmButton: false,
      timer: 3500,
      timerProgressBar: true,
      didOpen: (toast) => {
        toast.addEventListener('mouseenter', Swal.stopTimer);
        toast.addEventListener('mouseleave', Swal.resumeTimer);
      }
    });
    Toast.fire({
      icon: 'info',
      title: `<span class="text-xs">${htmlMessage}</span>`
    });
  }
}

/**
 * อัปเดตสถานะป้าย Live Sync บน Navbar
 * @param {'active'|'syncing'|'warning'|'paused'} mode
 */
function updateLiveSyncBadge(mode) {
  const container = document.getElementById('liveSyncStatus');
  const dot = document.getElementById('liveSyncDot');
  const pulse = document.getElementById('liveSyncPulse');
  const text = document.getElementById('liveSyncText');
  if (!container || !dot || !pulse) return;

  if (mode === 'active') {
    container.className = 'flex items-center gap-1.5 px-2.5 py-1.5 bg-emerald-50 text-emerald-700 border border-emerald-200/80 rounded-xl text-xs font-semibold shadow-2xs transition-all';
    dot.className = 'relative inline-flex rounded-full h-2 w-2 bg-emerald-500';
    pulse.className = 'animate-ping absolute inline-flex h-full w-full rounded-full bg-emerald-400 opacity-75';
    if (text) text.innerText = 'Live Sync';
    container.title = 'ระบบ Real-time กำลังทำงานปกติ';
  } else if (mode === 'syncing') {
    container.className = 'flex items-center gap-1.5 px-2.5 py-1.5 bg-blue-50 text-[#2491FA] border border-blue-200/80 rounded-xl text-xs font-semibold shadow-2xs transition-all';
    dot.className = 'relative inline-flex rounded-full h-2 w-2 bg-[#2491FA]';
    pulse.className = 'animate-ping absolute inline-flex h-full w-full rounded-full bg-blue-400 opacity-75';
    if (text) text.innerText = 'Syncing...';
    container.title = 'กำลังตรวจสอบการเปลี่ยนแปลง...';
  } else if (mode === 'warning') {
    container.className = 'flex items-center gap-1.5 px-2.5 py-1.5 bg-amber-50 text-amber-700 border border-amber-200/80 rounded-xl text-xs font-semibold shadow-2xs transition-all';
    dot.className = 'relative inline-flex rounded-full h-2 w-2 bg-amber-500';
    pulse.className = 'hidden';
    if (text) text.innerText = 'Sync Warning';
    container.title = 'การเชื่อมต่อขัดข้อง กำลังลองใหม่รอบถัดไป';
  } else if (mode === 'paused') {
    container.className = 'flex items-center gap-1.5 px-2.5 py-1.5 bg-[#EDE7DA] text-[#6E6862] border border-[#EFE9DC] rounded-xl text-xs font-semibold shadow-2xs transition-all';
    dot.className = 'relative inline-flex rounded-full h-2 w-2 bg-[#6E6862]';
    pulse.className = 'hidden';
    if (text) text.innerText = 'Sync Paused';
    container.title = 'ระบบ Real-time พักการทำงานชั่วคราว';
  }
}

function checkAuthSession() {

  if (sessionStr) {

      if (user && user.username) {
        state.currentUser = user;
        updateNavbarUser();
        startHeartbeat();
        document.getElementById('loginScreen').classList.add('hidden');
        loadInitialData();

      }

      sessionStorage.removeItem('work_tracker_session');

  const btnOnline = document.getElementById('btnOnlineUsers');

  document.getElementById('loginStep1').classList.remove('hidden');
  document.getElementById('loginStep2').classList.add('hidden');
  setTimeout(() => {
    const input = document.getElementById('loginUsername');
    if (input) input.focus();
  }, 300);
}

function updateNavbarUser() {
