<style>
  /* ฟอนต์ภาษาไทย Prompt & Clubhouse Color Variables */
  :root {
    --ch-bg: #FFFFFF;
    --ch-card: #F7F4EA;
    --ch-card-subtle: #EDE7DA;
    --ch-border: #EFE9DC;
    --ch-col-bg: #FAF8F2;
    --ch-text-main: #201E1C;
    --ch-text-muted: #6E6862;
    --ch-blue: #2491FA;
    --ch-blue-hover: #1A7CE0;
  }

  body {
    font-family: 'Prompt', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    background-color: var(--ch-bg);
    color: var(--ch-text-main);
    -webkit-font-smoothing: antialiased;
  }

  /* ปรับแต่ง Scrollbar สไตล์เรียบหรู คลีน */
  ::-webkit-scrollbar {
    width: 6px;
    height: 6px;
  }
  ::-webkit-scrollbar-track {
    background: transparent;
  }
  ::-webkit-scrollbar-thumb {
    background: #EDE7DA;
    border-radius: 9999px;
  }
  ::-webkit-scrollbar-thumb:hover {
    background: #D9D1C3;
  }

  /* Kanban Column Styles */
  .kanban-col {
    min-height: calc(100vh - 280px);
    transition: background-color 0.2s ease;
  }
  .kanban-col.drag-over {
    background-color: #EDE7DA !important;
    border: 2px dashed var(--ch-blue) !important;
  }

  /* Task Card Hover & Animation (Clubhouse Soft Cream) */
  .task-card {
    transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
    cursor: grab;
    background-color: var(--ch-card);
    border: 1px solid var(--ch-border);
    border-radius: 1rem;
  }
  .task-card:active {
    cursor: grabbing;
  }
  .task-card:hover {
    transform: translateY(-2px);
    box-shadow: 0 10px 20px -3px rgba(32, 30, 28, 0.08), 0 4px 6px -2px rgba(32, 30, 28, 0.04);
  }
  .task-card.dragging {
    opacity: 0.4;
    transform: scale(0.98);
  }

  /* Real-time Card Bounce & Highlight Animation */
  @keyframes taskCardBounce {
    0% { transform: scale(0.92) translateY(-8px); opacity: 0.6; }
    50% { transform: scale(1.04) translateY(2px); }
    70% { transform: scale(0.98); }
    100% { transform: scale(1); opacity: 1; }
  }
  .task-card-bounce {
    animation: taskCardBounce 0.65s cubic-bezier(0.34, 1.56, 0.64, 1);
    box-shadow: 0 0 0 3px rgba(36, 145, 250, 0.55), 0 12px 24px -4px rgba(36, 145, 250, 0.25) !important;
    background-color: #F0F7FF !important;
  }

  /* Site Badges with dynamic vibrant colors */
  .badge-site {
    font-size: 0.72rem;
    font-weight: 600;
    padding: 0.2rem 0.6rem;
    border-radius: 9999px;
    display: inline-flex;
    align-items: center;
    gap: 0.3rem;
  }

  /* Priority Indicator Badges */
  .priority-urgent {
    background-color: #fee2e2;
    color: #b91c1c;
    border: 1px solid #fca5a5;
  }
  .priority-high {
    background-color: #ffedd5;
    color: #c2410c;
    border: 1px solid #fdba74;
  }
  .priority-medium {
    background-color: #fef9c3;
    color: #a16207;
    border: 1px solid #fde047;
  }
  .priority-normal {
    background-color: #EDE7DA;
    color: #5C554E;
    border: 1px solid #E2DACB;
  }

  /* Modal Backdrop Animation */
  .modal-backdrop {
    backdrop-filter: blur(4px);
    background-color: rgba(32, 30, 28, 0.5);
    transition: opacity 0.25s ease;
  }

  /* Pulse animation for Overdue tasks */
  @keyframes subtlePulse {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.75; }
  }
  .overdue-alert {
    animation: subtlePulse 2s infinite ease-in-out;
  }

  /* ================= LIQUID GLASS DESIGN (iOS CONTROL CENTER) ================= */
  @keyframes floatOrb1 {
    0% { transform: translate(0px, 0px) scale(1); }
    50% { transform: translate(70px, 50px) scale(1.15); }
    100% { transform: translate(-35px, 80px) scale(0.95); }
  }
  @keyframes floatOrb2 {
    0% { transform: translate(0px, 0px) scale(1); }
    50% { transform: translate(-60px, -45px) scale(1.2); }
    100% { transform: translate(45px, -70px) scale(0.9); }
  }
  @keyframes floatOrb3 {
    0% { transform: translate(0px, 0px) scale(0.95); }
    50% { transform: translate(50px, -35px) scale(1.1); }
    100% { transform: translate(-45px, 25px) scale(1.05); }
  }
  @keyframes floatOrb4 {
    0% { transform: translate(0px, 0px) scale(1.1); }
    50% { transform: translate(-35px, 45px) scale(0.95); }
    100% { transform: translate(35px, -25px) scale(1.15); }
  }
  @keyframes liquidShine {
    0% { background-position: -200% 0; }
    100% { background-position: 200% 0; }
  }

  .orb-1 { animation: floatOrb1 16s ease-in-out infinite alternate; }
  .orb-2 { animation: floatOrb2 20s ease-in-out infinite alternate; }
  .orb-3 { animation: floatOrb3 18s ease-in-out infinite alternate; }
  .orb-4 { animation: floatOrb4 22s ease-in-out infinite alternate; }

  /* ================= LIQUID GLASS CONTROL CENTER (LIGHT THEME) ================= */
  .lg-wallpaper {
    background: radial-gradient(120% 90% at 20% 10%, #fdf8ee 0%, #efe6d6 60%, #e4d8c4 100%);
  }

  /* Liquid Glass Core (Translucent Apple Glass) */
  .lg-glass {
    position: relative;
    background: linear-gradient(145deg, rgba(255, 255, 255, 0.55) 0%, rgba(255, 255, 255, 0.22) 100%);
    backdrop-filter: blur(28px) saturate(180%);
    -webkit-backdrop-filter: blur(28px) saturate(180%);
    box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.90),
                0 18px 50px -12px rgba(60, 40, 20, 0.18);
    color: #1d1b19;
  }
  .lg-glass::before {
    content: '';
    position: absolute;
    inset: 0;
    border-radius: inherit;
    padding: 1.2px;
    pointer-events: none;
    background: linear-gradient(135deg, rgba(255, 255, 255, 0.85), rgba(255, 255, 255, 0.15) 35%, rgba(255, 255, 255, 0.05) 65%, rgba(255, 255, 255, 0.55));
    -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
    -webkit-mask-composite: xor;
    mask-composite: exclude;
  }

  /* Apple Control Center Circular Filled Buttons / Badges */
  .lg-circle {
    border-radius: 9999px;
    display: grid;
    place-items: center;
    transition: transform 0.2s cubic-bezier(0.16, 1, 0.3, 1), box-shadow 0.2s ease;
  }
  .lg-fill-blue {
    background: #0a84ff;
    color: #ffffff;
    box-shadow: 0 6px 20px rgba(10, 132, 255, 0.45), inset 0 1px 0 rgba(255, 255, 255, 0.45);
  }
  .lg-fill-orange {
    background: #ff9f0a;
    color: #ffffff;
    box-shadow: 0 6px 20px rgba(255, 159, 10, 0.45), inset 0 1px 0 rgba(255, 255, 255, 0.45);
  }
  .lg-fill-purple {
    background: #bf5af2;
    color: #ffffff;
    box-shadow: 0 6px 20px rgba(191, 90, 242, 0.45), inset 0 1px 0 rgba(255, 255, 255, 0.45);
  }
  .lg-fill-red {
    background: #ff453a;
    color: #ffffff;
    box-shadow: 0 6px 20px rgba(255, 69, 58, 0.40), inset 0 1px 0 rgba(255, 255, 255, 0.45);
  }
  .lg-fill-green {
    background: #30d158;
    color: #ffffff;
    box-shadow: 0 6px 20px rgba(48, 209, 88, 0.45), inset 0 1px 0 rgba(255, 255, 255, 0.45);
  }

  /* Segmented Control (Pill Tabs) */
  .lg-seg-on {
    background: rgba(255, 255, 255, 0.95);
    color: #0a84ff !important;
    box-shadow: 0 3px 12px rgba(60, 40, 20, 0.12);
  }
  .lg-seg-off {
    color: #6e6862 !important;
    background: transparent;
  }
  .lg-seg-off:hover {
    color: #1d1b19 !important;
    background: rgba(255, 255, 255, 0.35);
  }

  /* Translucent Pill Inputs */
  .lg-input {
    background: rgba(255, 255, 255, 0.50);
    border: 1.5px solid rgba(255, 255, 255, 0.85);
    color: #1d1b19;
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    transition: all 0.2s ease;
  }
  .lg-input:focus {
    background: #ffffff;
    border-color: #0a84ff;
    box-shadow: 0 0 0 3px rgba(10, 132, 255, 0.25);
    outline: none;
  }
  .lg-input::placeholder {
    color: #8c827a;
  }

  /* Circular 6-Digit PIN Inputs */
  .pin-digit {
    width: 3.125rem;
    height: 3.125rem;
    text-align: center;
    font-size: 1.35rem;
    font-weight: 700;
    font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
    border-radius: 9999px;
    border: 1.5px solid rgba(255, 255, 255, 0.85);
    background: rgba(255, 255, 255, 0.50);
    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);
    transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1);
    color: #1d1b19;
  }
  .pin-digit:focus {
    border-color: #0a84ff;
    background-color: #ffffff;
    box-shadow: 0 0 0 3.5px rgba(10, 132, 255, 0.30);
    outline: none;
    transform: scale(1.08);
  }

  /* Portal Glass Tiles */
  .lg-tile {
    border-radius: 2.5rem;
    transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
  }
  .lg-tile:hover {
    transform: translateY(-6px) scale(1.015);
    box-shadow: inset 0 1px 0 rgba(255, 255, 255, 1),
                0 24px 50px -10px rgba(60, 40, 20, 0.20);
  }
  .lg-tile:active {
    transform: scale(0.97);
  }

  /* Liquid Glow Action Button */
  .liquid-btn-primary {
    position: relative;
    overflow: hidden;
    transition: all 0.25s cubic-bezier(0.16, 1, 0.3, 1);
  }
  .liquid-btn-primary::after {
    content: '';
    position: absolute;
    top: -50%;
    left: -50%;
    width: 200%;
    height: 200%;
    background: linear-gradient(60deg, transparent, rgba(255, 255, 255, 0.3), transparent);
    transform: rotate(25deg);
    opacity: 0;
    transition: opacity 0.3s;
  }
  .liquid-btn-primary:hover::after {
    opacity: 1;
    animation: liquidShine 1.5s infinite;
  }
  .liquid-btn-primary:hover {
    transform: translateY(-2px);
    box-shadow: 0 12px 24px -6px rgba(36, 145, 250, 0.45);
  }
  .liquid-btn-primary:active {
    transform: translateY(0) scale(0.98);
  }

  /* Flatpickr Custom Theme (Clubhouse & Prompt font) */
  .flatpickr-calendar {
    font-family: 'Prompt', -apple-system, BlinkMacSystemFont, sans-serif !important;
    border-radius: 1.25rem !important;
    box-shadow: 0 20px 25px -5px rgba(32, 30, 28, 0.15), 0 10px 10px -5px rgba(32, 30, 28, 0.08) !important;
    border: 1px solid #EFE9DC !important;
    background: #FFFFFF !important;
    z-index: 99999 !important;
  }
  .flatpickr-calendar .flatpickr-day.selected,
  .flatpickr-calendar .flatpickr-day.startRange,
  .flatpickr-calendar .flatpickr-day.endRange {
    background: #2491FA !important;
    border-color: #2491FA !important;
    font-weight: 700 !important;
    border-radius: 0.75rem !important;
  }
  .flatpickr-calendar .flatpickr-day:hover {
    background: #EFF6FF !important;
    border-radius: 0.75rem !important;
  }
  .flatpickr-calendar .flatpickr-day.today {
    border-color: #2491FA !important;
    border-radius: 0.75rem !important;
  }
  .flatpickr-months .flatpickr-month {
    background: #FAF8F2 !important;
    border-top-left-radius: 1.25rem;
    border-top-right-radius: 1.25rem;
  }
  .flatpickr-current-month .flatpickr-monthDropdown-months {
    font-weight: 700 !important;
  }
  /* Clock Widget in Portal */
  .lg-clock-time {
    font-size: 2.5rem;
    font-weight: 600;
    letter-spacing: -1.5px;
    line-height: 1;
    font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
    color: #1d1b19;
  }
  .lg-clock-date {
    font-size: 0.75rem;
    font-weight: 500;
    color: #6e6862;
    margin-top: 0.35rem;
  }

  /* Remote Button Pulse & Hover */
  .btn-remote-pulse {
    transition: all 0.18s ease;
  }
  .btn-remote-pulse:hover {
    transform: translateY(-1px);
    box-shadow: 0 4px 12px -1px rgba(36, 145, 250, 0.35);
  }
  .btn-remote-pulse:active {
    transform: scale(0.97);
  }

  /* Toast Notifications */
  #toast-container {
    position: fixed;
    top: 1.25rem;
    right: 1.25rem;
    z-index: 99999;
    display: flex;
    flex-direction: column;
    gap: 0.5rem;
    pointer-events: none;
  }
  .toast {
    pointer-events: auto;
    transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
    opacity: 0;
    transform: translateX(2rem) scale(0.95);
  }
  .toast-show {
    opacity: 1;
    transform: translateX(0) scale(1);
  }
  .toast-hide {
    opacity: 0;
    transform: translateY(-1rem) scale(0.9);
  }

  /* Admin Center Navigation Items */
  .admin-nav-btn {
    transition: all 0.15s ease;
  }
  .admin-nav-btn.active {
    background-color: #FFFFFF;
    color: var(--ch-blue);
    font-weight: 700;
    box-shadow: 0 1px 3px 0 rgba(32, 30, 28, 0.08);
    border: 1px solid var(--ch-border);
  }
  .admin-nav-btn:not(.active) {
    color: var(--ch-text-muted);
  }
  .admin-nav-btn:not(.active):hover {
    background-color: var(--ch-card-subtle);
    color: var(--ch-text-main);
  }
</style>
